<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">

<title>Pro Hub | Powerplay Windsor</title>
<script src="arrows.js"></script>
<!--
  Pro sports story feed. Headlines, a short summary and a photo, each linking
  to the original story on the publisher's site.
  NFL, NHL, NBA and MLB stories load live from ESPN each time the page opens.
  CFL stories come from data/local-games.json ("pro_news"), which the GitHub
  Action fills from cfl.ca every 15 minutes (ESPN's CFL news is out of date).

  Embed in Wix (Embed Code > Embed a site):
    https://bbellacicco.github.io/powerplay-feed/news-feed.html
  Optional: ?tab=all | nfl | nhl | pwhl | nba | mlb | cfl  start on a league instead of "Our Teams"
-->
<style>
  :root {
    --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021;
    --nfl: #1d4ed8; --nhl: #94a3b8; --nba: #ea580c; --mlb: #0891b2; --cfl: #dc2626; --pwhl: #7c3aed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
  header { margin-bottom: 10px; }
  h1 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 17px; -webkit-text-stroke: .7px currentColor; paint-order: stroke fill; line-height: 1.1; margin: 0; letter-spacing: .03em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .sponsor { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sponsor { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sponsor .slogo { height: 36px; width: auto; max-width: 110px; object-fit: contain; border-radius: 3px; }
  .sponsor b { color: var(--text); font-weight: 600; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  select.pill { padding-right: 8px; }
  .story { display: grid; grid-template-columns: 4px 128px 1fr; gap: 12px; align-items: start;
    background: var(--row); border-radius: 8px; margin-bottom: 8px; overflow: hidden;
    color: inherit; text-decoration: none; padding-right: 12px; }
  .story:hover { background: #17336a; }
  .stripe { align-self: stretch; }
  .l-nfl .stripe { background: var(--nfl); } .l-nhl .stripe { background: var(--nhl); }
  .l-nba .stripe { background: var(--nba); } .l-mlb .stripe { background: var(--mlb); } .l-cfl .stripe { background: var(--cfl); } .l-pwhl .stripe { background: var(--pwhl); }
  .thumb { width: 128px; height: 80px; margin: 10px 0; border-radius: 6px; object-fit: cover; background: var(--panel); display: block; }
  .body { padding: 10px 0; min-width: 0; }
  .headline { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .summary { color: #d4dcee; font-size: 13px; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 3px; background: var(--line); color: var(--text); margin-right: 6px; vertical-align: 1px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  footer { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; }
  @media (max-width: 520px) {
    .story { grid-template-columns: 4px 96px 1fr; gap: 10px; }
    .thumb { width: 96px; height: 64px; }
    .headline { font-size: 14px; }
    .summary { display: none; }
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand .btext { min-width: 0; }
  .blogo { height: 38px; width: auto; max-width: 76px; object-fit: contain; flex: none; border-radius: 4px; }

  /* filter tabs: square tiles (set apart from the Games/Standings switch above) */
  #tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin: 2px 0 10px; align-items: stretch; }
  #tabs .pill { position: relative; border: 1px solid var(--line); background: #0e2044; color: var(--muted); border-radius: 4px; padding: 9px 6px 8px;
    font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tabs .pill::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tc, var(--accent)); opacity: .55; }
  #tabs .pill:hover { color: var(--text); border-color: var(--tc, var(--accent)); }
  #tabs .pill[aria-pressed="true"] { background: #fff; color: #0b1a33; border-color: #fff; font-weight: 800; }
  #tabs .pill[aria-pressed="true"]::before { opacity: 1; height: 4px; }
  select.pill { border-radius: 4px; }
  @media (max-width: 560px) { #tabs { grid-template-columns: repeat(4, 1fr); gap: 5px; } #tabs .pill { font-size: 10px; letter-spacing: .02em; padding: 8px 2px 7px; white-space: normal; line-height: 1.15; } }
  /* stories: one swipeable row, like the other strips */
  .sstrip { display: flex; gap: 10px; overflow-x: auto; padding: 0 0 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .scard { flex: 0 0 auto; width: 230px; background: var(--row); border-radius: 8px; overflow: hidden; scroll-snap-align: start;
    color: inherit; text-decoration: none; border-top: 3px solid var(--line); display: flex; flex-direction: column; }
  .scard:hover .headline { text-decoration: underline; }
  .scard.l-nfl { border-top-color: var(--nfl); } .scard.l-nhl { border-top-color: var(--nhl); } .scard.l-nba { border-top-color: var(--nba); }
  .scard.l-mlb { border-top-color: var(--mlb); } .scard.l-cfl { border-top-color: var(--cfl); } .scard.l-pwhl { border-top-color: var(--pwhl); }
  .scard .pic { position: relative; width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, #1e3a6e, #0b1a33); overflow: hidden;
    display: flex; align-items: center; justify-content: center; }
  .scard .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scard .pic .lg { font-weight: 900; font-size: 22px; letter-spacing: .08em; color: rgba(255,255,255,.85); }
  .scard .pic .play { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    background: rgba(0,0,0,.6); border: 2px solid #fff; }
  .scard .pic .play::after { content: ""; position: absolute; left: 13px; top: 9px; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .scard .body { padding: 7px 9px 10px; }
  .scard .meta { margin: 0 0 3px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard .headline { font-size: 13.5px; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .swipe { color: var(--muted); font-size: 12px; text-align: center; padding: 2px 0 4px; }
  @media (max-width: 420px) { .scard { width: 205px; } }

  /* ---- Home-page look: wide margins, plain bold titles, roomy spacing ---- */
  .wrap { max-width: 1240px; padding: 26px 40px 30px; }
  h1 { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; font-size: 24px; -webkit-text-stroke: 0; letter-spacing: .005em; text-transform: none; }
  h1 span { color: inherit; }
  header { margin-bottom: 18px; }
  .brand { gap: 12px; }
  .blogo { height: 34px; }
  .sponsor { margin-top: 3px; }
  footer { margin-top: 26px; opacity: .8; }
  @media (max-width: 700px) { .wrap { padding: 20px 16px 24px; } h1 { font-size: 21px; } }

  /* story cards like the Home page: rounded photo, headline underneath, no panel */
  .sstrip { gap: 14px; padding-bottom: 12px; scrollbar-width: none; }
  .sstrip::-webkit-scrollbar { display: none; }
  .scard { width: 260px; background: none; border-top: 0; border-radius: 0; overflow: visible; }
  .scard .thumbwrap, .scard .pic { border-radius: 8px; overflow: hidden; transition: transform .2s, box-shadow .2s; position: relative; }
  .scard:hover .thumbwrap, .scard:hover .pic { transform: scale(1.03); box-shadow: 0 10px 26px rgba(0,0,0,.45); }
  .scard:hover .headline { text-decoration: none; }
  .scard .body { padding: 9px 0 0; }
  .scard .headline { font-size: 14.5px; -webkit-line-clamp: 2; min-height: 2.6em; }
  .scard .meta { order: 2; margin: 3px 0 0; font-size: 12px; }
  .scard .body { display: flex; flex-direction: column; }
  .scard .headline { order: 1; }
  .scard .thumbwrap::after, .scard .pic::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tc, transparent); }
  .scard.t-powerplay { --tc: var(--powerplay); } .scard.t-spitfires { --tc: var(--spitfires); } .scard.t-lancers { --tc: var(--lancers); }
  .scard.t-saints { --tc: var(--saints); } .scard.t-junior { --tc: var(--junior); } .scard.t-highschool { --tc: #8b5cf6; }
  .scard.l-nfl { --tc: var(--nfl); } .scard.l-nhl { --tc: var(--nhl); } .scard.l-nba { --tc: var(--nba); } .scard.l-mlb { --tc: var(--mlb); } .scard.l-cfl { --tc: var(--cfl); } .scard.l-pwhl { --tc: var(--pwhl); }
  @media (max-width: 700px) { .scard { width: 220px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img class="blogo" src="logos/damore-group.png" alt="" onerror="this.remove()"><div class="btext"><h1>Pro <span>Hub</span></h1>
    <div class="sponsor"><span>Presented by <b>The D’Amore Group</b></span></div></div></div>
  </header>
  <div class="bar" id="tabs" role="group" aria-label="League"></div>
  <div class="bar"><select class="pill" id="team" aria-label="Team"></select></div>
  <div id="list"><div class="empty">Loading stories…</div></div>
  <footer>Powerplay Windsor · Stories from ESPN, CFL.ca and thepwhl.com. Tap a story to read it on the original site.</footer>
</div>
<script>
(function () {
  var TZ = 'America/Toronto';
  var MAX_AGE_DAYS = 14;         // hide stories older than this
  var MAX_STORIES = 40;          // per tab
  var LEAGUES = {
    nfl: { label: 'NFL', path: 'football/nfl' },
    nhl: { label: 'NHL', path: 'hockey/nhl' },
    nba: { label: 'NBA', path: 'basketball/nba' },
    mlb: { label: 'MLB', path: 'baseball/mlb' },
    cfl: { label: 'CFL' },
    pwhl: { label: 'PWHL' }
  };
  var OUR_TEAMS = [
    { league: 'nhl', abbr: 'det', name: 'Detroit Red Wings' },
    { league: 'nba', abbr: 'det', name: 'Detroit Pistons' },
    { league: 'nfl', abbr: 'det', name: 'Detroit Lions' },
    { league: 'nhl', abbr: 'tor', name: 'Toronto Maple Leafs' },
    { league: 'nhl', abbr: 'mtl', name: 'Montreal Canadiens' },
    { league: 'nba', abbr: 'tor', name: 'Toronto Raptors' },
    { league: 'nfl', abbr: 'buf', name: 'Buffalo Bills' },
    { league: 'mlb', abbr: 'det', name: 'Detroit Tigers' },
    { league: 'mlb', abbr: 'tor', name: 'Toronto Blue Jays' }
  ];
  var TABS = [['ours', 'Our Teams'], ['all', 'All'], ['nfl', 'NFL'], ['nhl', 'NHL'], ['pwhl', 'PWHL'], ['nba', 'NBA'], ['mlb', 'MLB'], ['cfl', 'CFL']];

  var qs = new URLSearchParams(location.search);
  var state = { tab: LEAGUES[qs.get('tab')] || qs.get('tab') === 'all' ? qs.get('tab') : 'ours', team: 'all' };
  var stories = { ours: [], all: [], nfl: [], nhl: [], nba: [], mlb: [], cfl: [], pwhl: [] };

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function ago(iso) {
    var t = new Date(iso).getTime(); if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 60) return Math.max(m, 1) + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.round(h / 24); if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, month: 'short', day: 'numeric' }).format(new Date(t));
  }
  function fresh(s) { return !s.published || Date.now() - new Date(s.published).getTime() < MAX_AGE_DAYS * 864e5; }

  function fromEspn(a, league) {
    var teams = (a.categories || []).filter(function (c) { return c.type === 'team'; }).map(function (c) { return c.description; });
    return {
      league: league, headline: a.headline || '', summary: a.description || '',
      published: a.published || '', image: (a.images && a.images[0] && a.images[0].url) || '',
      video: a.type === 'Media', teams: teams,
      url: (a.links && a.links.web && a.links.web.href) || '', source: 'ESPN'
    };
  }
  function espn(league, team) {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/' + LEAGUES[league].path + '/news?limit=' + (team ? 25 : 40) + (team ? '&team=' + team : '');
    return fetch(url).then(function (r) { return r.ok ? r.json() : { articles: [] }; })
      .then(function (j) {
        // skip ESPN video clips: they're geo-blocked in Canada and won't play
        return (j.articles || []).filter(function (a) { return a.type !== 'Media'; })
          .map(function (a) { return fromEspn(a, league); });
      })
      .catch(function () { return []; });
  }
  function cfl() {
    return fetch('https://bbellacicco.github.io/powerplay-feed/data/local-games.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) { return (j.pro_news || []).concat(j.more_news || []); })
      .catch(function () { return []; });
  }
  function clean(list) {
    var seen = {};
    return list.filter(function (s) {
      if (!s.url || !s.headline || seen[s.url] || !fresh(s)) return false;
      seen[s.url] = 1; return true;
    }).sort(function (a, b) { return (new Date(b.published).getTime() || 0) - (new Date(a.published).getTime() || 0); })
      .slice(0, MAX_STORIES);
  }

  function load() {
    var ours = OUR_TEAMS.map(function (t) {
      return espn(t.league, t.abbr).then(function (list) {
        // keep stories about this team, skip league-wide round-ups tagged with every team
        return list.filter(function (s) { return s.teams.length > 0 && s.teams.length <= 3 && s.teams.indexOf(t.name) >= 0; })
          .map(function (s) { s.ourTeam = t.name; return s; });
      });
    });
    Promise.all([
      Promise.all(ours).then(function (r) { return [].concat.apply([], r); }),
      espn('nfl'), espn('nhl'), espn('nba'), espn('mlb'), cfl()
    ]).then(function (r) {
      // the collector's stories: CFL.ca, thepwhl.com, Sportsnet and the clubs' own sites
      var more = r[5];
      function lg(k) { return more.filter(function (x) { return (x.league || 'cfl') === k; }); }
      // Sportsnet / club stories about one of our teams (not league round-ups naming lots of teams)
      var oursMore = more.filter(function (x) {
        return x.teams && x.teams.length && (x.source !== 'Sportsnet' || (x.sn_team_count || 0) <= 3) &&
          OUR_TEAMS.some(function (t) { return t.league === x.league && x.teams.indexOf(t.name) >= 0; });
      }).map(function (x) { return Object.assign({}, x, { ourTeam: x.teams[0] }); });
      stories = {
        ours: clean(r[0].concat(oursMore)),
        all: clean([].concat(r[1], r[2], r[3], r[4], more.filter(function (x) { return x.league !== 'other' || x.source === 'Sportsnet'; }))),
        nfl: clean(r[1].concat(lg('nfl'))), nhl: clean(r[2].concat(lg('nhl'))), nba: clean(r[3].concat(lg('nba'))),
        mlb: clean(r[4].concat(lg('mlb'))), cfl: clean(lg('cfl')), pwhl: clean(lg('pwhl'))
      };
      render();
    });
  }

  function tabs() {
    var box = document.getElementById('tabs'); box.innerHTML = '';
    TABS.forEach(function (t) {
      var b = el('button', 'pill', t[1]);
      b.setAttribute('aria-pressed', String(state.tab === t[0]));
      b.onclick = function () { state.tab = t[0]; state.team = 'all'; render(); };
      box.appendChild(b);
    });
  }

  function teamSelect(list) {
    var sel = document.getElementById('team');
    var names = {};
    if (state.tab === 'ours') OUR_TEAMS.forEach(function (t) { names[t.name] = 1; });
    else list.forEach(function (s) { (s.teams || []).forEach(function (n) { names[n] = 1; }); });
    var keys = Object.keys(names).sort();
    sel.innerHTML = '';
    sel.appendChild(new Option('All teams', 'all'));
    keys.forEach(function (n) { sel.appendChild(new Option(n, n)); });
    if (keys.indexOf(state.team) < 0) state.team = 'all';
    sel.value = state.team;
    sel.style.display = keys.length > 1 ? '' : 'none';
    sel.onchange = function () { state.team = sel.value; render(); };
  }

  function render() {
    tabs();
    var list = stories[state.tab] || [];
    teamSelect(list);
    if (state.team !== 'all') list = list.filter(function (s) {
      return state.tab === 'ours' ? s.ourTeam === state.team : (s.teams || []).indexOf(state.team) >= 0;
    });
    var box = document.getElementById('list'); box.innerHTML = '';
    if (!list.length) { box.appendChild(el('div', 'empty', 'No recent stories.')); return; }
    var strip = el('div', 'sstrip');
    list.slice(0, 40).forEach(function (s) { strip.appendChild(card(s)); });
    box.appendChild(strip);
    if (list.length > 1) box.appendChild(el('div', 'swipe', 'Swipe for more'));
  }

  function card(s) {
    var a = el('a', 'scard l-' + s.league);
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    var pic = el('div', 'pic');
    var lgLabel = (LEAGUES[s.league] || { label: s.sport || '' }).label;
    function noPic() { pic.innerHTML = ''; pic.appendChild(el('div', 'lg', (lgLabel || 'NEWS').toUpperCase())); if (s.video) pic.appendChild(el('div', 'play')); }
    if (s.image) {
      var img = el('img'); img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      img.onerror = noPic; img.src = s.image; pic.appendChild(img);
      if (s.video) pic.appendChild(el('div', 'play'));
    } else noPic();
    a.appendChild(pic);
    var body = el('div', 'body');
    var src = s.source === 'Team site' && state.tab !== 'ours' && s.teams && s.teams[0] ? s.teams[0] + ' (team site)' : s.source;
    var bits = [lgLabel || 'Sports', src, ago(s.published)];
    if (state.tab === 'ours' && s.ourTeam) bits.splice(1, 0, s.ourTeam);
    body.appendChild(el('div', 'meta', bits.filter(Boolean).join(' · ')));
    body.appendChild(el('div', 'headline', s.headline));
    a.appendChild(body);
    return a;
  }


  render();
  load();
  setInterval(load, 5 * 60 * 1000);   // new stories every 5 minutes while the page is open
})();
</script>
<script>
/* Inside the Local Sports page (sports.html): tell it how tall this widget is, so it never scrolls on its own
   (a widget that scrolls inside the page traps the finger on iPhones). */
(function () {
  if (window.parent === window || !/[?&]in=sports\b/.test(location.search)) return;
  var css = document.createElement('style'); css.textContent = 'html,body{overflow:hidden!important;height:auto!important}';
  document.head.appendChild(css);
  var last = 0;
  function send() {
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ pp: 'height', h: h }, '*'); } catch (e) {} }
  }
  window.addEventListener('load', send); window.addEventListener('resize', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
  setInterval(send, 1500); send();
})();
</script>
</body>
</html>
