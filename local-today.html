<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Scoreboard Today | Powerplay Windsor</title>
<!--
  Compact strip of current local scores, same rules as "Current Scores" in the
  Local Scoreboard: games in progress, then finals from the last day (Lancers
  football, St. Clair football, Spitfires, junior hockey, then everything else),
  then the next games coming up. Pairs with pro-today.html (e.g. in the footer).
  Embed in Wix at about 170px tall (desktop) / 190px (mobile).
  ?link=<url>  where "Full schedule" goes (default: the homepage)
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; --loss: #e5484d;
    --spitfires: #d4202a; --lancers: #0b5cad; --saints: #1f9d55; --junior: #0891b2; --highschool: #8b5cf6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 12px 6px; }
  .title { font-weight: 800; text-transform: uppercase; letter-spacing: .03em; font-size: 14px; white-space: nowrap; }
  .title span { color: var(--accent); }
  .sponsor { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sponsor b { color: var(--text); font-weight: 600; }
  .more { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .card { flex: 0 0 auto; width: 190px; background: var(--row); border-radius: 8px; padding: 8px 10px;
    scroll-snap-align: start; color: inherit; text-decoration: none; border-top: 3px solid var(--line); }
  .card.t-spitfires { border-top-color: var(--spitfires); } .card.t-lancers { border-top-color: var(--lancers); }
  .card.t-saints { border-top-color: var(--saints); } .card.t-junior { border-top-color: var(--junior); }
  .card.t-highschool { border-top-color: var(--highschool); }
  .status { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .status .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .st { white-space: nowrap; }
  .status .live { color: #fff; background: var(--loss); border-radius: 3px; padding: 0 5px; font-weight: 700; }
  .status .fin { color: var(--accent); font-weight: 700; }
  .team { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .team .n { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .s { font-weight: 800; font-variant-numeric: tabular-nums; }
  .team.ours .n { color: var(--accent); }
  .team.lost { opacity: .6; }
  .empty { color: var(--muted); padding: 10px 12px; }
  @media (max-width: 420px) { .sponsor { white-space: normal; } }
  @media (max-width: 340px) { .title { white-space: normal; } }   /* "Local Scoreboard Today" wraps instead of running into "Full schedule" on the smallest phones */
</style>
</head>
<body>
  <div class="top">
    <div style="min-width:0">
      <div class="title">Local Scoreboard <span id="when">Today</span></div>
      <div class="sponsor">Brought to you by <b>Unifor Local 444</b></div>
    </div>
    <a class="more" id="more" target="_top" href="https://www.powerplaywindsor.com/">Full schedule &rarr;</a>
  </div>
  <div class="strip" id="strip"><div class="empty">Loading…</div></div>
<script>
(function () {
  var TZ = 'America/Toronto';
  var MAX_CARDS = 8;
  var BASE = 'https://bbellacicco.github.io/powerplay-feed/data/';

  var link = new URLSearchParams(location.search).get('link');
  if (link) document.getElementById('more').href = link;

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function fmt(d, o) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: TZ }, o)).format(d); }
  function dayKey(d) { return fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  function clock(d) { return fmt(d, { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?m\.?/i, function (_, a) { return ' ' + a.toUpperCase() + 'M'; }); }
  function getJSON(name) {
    return fetch(BASE + name + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw r.status; return r.json(); });
  }

  // same team priority as the ticker and the Local Scoreboard
  function priority(g) {
    if (g.team === 'lancers' && g.sport === 'Football') return 1;
    if (g.team === 'saints' && g.sport === 'Football') return 2;
    if (g.team === 'spitfires') return 3;
    if (g.team === 'junior') return 4;
    return 5;
  }
  function staleLive(g) { return g.status === 'live' && Date.now() - new Date(g.start).getTime() > 4 * 3600e3; }

  function load() {
    Promise.all([
      getJSON('local-games.json'),
      getJSON('highschool.json').catch(function () { return null; }),
      getJSON('saints.json').catch(function () { return null; })
    ]).then(function (r) {
      var j = r[0], hs = r[1], sc = r[2];
      var games = j.games.filter(function (g) { return g.team !== 'highschool'; })
        .concat(hs && hs.games ? hs.games : j.games.filter(function (g) { return g.team === 'highschool'; }));
      if (sc && sc.games) games = games.filter(function (g) { return !(g.team === 'saints' && g.sport !== 'Football'); })
        .concat(sc.games.filter(function (g) { return g.sport !== 'Football'; }));
      show(pick(games), j.teams || {});
    }).catch(function () {
      var box = document.getElementById('strip'); box.innerHTML = '';
      box.appendChild(el('div', 'empty', 'Scores unavailable right now.')); schedule(false);
    });
  }

  function pick(games) {
    var newest = function (a, b) { return a.start < b.start ? 1 : a.start > b.start ? -1 : 0; };
    var byPrio = function (a, b) { return priority(a) - priority(b) || newest(a, b); };
    var scored = games.filter(function (g) { return (g.status === 'final' || g.status === 'live') && g.our_score != null && !staleLive(g); });
    var since = Date.now() - 864e5, now = Date.now();
    var live = scored.filter(function (g) { return g.status === 'live'; }).sort(byPrio);
    var recent = scored.filter(function (g) { return g.status === 'final' && new Date(g.start).getTime() >= since; }).sort(byPrio);
    var next = games.filter(function (g) { return g.status === 'upcoming' && new Date(g.start).getTime() >= now; })
      .sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : priority(a) - priority(b); });
    return live.concat(recent, next).slice(0, MAX_CARDS);
  }

  var timer;
  function show(list, teams) {
    var box = document.getElementById('strip'); box.innerHTML = '';
    var anyScore = list.some(function (g) { return g.status !== 'upcoming'; });
    document.getElementById('when').textContent = anyScore ? 'Today' : 'Next Up';
    if (!list.length) { box.appendChild(el('div', 'empty', 'No local games this week.')); schedule(false); return; }
    var live = false, today = dayKey(new Date());
    list.forEach(function (g) {
      var d = new Date(g.start), t = teams[g.team] || {};
      var a = el('a', 'card t-' + g.team);
      a.href = (g.links && (g.links.gamecentre || g.links.boxscore || g.links.standings)) || document.getElementById('more').href;
      a.target = '_blank'; a.rel = 'noopener';

      var label = g.team === 'spitfires' ? 'OHL' : g.team === 'saints' && g.sport === 'Football' ? 'CJFL'
        : g.team === 'highschool' ? 'High School · ' + (g.sport || '') : g.team === 'junior' ? 'Junior Hockey'
        : (t.short || '') + ' · ' + (g.sport || '');
      var s = el('div', 'status');
      s.appendChild(el('span', 'lbl', label));
      if (g.status === 'live') { live = true; s.appendChild(el('span', 'st live', 'LIVE')); }
      else if (g.status === 'final') s.appendChild(el('span', 'st fin', 'FINAL' + (dayKey(d) === today ? '' : ' · ' + fmt(d, { weekday: 'short' }))));
      else s.appendChild(el('span', 'st', (dayKey(d) === today ? '' : fmt(d, { weekday: 'short' }) + ' ') + (g.time_tbd ? 'TBA' : clock(d))));
      a.appendChild(s);

      // away on top, home underneath
      var away, home;
      if (g.home && g.away) {                                   // high school: neutral listing
        away = { n: g.away, s: g.our_score, ours: false }; home = { n: g.home, s: g.opp_score, ours: false };
      } else {
        var us = { n: g.club || t.short || g.team, s: g.our_score, ours: true };
        var them = { n: g.opponent, s: g.opp_score, ours: false };
        if (g.home_away === 'H') { away = them; home = us; } else { away = us; home = them; }
      }
      [away, home].forEach(function (x, i) {
        var other = i ? away : home;
        var lost = g.status === 'final' && x.s != null && other.s != null && x.s < other.s;
        var row = el('div', 'team' + (x.ours ? ' ours' : '') + (lost ? ' lost' : ''));
        row.appendChild(el('span', 'n', x.n));
        if (g.status !== 'upcoming' && x.s != null) row.appendChild(el('span', 's', String(x.s)));
        a.appendChild(row);
      });
      box.appendChild(a);
    });
    schedule(live);
  }

  function schedule(live) { clearTimeout(timer); timer = setTimeout(load, live ? 60000 : 180000); }
  load();
})();
</script>
</body>
</html>
