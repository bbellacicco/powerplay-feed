<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Sport Hub Today | Powerplay Windsor</title>
<!--
  Compact homepage strip: today's games for "Our Teams", live from ESPN.
  If none of the teams play today, it shows their next games instead.
  Embed in Wix at about 170px tall (desktop) / 190px (mobile).
  ?link=<url>  where "Full schedule" goes (default: the Pro Sports page)
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; --win: #2fbf71; --loss: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 8px 12px 6px; }
  .title { font-weight: 800; text-transform: uppercase; letter-spacing: .03em; font-size: 14px; white-space: nowrap; }
  .title span { color: var(--accent); }
  .sponsor { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sponsor b { color: var(--text); font-weight: 600; }
  .more { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12px; white-space: nowrap; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .card { flex: 0 0 auto; width: 190px; background: var(--row); border-radius: 8px; padding: 8px 10px;
    scroll-snap-align: start; color: inherit; text-decoration: none; border-top: 3px solid var(--line); }
  .card.live { border-top-color: var(--loss); }
  .status { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .status .live { color: #fff; background: var(--loss); border-radius: 3px; padding: 0 5px; font-weight: 700; }
  .team { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .team img { width: 20px; height: 20px; object-fit: contain; }
  .team .n { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .s { font-weight: 800; font-variant-numeric: tabular-nums; }
  .team.ours .n { color: var(--accent); }
  .team.lost { opacity: .6; }
  .empty { color: var(--muted); padding: 10px 12px; }
  @media (max-width: 420px) { .sponsor { white-space: normal; } }
</style>
</head>
<body>
  <div class="top">
    <div style="min-width:0">
      <div class="title">Pro Sport Hub <span id="when">Today</span></div>
      <div class="sponsor">Brought to you by <b>Unifor Local 2458</b></div>
    </div>
    <a class="more" id="more" target="_top" href="https://www.powerplaywindsor.com/pro-sports">Full schedule &rarr;</a>
  </div>
  <div class="strip" id="strip"><div class="empty">Loading…</div></div>
<script>
(function () {
  var TZ = 'America/Toronto';
  var PATHS = { nfl: 'football/nfl', nhl: 'hockey/nhl', nba: 'basketball/nba' };
  var LABEL = { nfl: 'NFL', nhl: 'NHL', nba: 'NBA' };
  var OUR = { nfl: ['DET', 'BUF'], nhl: ['DET', 'TOR', 'MTL'], nba: ['DET', 'TOR'] };

  var link = new URLSearchParams(location.search).get('link');
  if (link) document.getElementById('more').href = link;

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function fmt(d, o) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: TZ }, o)).format(d); }
  function ymd(d) { return fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/-/g, ''); }

  function day(d) {
    return Promise.all(Object.keys(PATHS).map(function (k) {
      return fetch('https://site.api.espn.com/apis/site/v2/sports/' + PATHS[k] + '/scoreboard?dates=' + ymd(d))
        .then(function (r) { return r.ok ? r.json() : { events: [] }; })
        .then(function (j) {
          return (j.events || []).filter(function (e) {
            return e.competitions[0].competitors.some(function (c) { return OUR[k].indexOf(c.team.abbreviation) >= 0; });
          }).map(function (e) { e._league = k; return e; });
        }).catch(function () { return []; });
    })).then(function (r) {
      return [].concat.apply([], r).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    });
  }

  var timer;
  function load() {
    var now = new Date();
    day(now).then(function (games) {
      if (games.length) return show(games, 'Today');
      // nobody plays today: look ahead up to 6 days
      var i = 1;
      (function next() {
        if (i > 6) return show([], 'Today');
        var d = new Date(now.getTime() + i * 864e5);
        day(d).then(function (g) {
          if (g.length) show(g, fmt(d, { weekday: 'long' }));
          else { i++; next(); }
        });
      })();
    });
  }

  function show(games, when) {
    document.getElementById('when').textContent = when;
    var box = document.getElementById('strip'); box.innerHTML = '';
    if (!games.length) { box.appendChild(el('div', 'empty', 'No games for our teams this week.')); schedule(false); return; }
    var live = false;
    games.forEach(function (e) {
      var comp = e.competitions[0], st = e.status.type, k = e._league;
      var a = el('a', 'card' + (st.state === 'in' ? ' live' : ''));
      a.href = (e.links && e.links[0] && e.links[0].href) || '#'; a.target = '_blank'; a.rel = 'noopener';
      var s = el('div', 'status');
      s.appendChild(el('span', null, LABEL[k] + (e.season && e.season.type === 1 ? ' · Pre' : '')));
      if (st.state === 'in') { live = true; var l = el('span', 'live', 'LIVE ' + (st.shortDetail || '')); s.appendChild(l); }
      else if (st.state === 'post') s.appendChild(el('span', null, st.shortDetail || 'Final'));
      else s.appendChild(el('span', null, fmt(new Date(e.date), { hour: 'numeric', minute: '2-digit' }).replace(/\s?([ap])\.?m\.?/i, function (_, x) { return ' ' + x.toUpperCase() + 'M'; })));
      a.appendChild(s);
      var sides = ['away', 'home'].map(function (h) { return comp.competitors.filter(function (c) { return c.homeAway === h; })[0]; });
      sides.forEach(function (c) {
        var row = el('div', 'team' + (OUR[k].indexOf(c.team.abbreviation) >= 0 ? ' ours' : '') +
          (st.state === 'post' && c.winner === false ? ' lost' : ''));
        var img = el('img'); img.alt = ''; img.src = c.team.logo || ''; img.onerror = function () { img.style.visibility = 'hidden'; };
        row.appendChild(img);
        row.appendChild(el('span', 'n', c.team.shortDisplayName || c.team.displayName));
        if (st.state !== 'pre') row.appendChild(el('span', 's', c.score));
        a.appendChild(row);
      });
      box.appendChild(a);
    });
    schedule(live);
  }

  function schedule(live) { clearTimeout(timer); timer = setTimeout(load, live ? 30000 : 120000); }
  load();
})();
</script>
</body>
</html>
