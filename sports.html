<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, indexifembedded">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Hub | Powerplay Windsor</title>
<script src="share.js?v=4"></script>
<!--
  The Pro Hub (Wix page "Pro Hub", address /local-sports), built like the Local Hub: the tabs at the top, each its own section.
    Scores     the Pro Sports Guide (our teams' games today, latest scores, coming up), like the Local Sports Guide
    NHL NFL NBA MLB CFL PWHL   each league: follow your team (a drop-down of every team), our teams (tap one for its page:
                               last game and what's next, news, schedule, standings, stats), the headlines and top stories,
                               the league's leaders, its videos (the Pro Network), then its scores, games coming up and standings
  ?tab=scores|nhl|nfl|nba|mlb|cfl|pwhl   open on that tab (old ?tab=network, upcoming and updates links open Scores; ?league=nhl opens the NHL tab)
  ?tab=nhl&team=det   that team's page
  Each widget sizes itself to fit (nothing scrolls inside the page, which traps the finger on iPhones).
-->
<style>
  :root { --bg: #0b1a33; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  /* nothing on this page scrolls by itself: on iPhones a scrolling box inside the page traps the finger */
  html, body { overflow: hidden; }
  .top { display: flex; justify-content: center; padding: 22px 16px 6px; }
  /* six sections: a squared-off grid, three across and two rows */
  .switch { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 900px; gap: 1px; background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
  .switch button { border: 0; border-radius: 0; background: #0e2044; color: #cfd8ea; font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 12px 6px; cursor: pointer; white-space: nowrap; }
  .switch button { grid-column: span 1; padding-left: 4px; padding-right: 4px; }   /* computers: two rows of six */
  .switch button:hover { color: #fff; background: #15305e; }
  .switch button[aria-selected="true"] { background: #fff; color: #0b1a33; box-shadow: inset 0 -3px 0 #e8b021; }
  .top { position: relative; align-items: center; gap: 10px; }
  .sharebtn { position: absolute; right: 16px; top: 50%; transform: translateY(-20%); }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 560px) {
    .top { padding: 16px 10px 4px; }
    .switch { max-width: none; }
    .switch { grid-template-columns: repeat(4, 1fr); }
    .switch button { padding: 11px 2px; font-size: 11px; letter-spacing: .04em; }   /* phones: four across */
    .top { flex-direction: column; } .sharebtn { position: static; transform: none; align-self: flex-end; }
  }
  .guide { margin: 18px 40px 0; }
  @media (max-width: 700px) { .guide { margin: 14px 12px 0; } }
  .subswitch { display: flex; justify-content: center; gap: 0; margin: 12px auto 0; width: max-content; max-width: calc(100% - 32px);
    border: 1px solid rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
  .subswitch button { border: 0; border-radius: 0; background: transparent; color: #9fb0cf; font: inherit; font-size: 12px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 8px 16px; cursor: pointer; }
  .subswitch button + button { border-left: 1px solid rgba(255,255,255,.16); }
  .subswitch button[aria-pressed="true"] { background: #e8b021; color: #0b1a33; }
  /* ?minute=1 (a shared Sports Minute link): the player at the top; everything else blurs while it plays */
  /* a shared link: the shared item comes first and stays sharp; the rest of the Local Hub blurs until a tap */
  /* the Pro Hub's seven tabs: one row on computers (phones: four across, like the Local Hub) */
  @media (min-width: 561px) { .pro7 .switch { grid-template-columns: repeat(7, 1fr); } }
</style>
</head>
<body>
  <div class="top pro7" id="top">
    <div class="switch" role="tablist" aria-label="Section">
      <button type="button" role="tab" data-tab="scores">Scores</button>
      <button type="button" role="tab" data-tab="nhl">NHL</button>
      <button type="button" role="tab" data-tab="nfl">NFL</button>
      <button type="button" role="tab" data-tab="nba">NBA</button>
      <button type="button" role="tab" data-tab="mlb">MLB</button>
      <button type="button" role="tab" data-tab="cfl">CFL</button>
      <button type="button" role="tab" data-tab="pwhl">PWHL</button>
    </div>
  </div>
  <div class="guide" id="guide"></div>
  <div id="panes"></div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var V = '?v=' + Math.floor(Date.now() / 3600e3);   // a fresh copy of each widget every hour
  var phone = window.innerWidth < 700;
  // each part: the widgets in it and their heights (desktop, phone)
  var PARTS = {
    scores:  [],   // Scores: the Pro Sports Guide (our teams' games today, latest scores, coming up) right under the tabs
  };
  // each league has its own section, like the Local Hub's: our teams, top stories and leaders, the league's videos
  // (the Pro Network, just that league), then its scores and standings
  var LGS = ['nhl', 'nfl', 'nba', 'mlb', 'cfl', 'pwhl'];
  var TEAM = (new URLSearchParams(location.search).get('team') || '').toLowerCase().replace(/[^a-z]/g, '');   // a team's own link
  LGS.forEach(function (lg) { PARTS[lg] = [['pro-teams.html', 1500, 2100, '&lg=' + lg], ['network.html', 1300, 1520, '&only=pro&league=' + lg + '&lock=1'], ['pro-games_3.html', 760, 900, '&tab=' + lg + '&lock=1']]; });
  function lgParam(w, tab) { return w[0] === 'pro-teams.html' && TEAM && tab === startTab ? '&team=' + TEAM : ''; }
  var built = {}, box = document.getElementById('panes');
  function show(tab) {
    if (!PARTS[tab]) tab = 'scores';
    if (!built[tab]) {
      var pane = document.createElement('div'); pane.className = 'pane'; pane.id = 'pane-' + tab;
      PARTS[tab].forEach(function (w) {
        var f = document.createElement('iframe');
        f.src = REPO + w[0] + V + w[3] + lgParam(w, tab) + '&in=sports'; f.title = w[0].replace(/[_.].*$/, '');
        f.scrolling = 'no';
        f.style.height = (phone ? w[2] : w[1]) + 'px';
        f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media'; f.allowFullscreen = true;
        f.loading = 'eager';
        pane.appendChild(f);
      });
      // a section with two parts (Stories: Powerplay's own stories / team news) shows one at a time
      var subs = PARTS[tab].filter(function (w) { return w[4]; });
      if (subs.length > 1) {
        var frames = pane.querySelectorAll('iframe'), bar = document.createElement('div'); bar.className = 'subswitch';
        var pick = function (n) {
          [].forEach.call(frames, function (f, i) { f.style.display = i === n ? '' : 'none'; });
          [].forEach.call(bar.children, function (b, i) { b.setAttribute('aria-pressed', String(i === n)); });
        };
        PARTS[tab].forEach(function (w, n) {
          var b = document.createElement('button'); b.type = 'button'; b.textContent = w[4];
          b.onclick = function () { pick(n); }; bar.appendChild(b);
        });
        pane.insertBefore(bar, pane.firstChild); pick(0);
      }
      box.appendChild(pane); built[tab] = pane;
    }
    Object.keys(built).forEach(function (k) { built[k].classList.toggle('on', k === tab); });
    document.getElementById('guide').style.display = tab === 'scores' ? '' : 'none';   // the Pro Sports Guide is the Scores section
    current = tab;
    [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    try { history.replaceState(null, '', '?tab=' + tab); } catch (e) {}
  }
  // each widget reports its height; its frame matches it exactly, so nothing scrolls inside the page
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.pp !== 'height' || !(e.data.h > 50)) return;
    [].forEach.call(document.querySelectorAll('.pane iframe'), function (f) {
      if (f.contentWindow === e.source) f.style.height = Math.min(e.data.h, 4000) + 'px';
    });
  });
  // share button: shares whichever section is showing (its own link opens the page on that section)
  var NAMES = { scores: 'the Pro Sports Guide',
    nhl: 'the NHL Hub', nfl: 'the NFL Hub', nba: 'the NBA Hub', mlb: 'the MLB Hub', cfl: 'the CFL Hub', pwhl: 'the PWHL Hub' };
  var current = 'scores';
  if (window.PPShare) {
    var sb = PPShare.button(function () { return { title: NAMES[current].replace(/^the /, 'The '), url: LGS.indexOf(current) >= 0 ? 'https://www.powerplaywindsor.com/local-sports?tab=' + current : PPShare.link(current === 'scores' ? 'pro' : 'pro-' + current), text: 'Check out ' + NAMES[current] + ' on Powerplay Windsor' }; });
    sb.classList.add('sharebtn'); document.getElementById('top').appendChild(sb);
  }
  [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.onclick = function () { show(b.getAttribute('data-tab')); }; });

  // which switch to open: ?tab= when opened directly, or the hand-off from a "See all" link elsewhere (good for 2 minutes)
  var start = new URLSearchParams(location.search).get('tab');
  if (start === 'pro') start = 'scores';
  var gs = document.createElement('script'); gs.src = REPO + 'guide.js?v=' + Math.floor(Date.now() / 6e5);
  gs.onload = function () { if (window.PPGuide) PPGuide.render(document.getElementById('guide'), { target: '_top', mode: 'pro', tips: true,
    kicker: 'Your pro sports guide', title: 'Our pro teams, all in one place', sub: 'Every game and score for the teams Windsor-Essex cheers for, checked around the clock.', sponsor: false }); };
  document.body.appendChild(gs);
  try { var h = JSON.parse(localStorage.getItem('pp-tab') || 'null'); if (h && /^pro/.test(h.tab)) { localStorage.removeItem('pp-tab'); if (!start && Date.now() - h.t < 120000) start = h.tab.replace(/^pro-?/, '') || 'scores'; } } catch (e) {}
  var oldLg = (new URLSearchParams(location.search).get('league') || '').toLowerCase();   // older links: ?league=nhl
  if (LGS.indexOf(oldLg) >= 0 && (!start || start === 'scores')) start = oldLg;
  var startTab = PARTS[start] ? start : 'scores';
  show(startTab);
})();
</script>
</body>
</html>
