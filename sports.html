<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, indexifembedded">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Hub | Powerplay Windsor</title>
<script src="share.js?v=4"></script>
<!--
  The Pro Hub (Wix page "Pro Hub", address /local-sports), built like the Local Hub: the tabs at the top, each its own section.
    Scores     the Pro Sports Guide, like the Local Sports Guide: every pro game today with the scores (and last night's),
               then the next three days. Tap a league for just its games, then pick a team
    NHL NFL NBA MLB CFL PWHL   each league: follow your team (a drop-down of every team), our teams (tap one for its page:
                               last game and what's next, news, schedule, standings, stats), the headlines and top stories,
                               the league's leaders, then its scores, games coming up and standings
  ?tab=scores|nhl|nfl|nba|mlb|cfl|pwhl   open on that tab (old ?tab=network, upcoming and updates links open Scores; ?league=nhl opens the NHL tab)
  ?tab=nhl&team=det   that team's page
  Each widget sizes itself to fit (nothing scrolls inside the page, which traps the finger on iPhones).
-->
<style>
  :root { --bg: #0b1a33; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  /* nothing on this page scrolls by itself: on iPhones a scrolling box inside the page traps the finger */
  html, body { overflow: hidden; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* iPhones don't enlarge the tab labels past the screen */
  .top { display: flex; justify-content: center; padding: 22px 16px 6px; }
  /* six sections: a squared-off grid, three across and two rows */
  .switch { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 900px; gap: 1px; background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
  .switch button { border: 0; border-radius: 0; background: #0e2044; color: #cfd8ea; font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 12px 6px; cursor: pointer; white-space: nowrap; }
  .switch button { grid-column: span 1; padding-left: 4px; padding-right: 4px; }   /* computers: two rows of six */
  .switch button:hover { color: #fff; background: #15305e; }
  .switch button[aria-selected="true"] { background: #fff; color: #0b1a33; box-shadow: inset 0 -3px 0 #e8b021; }
  .top { position: relative; align-items: center; gap: 10px; }
  .sharebtn { position: absolute; right: 16px; top: 50%; transform: translateY(-20%); }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 560px) {
    .top { padding: 16px 10px 4px; }
    .switch { max-width: none; }
    /* phones: four equal columns that never grow past the screen; a long name (High School) takes two lines */
    .switch { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .switch button { padding: 10px 2px; font-size: 10.5px; letter-spacing: .02em; white-space: normal; line-height: 1.15; min-width: 0; }
    .top { flex-direction: column; } .sharebtn { position: static; transform: none; align-self: flex-end; }
  }
  .guide { margin: 18px 40px 0; }
  /* Scores tab, under the guide: every league's standings and stats */
  .tables { margin: 22px 40px 0; }
  /* a league tab */
  .lgpane { margin: 14px 40px 0; }
  .lgbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .lgbar button { font: inherit; font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #cfd8ea; background: #13264d; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 15px; cursor: pointer; }
  .lgbar button[aria-pressed="true"] { background: #fff; color: #0b1a33; border-color: #fff; }
  .lgsel { margin-left: auto; min-width: 200px; font: inherit; font-size: 14px; font-weight: 700; color: #f2f5fb; background: #13264d; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 8px 10px; }
  .lgguide.nonews .pt-news { display: none; }
  .lgtables[hidden] { display: none; }
  .lgtables iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 700px) { .lgpane { margin: 12px 12px 0; } .lgsel { margin-left: 0; flex: 1 1 100%; } }
  .tables h2 { margin: 0 0 10px; font-size: 15px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #cfd8ea; }
  .tables .lgs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .tables .lgs button { font: inherit; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #cfd8ea; background: #13264d; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  .tables .lgs button[aria-pressed="true"] { background: #fff; color: #0b1a33; border-color: #fff; }
  .tables iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 700px) { .tables { margin: 18px 12px 0; } }
  @media (max-width: 700px) { .guide { margin: 14px 12px 0; } }
  .subswitch { display: flex; justify-content: center; gap: 0; margin: 12px auto 0; width: max-content; max-width: calc(100% - 32px);
    border: 1px solid rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
  .subswitch button { border: 0; border-radius: 0; background: transparent; color: #9fb0cf; font: inherit; font-size: 12px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 8px 16px; cursor: pointer; }
  .subswitch button + button { border-left: 1px solid rgba(255,255,255,.16); }
  .subswitch button[aria-pressed="true"] { background: #e8b021; color: #0b1a33; }
  /* ?minute=1 (a shared Sports Minute link): the player at the top; everything else blurs while it plays */
  /* a shared link: the shared item comes first and stays sharp; the rest of the Local Hub blurs until a tap */
  /* the Pro Hub's seven tabs: one row on computers (phones: four across, like the Local Hub) */
  @media (min-width: 561px) { .pro7 .switch { grid-template-columns: repeat(9, 1fr); } }
  @media (max-width: 560px) { .pro7 .switch { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
</style>
</head>
<body>
  <div class="top pro7" id="top">
    <div class="switch" role="tablist" aria-label="Section">
      <button type="button" role="tab" data-tab="scores">Scores</button>
      <button type="button" role="tab" data-tab="nhl">NHL</button>
      <button type="button" role="tab" data-tab="nfl">NFL</button>
      <button type="button" role="tab" data-tab="nba">NBA</button>
      <button type="button" role="tab" data-tab="mlb">MLB</button>
      <button type="button" role="tab" data-tab="cfl">CFL</button>
      <button type="button" role="tab" data-tab="pwhl">PWHL</button>
      <button type="button" role="tab" data-tab="ncaaf">NCAA FB</button>
      <button type="button" role="tab" data-tab="ncaam">NCAA BB</button>
    </div>
  </div>
  <div class="guide" id="guide"></div>
  <div class="tables" id="tables"></div>
  <div id="panes"></div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var V = '?v=' + Math.floor(Date.now() / 600e3);   // a fresh copy of each widget every 10 minutes
  var phone = window.innerWidth < 700;
  // each part: the widgets in it and their heights (desktop, phone)
  var PARTS = {
    scores:  [],   // Scores: the Pro Sports Guide (our teams' games today, latest scores, coming up) right under the tabs
  };
  // each league has its own section, like the Local Hub's: pick your team, headlines, top stories and leaders, then its scores and standings
  var LGS = ['nhl', 'nfl', 'nba', 'mlb', 'cfl', 'pwhl'];
  var TEAM = (new URLSearchParams(location.search).get('team') || '').toLowerCase().replace(/[^a-z]/g, '');   // a team's own link
  // each league tab: its scores bar, then News (big story, headlines, top stories, videos) or Standings & Stats, and a team drop-down
  LGS.forEach(function (lg) { PARTS[lg] = 'league'; });
  // U.S. college (the Big Ten: Michigan and Michigan State): the league page carries its own scores and standings
  ['ncaaf', 'ncaam'].forEach(function (lg) { LGS.push(lg); PARTS[lg] = 'league'; });
  function lgParam(w, tab) { return w[0] === 'pro-teams.html' && TEAM && tab === startTab ? '&team=' + TEAM : ''; }
  var built = {}, box = document.getElementById('panes');
  function show(tab) {
    if (!PARTS[tab]) tab = 'scores';
    if (!built[tab] && PARTS[tab] === 'league') { built[tab] = buildLeague(tab); box.appendChild(built[tab]); }
    if (!built[tab]) {
      var pane = document.createElement('div'); pane.className = 'pane'; pane.id = 'pane-' + tab;
      PARTS[tab].forEach(function (w) {
        var f = document.createElement('iframe');
        f.src = REPO + w[0] + V + w[3] + lgParam(w, tab) + '&in=sports'; f.title = w[0].replace(/[_.].*$/, '');
        f.scrolling = 'no';
        f.style.height = (phone ? w[2] : w[1]) + 'px';
        f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media'; f.allowFullscreen = true;
        f.loading = 'eager';
        pane.appendChild(f);
      });
      // a section with two parts (Stories: Powerplay's own stories / team news) shows one at a time
      var subs = PARTS[tab].filter(function (w) { return w[4]; });
      if (subs.length > 1) {
        var frames = pane.querySelectorAll('iframe'), bar = document.createElement('div'); bar.className = 'subswitch';
        var pick = function (n) {
          [].forEach.call(frames, function (f, i) { f.style.display = i === n ? '' : 'none'; });
          [].forEach.call(bar.children, function (b, i) { b.setAttribute('aria-pressed', String(i === n)); });
        };
        PARTS[tab].forEach(function (w, n) {
          var b = document.createElement('button'); b.type = 'button'; b.textContent = w[4];
          b.onclick = function () { pick(n); }; bar.appendChild(b);
        });
        pane.insertBefore(bar, pane.firstChild); pick(0);
      }
      box.appendChild(pane); built[tab] = pane;
    }
    Object.keys(built).forEach(function (k) { built[k].classList.toggle('on', k === tab); });
    document.getElementById('guide').style.display = tab === 'scores' ? '' : 'none';   // the Pro Sports Guide is the Scores section
    document.getElementById('tables').style.display = tab === 'scores' ? '' : 'none';
    if (tab === 'scores') buildTables();
    current = tab;
    [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    try { history.replaceState(null, '', '?tab=' + tab); } catch (e) {}
  }
  // a league tab: [News] [Standings & Stats] and "Your team", the scores bar, then the news or the tables / team page
  var LGNAME = { nhl: 'NHL', nfl: 'NFL', nba: 'NBA', mlb: 'MLB', cfl: 'CFL', pwhl: 'PWHL', ncaaf: 'NCAA football', ncaam: 'NCAA basketball' };
  var LGFRAME = {};
  function buildLeague(lg) {
    var pane = document.createElement('div'); pane.className = 'pane lgpane'; pane.id = 'pane-' + lg;
    var bar = document.createElement('div'); bar.className = 'lgbar';
    var bNews = document.createElement('button'), bTab = document.createElement('button');
    bNews.type = bTab.type = 'button'; bNews.textContent = 'News'; bTab.textContent = 'Standings & Stats';
    var sel = document.createElement('select'); sel.className = 'lgsel'; sel.setAttribute('aria-label', 'Pick your team');
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'Your team…'; sel.appendChild(o0);
    bar.appendChild(bNews); bar.appendChild(bTab); bar.appendChild(sel); pane.appendChild(bar);
    var g = document.createElement('div'); g.className = 'lgguide'; pane.appendChild(g);
    var tw = document.createElement('div'); tw.className = 'lgtables'; tw.hidden = true;
    var f = document.createElement('iframe'); f.scrolling = 'no'; f.title = LGNAME[lg] + ' standings, stats and teams';
    f.style.height = (phone ? 1400 : 1000) + 'px';
    f.src = REPO + 'pro-teams.html' + V + '&lg=' + lg + '&view=league&in=sports' + (TEAM && lg === startTab ? '&team=' + TEAM : '');
    tw.appendChild(f); pane.appendChild(tw); LGFRAME[lg] = { f: f, sel: sel, mode: mode };
    function mode(m) {
      g.classList.toggle('nonews', m !== 'news');
      tw.hidden = m === 'news';
      bNews.setAttribute('aria-pressed', String(m === 'news')); bTab.setAttribute('aria-pressed', String(m === 'tables'));
    }
    bNews.onclick = function () { mode('news'); };
    bTab.onclick = function () { sel.value = ''; try { f.contentWindow.postMessage({ pp: 'team', i: '' }, '*'); } catch (e) {} mode('tables'); };
    sel.onchange = function () {
      if (sel.value === '') return;
      try { f.contentWindow.postMessage({ pp: 'team', i: +sel.value }, '*'); } catch (e) {}
      mode('team'); bTab.setAttribute('aria-pressed', 'false');
    };
    mode(TEAM && lg === startTab ? 'team' : 'news');
    var go = function () { if (window.PPGuide) PPGuide.render(g, { target: '_top', mode: 'pro', league: lg }); else setTimeout(go, 300); };
    go();
    return pane;
  }
  // the league's team list (from its Standings page) fills the drop-down
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    Object.keys(LGFRAME).forEach(function (lg) {
      var x = LGFRAME[lg]; if (x.f.contentWindow !== e.source) return;
      if (e.data.pp === 'teams' && e.data.list) {
        while (x.sel.options.length > 1) x.sel.remove(1);
        e.data.list.forEach(function (t) { var op = document.createElement('option'); op.value = t.i; op.textContent = t.name; x.sel.appendChild(op); });
      }
      if (e.data.pp === 'teamclosed') { x.sel.value = ''; x.mode('tables'); }
    });
  });
  // Scores tab: Standings | Stats for any league, one league at a time
  var tablesBuilt = false;
  function buildTables() {
    if (tablesBuilt) return; tablesBuilt = true;
    var t = document.getElementById('tables'); t.innerHTML = '';
    var h = document.createElement('h2'); h.textContent = 'Standings & stats'; t.appendChild(h);
    var bar = document.createElement('div'); bar.className = 'lgs'; t.appendChild(bar);
    var f = document.createElement('iframe'); f.scrolling = 'no'; f.title = 'Standings and stats'; f.style.height = (phone ? 1400 : 1000) + 'px'; t.appendChild(f);
    var NM = { nhl: 'NHL', nfl: 'NFL', nba: 'NBA', mlb: 'MLB', cfl: 'CFL', pwhl: 'PWHL', ncaaf: 'NCAA FB', ncaam: 'NCAA BB' };
    var pick = function (lg) {
      f.src = REPO + 'pro-teams.html' + V + '&lg=' + lg + '&view=tables&in=sports';
      [].forEach.call(bar.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.lg === lg)); });
    };
    ['nhl', 'nfl', 'nba', 'mlb', 'cfl', 'pwhl', 'ncaaf', 'ncaam'].forEach(function (lg) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = NM[lg]; b.dataset.lg = lg;
      b.onclick = function () { pick(lg); }; bar.appendChild(b);
    });
    pick('nhl');
  }
  // each widget reports its height; its frame matches it exactly, so nothing scrolls inside the page
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.pp !== 'height' || !(e.data.h > 50)) return;
    [].forEach.call(document.querySelectorAll('.pane iframe, .tables iframe'), function (f) {
      if (f.contentWindow === e.source) f.style.height = Math.min(e.data.h, 4000) + 'px';
    });
  });
  // share button: shares whichever section is showing (its own link opens the page on that section)
  var NAMES = { scores: 'the National Sports Guide',
    nhl: 'the NHL Hub', nfl: 'the NFL Hub', nba: 'the NBA Hub', mlb: 'the MLB Hub', cfl: 'the CFL Hub', pwhl: 'the PWHL Hub', ncaaf: 'the NCAA Football Hub', ncaam: 'the NCAA Basketball Hub' };
  var current = 'scores';
  if (window.PPShare) {
    var sb = PPShare.button(function () { return { title: NAMES[current].replace(/^the /, 'The '), url: LGS.indexOf(current) >= 0 ? 'https://www.powerplaywindsor.com/local-sports?tab=' + current : PPShare.link(current === 'scores' ? 'pro' : 'pro-' + current), text: 'Check out ' + NAMES[current] + ' on Powerplay Windsor' }; });
    sb.classList.add('sharebtn'); document.getElementById('top').appendChild(sb);
  }
  [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.onclick = function () { show(b.getAttribute('data-tab')); }; });

  // which switch to open: ?tab= when opened directly, or the hand-off from a "See all" link elsewhere (good for 2 minutes)
  var start = new URLSearchParams(location.search).get('tab');
  if (start === 'pro') start = 'scores';
  var gs = document.createElement('script'); gs.src = REPO + 'guide.js?v=' + Math.floor(Date.now() / 6e5);
  gs.onload = function () { if (window.PPGuide) PPGuide.render(document.getElementById('guide'), { target: '_top', mode: 'pro', tips: true,
    kicker: 'Your national sports guide', title: 'National sports, all in one place', sub: 'Every NHL, NFL, NBA, MLB, CFL and PWHL game and score, plus Big Ten football and basketball, checked around the clock. Our teams are marked in gold.', sponsor: false }); };
  document.body.appendChild(gs);
  try { var h = JSON.parse(localStorage.getItem('pp-tab') || 'null'); if (h && /^pro/.test(h.tab)) { localStorage.removeItem('pp-tab'); if (!start && Date.now() - h.t < 120000) start = h.tab.replace(/^pro-?/, '') || 'scores'; } } catch (e) {}
  var oldLg = (new URLSearchParams(location.search).get('league') || '').toLowerCase();   // older links: ?league=nhl
  if (LGS.indexOf(oldLg) >= 0 && (!start || start === 'scores')) start = oldLg;
  var startTab = PARTS[start] ? start : 'scores';
  show(startTab);
})();
</script>
</body>
</html>
