<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Hub | Powerplay Windsor</title>
<script src="share.js"></script>
<!--
  The Pro Hub (Wix page "Sports Hub", address /local-sports): the Pro Scoreboard, then the latest pro updates.
  Each widget sizes itself to fit (nothing scrolls inside the page, which traps the finger on iPhones).
  Embed on the Wix "Sports Hub" page, full width: about 2,100px tall on desktop and on mobile.
-->
<style>
  :root { --bg: #0b1a33; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  /* nothing on this page scrolls by itself: on iPhones a scrolling box inside the page traps the finger */
  html, body { overflow: hidden; }
  .top { display: flex; justify-content: center; padding: 22px 16px 6px; }
  .switch { display: inline-flex; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 4px; gap: 2px; }
  .switch button { border: 0; background: transparent; color: #cfd8ea; font: inherit; font-size: 15px; font-weight: 800; letter-spacing: .01em; padding: 10px 22px; border-radius: 999px; cursor: pointer; }
  .switch button:hover { color: #fff; }
  .switch button[aria-selected="true"] { background: #fff; color: #0b1a33; }
  .top { position: relative; align-items: center; gap: 10px; }
  .sharebtn { position: absolute; right: 16px; top: 50%; transform: translateY(-20%); }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 400px) { .switch button { font-size: 12.5px; padding: 10px 2px; } }
  @media (max-width: 560px) {
    .top { padding: 16px 10px 4px; }
    .switch { width: 100%; justify-content: space-between; }
    .switch button { flex: 1; padding: 10px 4px; font-size: 13.5px; }
    .top { flex-direction: column; } .sharebtn { position: static; transform: none; align-self: flex-end; }
  }
  .switch { display: none; }
  .top { justify-content: flex-end; padding-top: 12px; } .sharebtn { position: static; transform: none; }
</style>
</head>
<body>
  <div class="top" id="top">
    <div class="switch" role="tablist" aria-label="Section">
      <button type="button" role="tab" data-tab="pro">Pro Hub</button>
    </div>
  </div>
  <div id="panes"></div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var V = '?v=' + Math.floor(Date.now() / 3600e3);   // a fresh copy of each widget every hour
  var phone = window.innerWidth < 700;
  // each part: the widgets in it and their heights (desktop, phone)
  var PARTS = {
    pro: [['pro-games_3.html', 760, 900, ''], ['news-feed.html', 470, 540, '']]
  };
  var built = {}, box = document.getElementById('panes');
  function show(tab) {
    if (!PARTS[tab]) tab = 'pro';
    if (!built[tab]) {
      var pane = document.createElement('div'); pane.className = 'pane'; pane.id = 'pane-' + tab;
      PARTS[tab].forEach(function (w) {
        var f = document.createElement('iframe');
        f.src = REPO + w[0] + V + w[3] + '&in=sports'; f.title = w[0].replace(/[_.].*$/, '');
        f.scrolling = 'no';
        f.style.height = (phone ? w[2] : w[1]) + 'px';
        f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media'; f.allowFullscreen = true;
        f.loading = 'eager';
        pane.appendChild(f);
      });
      box.appendChild(pane); built[tab] = pane;
    }
    Object.keys(built).forEach(function (k) { built[k].classList.toggle('on', k === tab); });
    current = tab;
    [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    try { history.replaceState(null, '', '?tab=' + tab); } catch (e) {}
  }
  // each widget reports its height; its frame matches it exactly, so nothing scrolls inside the page
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.pp !== 'height' || !(e.data.h > 50)) return;
    [].forEach.call(document.querySelectorAll('.pane iframe'), function (f) {
      if (f.contentWindow === e.source) f.style.height = Math.min(e.data.h, 4000) + 'px';
    });
  });
  // share button: shares whichever section is showing (its own link opens the page on that section)
  var NAMES = { pro: 'the Pro Hub' };
  var current = 'pro';
  if (window.PPShare) {
    var sb = PPShare.button(function () { return { title: NAMES[current].replace(/^the /, 'The '), url: PPShare.link(current), text: 'Check out ' + NAMES[current] + ' on Powerplay Windsor' }; });
    sb.classList.add('sharebtn'); document.getElementById('top').appendChild(sb);
  }
  [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.onclick = function () { show(b.getAttribute('data-tab')); }; });

  // which switch to open: ?tab= when opened directly, or the hand-off from a "See all" link elsewhere (good for 2 minutes)
  var start = new URLSearchParams(location.search).get('tab');
  try { var h = JSON.parse(localStorage.getItem('pp-tab') || 'null'); localStorage.removeItem('pp-tab'); if (!start && h && Date.now() - h.t < 120000) start = h.tab; } catch (e) {}
  show('pro');
})();
</script>
</body>
</html>
