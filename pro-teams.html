<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Teams | Powerplay Windsor</title>
<!--
  One pro league's section of the Pro Hub (powerplaywindsor.com/local-sports?tab=nhl), built like the Local Hub's sections:
    pick your team from every team in the league (its page: last game and what's next, latest news, then News · Schedule ·
    Standings · Stats), the team a fan follows,
    the league's top stories, and the league's leaders.
  ?lg=nhl|nfl|nba|mlb|cfl|pwhl     the league
  ?team=det                        open that team's page right away (its own link)
  NHL, NFL, NBA and MLB come live from ESPN; the CFL and PWHL from data/local-games.json and data/stats.json.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1a33; --card: #10244a; --card2: #132b57; --line: rgba(255,255,255,.1); --text: #f2f5fb; --muted: #a9b6d0; --accent: #e8b021; --live: #ff4d4d; --win: #3ccf7a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: inherit; }
  .page { max-width: 1100px; margin: 0 auto; padding: 6px 18px 22px; }
  h1, h2, h3 { font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400; letter-spacing: .03em; margin: 0; text-transform: uppercase; }
  h1 { font-size: 40px; line-height: 1; } h1 em, h2 em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 14px; font-size: 14px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .box + .box, .box + .grid2, .grid2 + .box { margin-top: 14px; }
  .box h3 { font-size: 21px; margin-bottom: 8px; }
  .box h2 { font-size: 24px; line-height: 1; margin-bottom: 10px; }
  .none { color: var(--muted); font-size: 14px; }
  .more { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 800; font-size: 13px; text-decoration: none; }
  /* our teams */
  .tlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
  .tbtn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--card2); border: 1px solid transparent; border-radius: 9px; padding: 10px 12px; cursor: pointer; min-height: 56px; }
  .tbtn:hover, .tbtn:focus-visible { border-color: var(--accent); outline: none; }
  .tbtn img { width: 34px; height: 34px; object-fit: contain; flex: none; }
  .tbtn .nm { font-weight: 800; flex: 1; min-width: 0; }
  .tbtn .nm small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
  .tbtn .nx { color: var(--muted); font-size: 12.5px; text-align: right; flex: none; max-width: 48%; }
  .tbtn .nx.live { color: var(--live); font-weight: 800; }
  /* pick your team: every team in the league */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .tg { display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; color: var(--text); background: var(--card2); border: 1px solid transparent; border-radius: 8px; padding: 8px 4px 7px; cursor: pointer; min-width: 0; }
  .tg img { width: 34px; height: 34px; object-fit: contain; }
  .tg .ab { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #0e2044; font-size: 11.5px; letter-spacing: .02em; }
  .tg span { font-size: 12px; font-weight: 700; line-height: 1.15; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tg:hover, .tg:focus-visible { border-color: var(--accent); outline: none; } .tg.mine { border-color: var(--accent); background: rgba(232,176,33,.14); }
  @media (max-width: 760px) { .tgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; } .tg img, .tg .ab { width: 30px; height: 30px; } .tg span { font-size: 11px; } }
  /* follow your team */
  .follow label { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .follow label span { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; }
  .follow select { flex: 1; min-width: 220px; max-width: 420px; font: inherit; font-size: 16px; font-weight: 700; color: var(--text); background: var(--card2); border: 2px solid rgba(232,176,33,.6); border-radius: 9px; padding: 9px 10px; }
  .follow .fnote { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .tbtn.mine { border-color: var(--accent); } .tbtn .yt { display: block; font-style: normal; color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .fbtn { font: inherit; font-size: 13px; font-weight: 800; color: var(--accent); background: transparent; border: 1px solid rgba(232,176,33,.6); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .fbtn.on { background: var(--accent); color: #0b1a33; }
  /* one team */
  .back { font: inherit; font-size: 14px; font-weight: 800; color: var(--accent); background: none; border: 0; padding: 6px 0; cursor: pointer; }
  .thead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 6px 0 14px; }
  .thead .lgl { color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .thr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ttabs { display: flex; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; overflow: hidden; }
  .ttabs button { border: 0; background: transparent; color: #cfd8ea; font: inherit; font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 7px 11px; cursor: pointer; }
  .ttabs button + button { border-left: 1px solid rgba(255,255,255,.18); }
  .ttabs button.on { background: var(--accent); color: #0b1a33; }
  .tpanes { margin-top: 14px; } .tpane[hidden] { display: none; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
  .next { background: linear-gradient(100deg, #17336a, #10244a); border-color: rgba(232,176,33,.45); }
  .next .when { color: var(--accent); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
  .next .vs { font-size: 22px; font-weight: 900; margin: 4px 0; line-height: 1.2; }
  .next.livebox { border-color: var(--live); } .next.livebox .when { color: var(--live); }
  .vs .w { color: #22c55e; } .vs .l { color: #ef4444; } .vs .t { color: var(--muted); }
  .upnext { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .upnext .un { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 6px 0; }
  .upnext .un b { font-size: 13px; white-space: nowrap; } .upnext .un span { color: var(--muted); font-size: 13.5px; min-width: 0; }
  .upnext .un.first b, .upnext .un.first span { color: var(--text); font-weight: 800; }
  .news a { display: block; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .news a:first-of-type { border-top: 0; }
  .news b { display: block; } .news span { color: var(--muted); font-size: 12.5px; }
  .news a:hover b { color: var(--accent); }
  .glist { display: grid; }
  .g { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .g:first-child { border-top: 0; }
  .g .d { color: var(--muted); font-size: 12.5px; font-weight: 700; line-height: 1.2; white-space: pre-line; }
  .g .o { font-weight: 700; min-width: 0; }
  .g .o small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .g .s { text-align: right; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .g .s .w { color: var(--win); } .g .s .l { color: #ff8080; } .g .s .t { color: var(--muted); } .g .s .lv { color: var(--live); }
  .g .s a { display: block; color: var(--accent); font-size: 12px; font-weight: 800; text-decoration: none; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 5px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-size: 11.5px; letter-spacing: .05em; border-top: 0; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  tr.us td { background: rgba(232,176,33,.16); font-weight: 800; }
  .tscroll { overflow-x: auto; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 18px; }
  .sgrid h3 { font-size: 18px; margin-bottom: 2px; }
  .sgrid td.tm { color: var(--muted); } .sgrid .k { color: var(--accent); font-weight: 800; }
  .stgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px 18px; }
  /* stories */
  .mgrid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; scrollbar-width: thin; gap: 10px; padding-bottom: 6px; }
  .mcard { display: flex; flex-direction: column; gap: 4px; color: var(--text); text-decoration: none; min-width: 0; }
  .mcard b { font-size: 13.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mcard span { color: var(--muted); font-size: 12px; }
  .mcard:hover b { text-decoration: underline; }
  .mpic { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #17336a, #0e2044); }
  .mpic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 760px) {
    .page { padding: 4px 12px 18px; } h1 { font-size: 32px; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .tlist { grid-template-columns: minmax(0, 1fr); }
    .mgrid { grid-auto-columns: 70%; }
    .g { grid-template-columns: 64px minmax(0, 1fr) auto; }
    .ttabs button { padding: 7px 8px; font-size: 11.5px; } .thr { width: 100%; justify-content: space-between; }
    .stgrid { grid-template-columns: minmax(0, 1fr); }
    .sgrid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .sgrid.two td, .sgrid.two th { padding: 5px 3px; font-size: 12.5px; }
  }
</style>

<div class="page" id="page">
  <div id="dir"><div class="none">Loading&hellip;</div></div>
  <div id="team" hidden></div>
</div>
<script src="share.js"></script>
<script>
(function () {
  var DATA = 'https://bbellacicco.github.io/powerplay-feed/data/';
  var SITE = 'https://www.powerplaywindsor.com/local-sports';
  var TZ = 'America/Toronto';
  var qs = new URLSearchParams(location.search);
  var LG = (qs.get('lg') || 'nhl').toLowerCase();
  var ESPN = 'https://site.api.espn.com/apis/site/v2/sports/';
  // our teams in each league, the leaders worth showing and the standings columns
  var L = {
    nhl: { name: 'NHL', path: 'hockey/nhl', teams: [['det', 'Detroit Red Wings'], ['tor', 'Toronto Maple Leafs'], ['mtl', 'Montreal Canadiens']],
           cats: ['points', 'goals', 'assists', 'wins', 'savePct', 'avgGoalsAgainst'], cols: [['GP', 'gamesPlayed'], ['W', 'wins'], ['L', 'losses'], ['OTL', 'otLosses'], ['PTS', 'points']] },
    nfl: { name: 'NFL', path: 'football/nfl', teams: [['det', 'Detroit Lions'], ['buf', 'Buffalo Bills']],
           cats: ['passingYards', 'rushingYards', 'receivingYards', 'passingTouchdowns', 'sacks', 'interceptions'], cols: [['W', 'wins'], ['L', 'losses'], ['T', 'ties'], ['PCT', 'winPercent']] },
    nba: { name: 'NBA', path: 'basketball/nba', teams: [['det', 'Detroit Pistons'], ['tor', 'Toronto Raptors']],
           cats: ['pointsPerGame', 'reboundsPerGame', 'assistsPerGame', 'stealsPerGame', 'blocksPerGame', '3PointsMadePerGame'], cols: [['W', 'wins'], ['L', 'losses'], ['PCT', 'winPercent'], ['GB', 'gamesBehind']] },
    mlb: { name: 'MLB', path: 'baseball/mlb', teams: [['det', 'Detroit Tigers'], ['tor', 'Toronto Blue Jays']],
           cats: ['avg', 'homeRuns', 'RBIs', 'ERA', 'wins', 'strikeouts', 'saves'], cols: [['W', 'wins'], ['L', 'losses'], ['PCT', 'winPercent'], ['GB', 'gamesBehind']] },
    cfl: { name: 'CFL', teams: [['TOR', 'Toronto Argonauts', /argonauts|\bargos\b/i], ['HAM', 'Hamilton Tiger-Cats', /tiger-cats|ticats/i]], local: true },
    pwhl: { name: 'PWHL', teams: [['TOR', 'Toronto Sceptres', /sceptres/i]], local: true }
  }[LG];
  if (!L) { L = { name: '', teams: [] }; }

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function get(n) { return fetch(DATA + n + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function getJ(u) { return fetch(u).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function fmt(d, o) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: TZ }, o)).format(d); }
  function dayKey(d) { return fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  var MON = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  function cpTime(d) { var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p.hour + (p.minute === '00' ? '' : ':' + p.minute) + ' ' + (/p/i.test(p.dayPeriod) ? 'p.m.' : 'a.m.'); }
  function cpDay(d) { var today = dayKey(new Date()), k = dayKey(d);
    if (k === today) return 'Today'; if (k === dayKey(new Date(Date.now() + 864e5))) return 'Tomorrow'; if (k === dayKey(new Date(Date.now() - 864e5))) return 'Yesterday';
    var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, weekday: 'short', month: 'numeric', day: 'numeric' }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p.weekday.replace('.', '') + '., ' + MON[+p.month - 1] + ' ' + (+p.day); }
  function when(g) { var d = new Date(g.start); return cpDay(d) + (g.tbd ? '' : ' · ' + cpTime(d)); }
  function sc(g) { return g.us != null && g.them != null ? g.us + '–' + g.them + ' ' : ''; }   // the score, or nothing when it isn't posted yet
  function wl(g) { return g.us == null || g.them == null ? '' : g.us > g.them ? 'W' : g.us < g.them ? 'L' : 'T'; }
  function atw(g) { return g.home ? 'vs.' : 'at'; }
  function ext(a, href) { a.href = href; a.target = /powerplaywindsor\.com/.test(href) ? '_top' : '_blank'; a.rel = 'noopener'; return a; }

  // ---------- data ----------
  var LGJ = null, STATS = null, CUR = null;   // CUR: the team whose page is open (its players are highlighted in the league's leaders)
  var teams = L.teams.map(function (x) { return { id: x[0].toLowerCase(), abbr: x[0], name: x[1], rx: x[2] || new RegExp(x[1].split(' ').pop(), 'i'), games: [], info: {} }; });
  var BYID = {}; teams.forEach(function (t) { BYID[t.id] = t; });

  // an ESPN game, from the team's side
  function espnGame(t, e) {
    var c = e.competitions && e.competitions[0]; if (!c) return null;
    var me = c.competitors.filter(function (x) { return String(x.team.abbreviation).toLowerCase() === t.id || String(x.team.id) === String(t.info.id); })[0];
    var op = c.competitors.filter(function (x) { return x !== me; })[0]; if (!me || !op) return null;
    var st = c.status && c.status.type || {}, sc = function (x) { return x.score == null ? null : Number(typeof x.score === 'object' ? x.score.value : x.score); };
    var lk = (e.links || []).filter(function (l) { return (l.rel || []).indexOf('desktop') >= 0; })[0];
    return { eid: e.id, start: e.date, home: me.homeAway === 'home', opp: op.team.displayName || op.team.shortDisplayName, oppShort: op.team.shortDisplayName || op.team.displayName,
             status: st.state === 'post' ? (st.completed === false ? 'off' : 'final') : st.state === 'in' ? 'live' : 'upcoming',
             us: sc(me), them: sc(op), detail: st.shortDetail || '', note: /OT|SO|\//.test(st.shortDetail || '') && st.state === 'post' ? (st.shortDetail || '').replace(/^Final\/?/, '') : '',
             where: c.venue && c.venue.fullName || '', link: lk && lk.href, tbd: e.timeValid === false };
  }
  // a CFL or PWHL game (data/local-games.json: away, home, our_score = away's, opp_score = home's)
  function localGame(t, g) {
    var home = g.home_abbr === t.abbr || t.rx.test(g.home || ''), away = g.away_abbr === t.abbr || t.rx.test(g.away || '');
    if (!home && !away) return null;
    return { start: g.start, home: home, opp: home ? g.away : g.home, oppShort: home ? g.away : g.home, status: g.status === 'postponed' ? 'off' : g.status,
             us: home ? g.opp_score : g.our_score, them: home ? g.our_score : g.opp_score, detail: g.note || '', note: g.status === 'final' ? g.note || '' : '',
             where: g.location || '', link: g.link || (g.links && g.links.gamecentre), tbd: g.time_tbd };
  }
  function loadTeam(t) {
    if (L.local) {
      var all = ((LGJ && LGJ.pro_games) || []).concat((LGJ && LGJ.pro_ahead) || []).filter(function (g) { return (g.league || g.team) === LG; });
      var seen = {};
      t.games = all.map(function (g) { return localGame(t, g); }).filter(function (g) { if (!g) return false; var k = g.start + g.opp; if (seen[k]) return false; seen[k] = 1; return true; })
        .sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
      return Promise.resolve(t);
    }
    return getJ(ESPN + L.path + '/teams/' + (t.espn || t.id) + '/schedule').then(function (j) {
      if (!j) return t;
      t.info = j.team || {};
      if (t.info.displayName) t.name = t.info.displayName;
      t.games = (j.events || []).map(function (e) { return espnGame(t, e); }).filter(Boolean).sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
      // the season schedule doesn't carry live scores: today's scoreboard does
      if (!t.games.some(function (g) { return g.status === 'live' || (g.status === 'final' && g.us == null); })) return t;
      return scoreboard().then(function (sb) {
        t.games = t.games.map(function (g) { var e = sb[g.eid]; var n = e && espnGame(t, e); return n || g; });
        return t;
      });
    });
  }
  var sbP = null, sbT = 0;
  function scoreboard() {
    if (!sbP || Date.now() - sbT > 60000) { sbT = Date.now();
      sbP = getJ(ESPN + L.path + '/scoreboard').then(function (j) { var by = {}; ((j && j.events) || []).forEach(function (e) { by[e.id] = e; }); return by; }); }
    return sbP;
  }
  function status(t) {
    var live = t.games.filter(function (g) { return g.status === 'live'; })[0];
    if (live) return { live: true, text: 'LIVE ' + sc(live) + atw(live) + ' ' + live.oppShort };
    var nx = upcoming(t)[0]; if (nx) return { text: 'Next: ' + when(nx) + ' ' + atw(nx) + ' ' + nx.oppShort };
    var last = finals(t)[0]; if (last) return { text: 'Last: ' + (wl(last) ? wl(last) + ' ' : '') + sc(last) + atw(last) + ' ' + last.oppShort };
    return { text: '' };
  }
  function upcoming(t) { var now = Date.now(); return t.games.filter(function (g) { return g.status === 'upcoming' && new Date(g.start) > now - 3 * 3600e3; }); }
  function finals(t) { return t.games.filter(function (g) { return g.status === 'final'; }).reverse(); }

  // a league's stories: ESPN's league (or team) news plus Sportsnet and the league sites (data/local-games.json)
  function stories(team) {
    var tid = team && String(team.info.id || team.espn || team.id);
    var espn = L.path ? getJ(ESPN + L.path + '/news?limit=' + (team ? 50 : 25) + (team ? '&team=' + tid : '')).then(function (j) {
      return ((j && j.articles) || []).filter(function (a) { if (a.type === 'Preview' || !a.links || !a.links.web) return false;
        if (!team) return true;     // a team's: tagged with just a few teams, ours among them, or naming the team
        var tc = (a.categories || []).filter(function (c) { return c.type === 'team'; });
        return (tc.length && tc.length <= 3 && tc.some(function (c) { return String(c.teamId) === tid; })) || team.rx.test(a.headline || ''); }).map(function (a) {
        return { headline: a.headline, url: a.links.web.href.replace(/^http:/, 'https:'), img: a.images && a.images[0] && !/stitcher/.test(a.images[0].url) ? a.images[0].url : '', at: a.published, src: 'ESPN' }; }); }) : Promise.resolve([]);
    return espn.then(function (list) {
      var more = ((LGJ && (LGJ.pro_news || []).concat(LGJ.more_news || [])) || []).filter(function (n) { return (n.league || '').toLowerCase() === LG && n.url && n.headline &&
        (!team || team.rx.test(n.headline + ' ' + (n.summary || '') + ' ' + (n.teams || []).join(' '))); })

    window.addEventListener('load', send); window.addEventListener('resize', send);
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.getElementById('page')); setInterval(send, 1500); send();
  })();
})();
</script>
