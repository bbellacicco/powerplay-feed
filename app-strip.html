<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
<title>Add the Powerplay App | Powerplay Windsor</title>
<!--
  How to put PowerplayWindsor.com on your phone's home screen, like an app.
  iPhone and Android tabs; it opens on the right one for the phone it's viewed on.
  Embed in Wix full width: about 200px tall on desktop, 380px on mobile.
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden; font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .box { display: flex; gap: 14px; padding: 10px 12px 12px; align-items: stretch; }
  .photo { flex: 0 0 200px; border-radius: 10px; overflow: hidden; background: var(--panel); position: relative; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 60%, var(--bg)); }
  .main { flex: 1; min-width: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .title { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; text-transform: uppercase; letter-spacing: .02em; font-size: 14px;
    -webkit-text-stroke: .5px currentColor; line-height: 1.15; }
  .title span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tab { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 800; font-size: 12px; padding: 6px 13px; border-radius: 999px; cursor: pointer; }
  .tab.on { background: var(--accent); color: #0b1a33; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; counter-reset: step; }
  .step { background: var(--row); border-radius: 8px; padding: 10px 10px 11px; border-top: 3px solid var(--accent); display: flex; flex-direction: column; gap: 6px; }
  .step .n { display: flex; align-items: center; gap: 8px; }
  .step .n b { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #0b1a33; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; flex: none; }
  .step svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .step p { margin: 0; font-size: 12.5px; line-height: 1.3; }
  .step p strong { color: var(--accent); }
  .note { color: var(--muted); font-size: 11px; margin-top: 7px; }
  @media (max-width: 760px) { .photo { display: none; } }
  @media (max-width: 560px) { .steps { grid-template-columns: 1fr 1fr; } .tab { padding: 6px 11px; } }
</style>
</head>
<body>
<div class="box">
  <div class="photo"><img src="logos/app-phone.jpg" alt="" onerror="this.parentNode.remove()"></div>
  <div class="main">
    <div class="top">
      <div>
        <div class="title">Add the <span>Powerplay app</span></div>
        <div class="sub">Scores and stories one tap away. No app store, no download, free.</div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" role="tab" data-os="ios">iPhone</button>
        <button class="tab" type="button" role="tab" data-os="android">Android</button>
      </div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
(function () {
  var ICON = {
    globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    dots: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>',
    phone: '<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>'
  };
  var STEPS = {
    ios: [
      ['globe', 'Open <strong>Safari</strong> and go to PowerplayWindsor.com'],
      ['share', 'Tap the <strong>Share</strong> button (the square with an arrow up)'],
      ['plus', 'Scroll down and tap <strong>Add to Home Screen</strong>'],
      ['check', 'Tap <strong>Add</strong>. Powerplay is now on your home screen']
    ],
    android: [
      ['globe', 'Open <strong>Chrome</strong> and go to PowerplayWindsor.com'],
      ['dots', 'Tap the <strong>three dots</strong> in the top right corner'],
      ['plus', 'Tap <strong>Add to Home screen</strong> (or <strong>Install app</strong>)'],
      ['check', 'Tap <strong>Add</strong> or <strong>Install</strong>. You’re all set']
    ]
  };
  var NOTE = {
    ios: 'On newer iPhones, Chrome works too: tap the Share button at the top, then Add to Home Screen.',
    android: 'Using Samsung Internet? Tap the menu (three lines), then Add page to, then Home screen.'
  };
  function set(os) {
    [].forEach.call(document.querySelectorAll('.tab'), function (b) { var on = b.getAttribute('data-os') === os; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    document.getElementById('steps').innerHTML = STEPS[os].map(function (s, i) {
      return '<div class="step"><div class="n"><b>' + (i + 1) + '</b>' + ICON[s[0]] + '</div><p>' + s[1] + '</p></div>';
    }).join('');
    document.getElementById('note').textContent = NOTE[os];
  }
  [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.onclick = function () { set(b.getAttribute('data-os')); }; });
  // open on the tab for the phone it's being read on (desktop shows iPhone first)
  var ua = navigator.userAgent || '';
  set(/android/i.test(ua) ? 'android' : 'ios');
})();
</script>
</body>
</html>
