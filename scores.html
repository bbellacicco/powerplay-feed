<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, indexifembedded">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Hub | Powerplay Windsor</title>
<script src="share.js?v=4"></script>
<!--
  The Local Hub (Wix page "Local Scores", address /scores-standings), with a switch at the top:
    Scores     the Local Scoreboard (games, standings)
    Coming Up  every local game on one day (today, or a day picked)
    Stories    every Powerplay blog story (top stories, team rows, search back to 2019), plus team news
    Spotlight  The Local Sports Spotlight
    Athletes   Athlete Profiles
    Network    the Powerplay Network videos
  ?tab=stories|scores|upcoming|network|spotlight|athletes   open on that switch (default: stories)
  Each widget sizes itself to fit (nothing scrolls inside the page, which traps the finger on iPhones).
  Embed on the Wix "Local Scores" page, full width: about 1,900px tall on desktop, 2,150px on mobile.
-->
<style>
  :root { --bg: #0b1a33; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  /* nothing on this page scrolls by itself: on iPhones a scrolling box inside the page traps the finger */
  html, body { overflow: hidden; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* iPhones don't enlarge the tab labels past the screen */
  .top { display: flex; justify-content: center; padding: 22px 16px 6px; }
  /* six sections: a squared-off grid, three across and two rows */
  .switch { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 900px; gap: 1px; background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
  .switch button { border: 0; border-radius: 0; background: #0e2044; color: #cfd8ea; font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 12px 6px; cursor: pointer; white-space: nowrap; }
  .switch button { grid-column: span 1; padding-left: 4px; padding-right: 4px; }   /* computers: two rows of six */
  .switch button:hover { color: #fff; background: #15305e; }
  .switch button[aria-selected="true"] { background: #fff; color: #0b1a33; box-shadow: inset 0 -3px 0 #e8b021; }
  .top { position: relative; align-items: center; gap: 10px; }
  .sharebtn { position: absolute; right: 16px; top: 50%; transform: translateY(-20%); }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane iframe { display: block; width: 100%; border: 0; background: var(--bg); }
  @media (max-width: 560px) {
    .top { padding: 16px 10px 4px; }
    .switch { max-width: none; }
    /* phones: four equal columns that never grow past the screen; a long name (High School) takes two lines */
    .switch { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .switch button { padding: 10px 2px; font-size: 10.5px; letter-spacing: .02em; white-space: normal; line-height: 1.15; min-width: 0; }
    .top { flex-direction: column; } .sharebtn { position: static; transform: none; align-self: flex-end; }
  }
  .guide { margin: 18px 40px 0; }
  @media (max-width: 700px) { .guide { margin: 14px 12px 0; } }
  .subswitch { display: flex; justify-content: center; gap: 0; margin: 12px auto 0; width: max-content; max-width: calc(100% - 32px);
    border: 1px solid rgba(255,255,255,.16); border-radius: 3px; overflow: hidden; }
  .subswitch button { border: 0; border-radius: 0; background: transparent; color: #9fb0cf; font: inherit; font-size: 12px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 8px 16px; cursor: pointer; }
  .subswitch button + button { border-left: 1px solid rgba(255,255,255,.16); }
  .subswitch button[aria-pressed="true"] { background: #e8b021; color: #0b1a33; }
  /* ?minute=1 (a shared Sports Minute link): the player at the top; everything else blurs while it plays */
  #minuteframe { margin: 12px 0 0; padding: 0 40px; }
  @media (max-width: 700px) { #minuteframe { padding: 0 12px; } }
  html.mplaying body > *:not(#minuteframe) { filter: blur(6px) brightness(.6); pointer-events: none; }
  /* a shared link: the shared item comes first and stays sharp; the rest of the Local Hub blurs until a tap */
  html.ppfocus #guide, html.ppfocus #top, html.ppfocus #teambar:not(.focal), html.ppfocus .pane > :not(.focal) { filter: blur(6px) brightness(.55); cursor: pointer; }
  html.ppfocus #guide *, html.ppfocus #top *, html.ppfocus #teambar:not(.focal), html.ppfocus .pane > :not(.focal) { pointer-events: none; }
  #guide, #top, #teambar, .pane > * { transition: filter .3s; }
  body > * { transition: filter .3s; }
</style>
</head>
<body>
  <iframe id="minuteframe" title="Powerplay Sports Minute" scrolling="no" style="display:none;width:100%;height:0;border:0;background:transparent"></iframe>
<script>
(function () {
  if (!/[?&]minute=1\b/.test(location.search)) return;
  var f = document.getElementById('minuteframe');
  f.src = 'minute.html?v=' + Math.floor(Date.now() / 6e5); f.style.display = 'block';
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (e.source !== f.contentWindow) return;
    if (typeof d.ppMinuteH === 'number') f.style.height = d.ppMinuteH + 'px';
    if (d.ppMinute) document.documentElement.classList.toggle('mplaying', d.ppMinute === 'play');
  });
})();
</script>
  <iframe id="contestframe" title="Win Spitfires tickets" scrolling="no" style="display:none;width:100%;height:0;border:0;background:transparent"></iframe>
<script>
/* the ticket bar in the site header (?contest=spitfires, passed on as contest=1): the contest opens right at the top */
(function () {
  if (!/[?&]contest=1\b/.test(location.search)) return;
  var f = document.getElementById('contestframe');
  f.src = 'contest-strip.html?v=' + Math.floor(Date.now() / 6e5); f.style.display = 'block';
  // same site, so it can be measured: the frame is exactly as tall as the contest box
  function size() {
    var h = window.innerWidth < 700 ? 340 : 200;
    try { var st = f.contentDocument.querySelector('.strip'); if (st) h = Math.ceil(st.getBoundingClientRect().bottom + 8); } catch (e) {}
    f.style.height = h + 'px';
  }
  size(); f.addEventListener('load', function () { size(); setTimeout(size, 800); setTimeout(size, 2500); }); window.addEventListener('resize', size);
})();
</script>
  <iframe id="teambar" title="Local Teams" scrolling="no" style="display:none;width:100%;height:58px;border:0;background:#10244a"></iframe>
  <div class="top" id="top">
    <div class="switch" role="tablist" aria-label="Section">
      <button type="button" role="tab" data-tab="scores">Scores</button>
      <button type="button" role="tab" data-tab="upcoming">Coming Up</button>
      <button type="button" role="tab" data-tab="stories">What&rsquo;s New</button>
      <button type="button" role="tab" data-tab="spitfires">Spitfires</button>
      <button type="button" role="tab" data-tab="hs">High School</button>
      <button type="button" role="tab" data-tab="saints">Saints</button>
      <button type="button" role="tab" data-tab="lancers">Lancers</button>
      <button type="button" role="tab" data-tab="junior">Junior</button>
      <button type="button" role="tab" data-tab="athletes">Athletes</button>
      <button type="button" role="tab" data-tab="network">Network</button>
      <button type="button" role="tab" data-tab="spotlight">Spotlight</button>
    </div>
  </div>
  <div class="guide" id="guide"></div>
  <div id="panes"></div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var V = '?v=' + Math.floor(Date.now() / 3600e3);   // a fresh copy of each widget every hour
  var phone = window.innerWidth < 700;
  // each part: the widgets in it and their heights (desktop, phone)
  var HUB = encodeURIComponent('https://www.powerplaywindsor.com/scores-standings');
  var PARTS = {
    scores:    [],   // Scores: the sports guide (today's games, latest scores, coming up) right under the tabs; each team's page has its own scores, standings and stats
    upcoming:  [['upcoming.html', 900, 1100, '']],
    // a part with no name of its own goes with the named part above it (Powerplay stories = What's Going On + Every story)
    // Stories: two strips stacked, Powerplay's (with its top story) and team news, then every Powerplay story
    stories:   [['home.html', 1000, 1350, '&view=hub'], ['local-news.html', 470, 570, '&other=none&lock=1'], ['news.html', 900, 1300, '&every=1']],
    // each team section: its teams up top (tap one for its page: schedule, standings, stats, news), the group's
    // results and games coming up under them, then the homepage strip
    spitfires: [['teams.html', 1300, 1700, '&find=spitfires&solo=1'], ['home.html', 430, 430, '&view=strip&strip=spitfires']],
    hs:        [['teams.html', 900, 1300, '&only=hs'], ['home.html', 430, 430, '&view=strip&strip=hs']],
    saints:    [['teams.html', 900, 1300, '&only=saints'], ['home.html', 430, 430, '&view=strip&strip=saints']],
    lancers:   [['teams.html', 900, 1300, '&only=lancers'], ['home.html', 430, 430, '&view=strip&strip=lancers']],
    junior:    [['teams.html', 900, 1300, '&only=junior'], ['home.html', 430, 430, '&view=strip&strip=junior']],
    spotlight: [['spotlight.html', 1250, 1180, '']],
    athletes:  [['athletes.html', 420, 380, '']],
    network:   [['network.html', 1300, 1520, '&only=local']]
  };
  // a shared video link (powerplaywindsor.com/scores-standings?tab=network&v=...) opens the Network with it playing
  var PLAY = (new URLSearchParams(location.search).get('play') || '').replace(/[^\w-]/g, '');
  // a shared team story (powerplaywindsor.com/scores-standings?tab=stories&s=...) opens Stories > Team news with it on top
  var STORY = (new URLSearchParams(location.search).get('story') || '').replace(/[^0-9a-f]/g, '');
  var PROFILE = (new URLSearchParams(location.search).get('profile') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');   // a shared athlete profile
  var TEAM = (new URLSearchParams(location.search).get('team') || '').replace(/[^a-z]/g, '');   // the shared story's team
  var POST = (new URLSearchParams(location.search).get('post') || '').replace(/[^0-9a-f]/g, '');   // a shared quick post (photo + a few words)
  var FIND = (new URLSearchParams(location.search).get('find') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');   // a team's own link (Find a team)
  // the Find a team bar across the top: Spitfires, Lancers, Saints, junior hockey, high school; a team opens right under it
  // the sports guide (today's games, latest scores, Coming Up, the Pro Hub line) leads the Local Hub.
  // A team's own link (?find=essex-73s) opens that team in the Local Teams bar instead, above it
  var LEAGUE = (new URLSearchParams(location.search).get('league') || '').toLowerCase().replace(/[^a-z]/g, '');   // a league's list (from the blog strip)
  if (FIND || /^(lancers|saints|junior|hs)$/.test(LEAGUE)) { var tbf = document.getElementById('teambar'); tbf.style.display = 'block';
    tbf.src = REPO + 'teams.html' + V + '&view=bar&in=sports&title=Local%20Teams' + (FIND ? '&find=' + FIND : '&league=' + LEAGUE); }
  // a shared link to one thing (a quick post, a story, a video, an athlete, a team): it goes first, right at the top,
  // with the sports guide and the section switch moved underneath and the rest blurred until the visitor taps
  var CONTEST = /[?&]contest=1\b/.test(location.search);
  var DEEP = CONTEST ? 'contest' : POST ? 'home.html' : STORY ? 'local-news.html' : PLAY ? 'play' : PROFILE ? 'athletes.html' : FIND ? 'find' : '';
  var H = document.documentElement;
  function unfocus() {
    if (!H.classList.contains('ppfocus')) return;
    H.classList.remove('ppfocus');
    [].forEach.call(document.querySelectorAll('iframe'), function (f) { try { f.contentWindow.postMessage({ pp: 'unfocus' }, '*'); } catch (e) {} });
  }
  if (DEEP) {
    H.classList.add('ppfocus');
    if (DEEP === 'contest') document.getElementById('contestframe').classList.add('focal');
    else if (DEEP === 'find') document.getElementById('teambar').classList.add('focal');
    else { var pn = document.getElementById('panes'); pn.parentNode.insertBefore(pn, document.getElementById('guide')); pn.parentNode.insertBefore(document.getElementById('top'), document.getElementById('guide')); }
    document.addEventListener('click', function (e) { if (H.classList.contains('ppfocus')) { e.preventDefault(); e.stopPropagation(); unfocus(); } }, true);
    window.addEventListener('message', function (e) { if (e.data && e.data.pp === 'unfocus') unfocus(); });
    setTimeout(unfocus, 120000);   // never leaves the page blurred for good
  }
  var gs = document.createElement('script'); gs.src = REPO + 'guide.js?v=' + Math.floor(Date.now() / 6e5);
  gs.onload = function () { if (window.PPGuide) PPGuide.render(document.getElementById('guide'), { target: '_top', pro: false }); };   // local only: no Pro Hub line here
  document.body.appendChild(gs);
  var built = {}, box = document.getElementById('panes');
  function show(tab) {
    if (!PARTS[tab]) tab = 'scores';
    if (!built[tab]) {
      var pane = document.createElement('div'); pane.className = 'pane'; pane.id = 'pane-' + tab;
      var parts = PARTS[tab].slice();
      if (tab === 'stories' && STORY) parts.sort(function (a, b) { return (b[0] === 'local-news.html') - (a[0] === 'local-news.html'); });   // a shared team story: team news first
      parts.forEach(function (w) {
        var f = document.createElement('iframe');
        f.src = REPO + w[0] + V + w[3] + ((tab === 'network' || tab === 'spotlight') && PLAY ? '&play=' + encodeURIComponent(PLAY) : '') + (tab === 'athletes' && PROFILE ? '&p=' + PROFILE : '') + (tab === 'stories' && STORY && w[0] === 'local-news.html' ? '&story=' + STORY + (TEAM ? '&tab=' + TEAM : '') : '') + (tab === 'stories' && POST && w[0] === 'home.html' ? '&post=' + POST : '') + '&in=sports'; f.title = w[0].replace(/[_.].*$/, '');
        var isFocal = DEEP && (DEEP === w[0] || (DEEP === 'play' && (w[0] === 'network.html' || w[0] === 'spotlight.html')));
        if (isFocal) { f.classList.add('focal'); f.src += '&focus=1'; }
        f.scrolling = 'no';
        f.style.height = (phone ? w[2] : w[1]) + 'px';
        f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media'; f.allowFullscreen = true;
        f.loading = 'eager';
        pane.appendChild(f);
      });
      // a section with two parts (Stories: Powerplay's own stories / team news) shows one at a time
      var subs = PARTS[tab].filter(function (w) { return w[4]; });
      if (subs.length > 1) {
        var frames = pane.querySelectorAll('iframe'), bar = document.createElement('div'); bar.className = 'subswitch';
        var group = [], g = -1;
        PARTS[tab].forEach(function (w) { if (w[4]) g++; group.push(Math.max(g, 0)); });
        var pick = function (n) {
          [].forEach.call(frames, function (f, i) { f.style.display = group[i] === n ? '' : 'none'; });
          [].forEach.call(bar.children, function (b, i) { b.setAttribute('aria-pressed', String(i === n)); });
        };
        subs.forEach(function (w, n) {
          var b = document.createElement('button'); b.type = 'button'; b.textContent = w[4];
          b.onclick = function () { pick(n); }; bar.appendChild(b);
        });
        pane.insertBefore(bar, pane.firstChild); pick(tab === 'stories' && STORY ? 1 : 0);
      }
      box.appendChild(pane); built[tab] = pane;
    }
    Object.keys(built).forEach(function (k) { built[k].classList.toggle('on', k === tab); });
    document.getElementById('guide').style.display = tab === 'scores' ? '' : 'none';   // the sports guide is the Scores section
    current = tab;
    [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    try { history.replaceState(null, '', '?tab=' + tab + ((tab === 'network' || tab === 'spotlight') && PLAY ? '&play=' + PLAY : '') + (tab === 'athletes' && PROFILE ? '&profile=' + PROFILE : '') + (tab === 'stories' && STORY ? '&story=' + STORY : '') + (tab === 'stories' && POST ? '&post=' + POST : '')); } catch (e) {}
  }
  // each widget reports its height; its frame matches it exactly, so nothing scrolls inside the page
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.pp !== 'height' || !(e.data.h > 30)) return;
    [].forEach.call(document.querySelectorAll('.pane iframe, #teambar'), function (f) {
      if (f.contentWindow === e.source) f.style.height = Math.min(e.data.h, 9000) + 'px';
    });
  });
  // share button: shares whichever section is showing (its own link opens the page on that section)
  var NAMES = { scores: 'Local Scores', upcoming: 'Coming Up: local games', stories: 'What\u2019s New', spotlight: 'The Local Sports Spotlight', athletes: 'Athlete Profiles', network: 'the Powerplay Network',
    spitfires: 'the Windsor Spitfires', hs: 'High School Huddle', saints: 'Saints Nation', lancers: 'Lancers Lounge', junior: 'Junior Hockey' };
  var current = 'scores';
  if (window.PPShare) {
    var sb = PPShare.button(function () { return { title: NAMES[current].replace(/^the /, 'The '), url: PPShare.link(current), text: 'Check out ' + NAMES[current] + ' on Powerplay Windsor' }; });
    sb.classList.add('sharebtn'); document.getElementById('top').appendChild(sb);
  }
  [].forEach.call(document.querySelectorAll('.switch button'), function (b) { b.onclick = function () { show(b.getAttribute('data-tab')); }; });

  // which switch to open: ?tab= when opened directly, or the hand-off from a "See all" link elsewhere (good for 2 minutes)
  var start = new URLSearchParams(location.search).get('tab');
  try { var h = JSON.parse(localStorage.getItem('pp-tab') || 'null'); localStorage.removeItem('pp-tab'); if (!start && h && Date.now() - h.t < 120000) start = h.tab; } catch (e) {}
  show(PLAY ? (start === 'spotlight' ? 'spotlight' : 'network') : PROFILE ? 'athletes' : STORY ? 'stories' : (start || 'scores'));   // opens on Scores (the first switch)
})();
</script>

</body>
</html>
