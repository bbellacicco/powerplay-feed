<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Scores | Powerplay Windsor</title>
<script src="share.js"></script>
<!--
  The Local Scores page: the Local Scoreboard on its own (games, standings, stats).
  Embed on the Wix "Local Scores" page, full width: about 1,300px tall on desktop and on mobile.
  The scoreboard sizes itself to fit; nothing scrolls inside the page (that traps the finger on iPhones).
-->
<style>
  :root { --bg: #0b1a33; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  .top { display: flex; justify-content: flex-end; padding: 12px 16px 0; }
  iframe { display: block; width: 100%; height: 1100px; border: 0; background: var(--bg); }
</style>
</head>
<body>
  <div class="top" id="top"></div>
  <iframe id="sb" title="Local Scoreboard" scrolling="no" allow="fullscreen" allowfullscreen></iframe>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var f = document.getElementById('sb');
  // view=standings / view=stats pass straight through
  var q = new URLSearchParams(location.search), extra = '';
  ['view'].forEach(function (k) { if (q.get(k)) extra += '&' + k + '=' + encodeURIComponent(q.get(k)); });
  f.src = REPO + 'local-games_3_3.html?v=' + Math.floor(Date.now() / 3600e3) +
    '&other=' + encodeURIComponent('https://www.powerplaywindsor.com/local-sports') + extra + '&in=sports';
  window.addEventListener('message', function (e) {
    if (e.source === f.contentWindow && e.data && e.data.pp === 'height' && e.data.h > 50) f.style.height = Math.min(e.data.h, 4000) + 'px';
  });
  if (window.PPShare) document.getElementById('top').appendChild(PPShare.button({
    title: 'Local Scores', url: 'https://www.powerplaywindsor.com/scores-standings',
    text: 'Local scores and standings on Powerplay Windsor' }));
})();
</script>
</body>
</html>
