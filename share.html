<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Share | Powerplay Windsor</title>
<!--
  Phones: the Share buttons on the site open this page on its own (outside the Wix box), because inside
  the box iPhones block the phone's share sheet and the Facebook app only flashes and closes.
  Here the big Share button opens the phone's own share sheet (Facebook, Messages, Instagram, WhatsApp...).
  share.html?u=<link>&t=<title>&i=<picture>
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 30px; }
  .brand { font-weight: 900; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .brand b { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #081428; }
  .card .t { padding: 12px 14px 4px; font-weight: 800; font-size: 18px; line-height: 1.25; }
  .card .u { padding: 0 14px 12px; color: var(--muted); font-size: 12.5px; word-break: break-all; }
  button, a.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: 0; border-radius: 8px; font: 800 16px/1 inherit;
    font-family: inherit; padding: 16px; margin-bottom: 10px; cursor: pointer; text-decoration: none; }
  .main { background: var(--accent); color: #0b1a33; font-size: 18px; box-shadow: 0 0 18px rgba(232,176,33,.45); }
  .sec { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid rgba(255,255,255,.16); }
  .fb { background: #1877f2; color: #fff; }
  svg { width: 20px; height: 20px; fill: currentColor; }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  .back { display: block; text-align: center; color: var(--muted); font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Powerplay <b>Windsor</b> · Share</div>
  <div class="card"><img id="pic" alt="" hidden><div class="t" id="title"></div><div class="u" id="link"></div></div>
  <button class="main" id="native" type="button"><svg viewBox="0 0 24 24"><path d="M12 2 7.5 6.5l1.4 1.4L11 5.8V15h2V5.8l2.1 2.1 1.4-1.4z"/><path d="M5 10h3v2H6v8h12v-8h-2v-2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1z"/></svg>Share</button>
  <a class="btn fb" id="fb" href="#"><svg viewBox="0 0 24 24"><path d="M14 8.5V6.6c0-.9.6-1.1 1-1.1h2.5V1.7L14 1.7c-3.8 0-4.6 2.8-4.6 4.6v2.2H7v3.9h2.4V22.3H14V12.4h3.1l.4-3.9H14z"/></svg>Facebook</a>
  <a class="btn sec" id="sms" href="#">Text message</a>
  <button class="sec" id="copy" type="button">Copy link</button>
  <div class="note" id="note">Share opens your phone's own list: Facebook, Messages, Instagram, WhatsApp and more.</div>
  <a class="back" id="back" href="https://www.powerplaywindsor.com/">&larr; Back to PowerplayWindsor.com</a>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var url = q.get('u') || 'https://www.powerplaywindsor.com/', title = q.get('t') || 'Powerplay Windsor', pic = q.get('i') || '';
  if (!/^https:\/\/(www\.)?powerplaywindsor\.com\//.test(url) && !/^https:\/\/bbellacicco\.github\.io\//.test(url)) url = 'https://www.powerplaywindsor.com/';   // only our own links
  var $ = function (id) { return document.getElementById(id); };
  $('title').textContent = title; $('link').textContent = url.replace(/^https:\/\//, '');
  if (/^https:\/\//.test(pic)) { $('pic').src = pic; $('pic').hidden = false; $('pic').onerror = function () { this.hidden = true; }; }
  document.title = 'Share: ' + title;
  var e = encodeURIComponent;
  $('fb').href = 'https://www.facebook.com/sharer/sharer.php?u=' + e(url);
  $('sms').href = 'sms:?&body=' + e(title + ' ' + url);
  $('back').href = url;
  if (!navigator.share) { $('native').style.display = 'none'; $('note').textContent = ''; }
  else {
    // on iPhones Facebook's own share link opens the app and closes right away; the phone's share list
    // hands the link to the Facebook app properly, so that's the only Facebook route here
    $('fb').style.display = 'none';
    $('native').lastChild.textContent = 'Share to Facebook, Messages & more';
  }
  $('native').onclick = function () {
    navigator.share({ title: title, text: title, url: url }).catch(function () {});
  };
  $('copy').onclick = function () {
    var done = function () { $('copy').textContent = 'Link copied ✓'; };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link:', url); });
    else prompt('Copy this link:', url);
  };
})();
</script>
</body>
</html>
