<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Hub | Powerplay Windsor</title>
<!--
  Local Social Hub: each team's official Facebook page feed (Facebook's own
  Page Plugin) and, where the team has a YouTube channel, its latest videos
  (YouTube's own player). Nothing is copied or stored: the posts load straight
  from Facebook / YouTube when a fan opens the tab.

  Embed in Wix (Embed Code > Embed a site), about 900px tall:
    https://bbellacicco.github.io/powerplay-feed/local-social.html
  Optional: ?tab=powerplay | spitfires | lancers | saints | junior
  To add or change a team, edit TEAMS below.
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 17px; margin: 0 0 10px; letter-spacing: .02em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  .grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .box { background: var(--row); border-radius: 8px; padding: 10px; flex: 1 1 340px; min-width: 0; max-width: 520px; }
  .box h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .box h2 a { color: var(--accent); text-decoration: none; font-size: 12px; text-transform: none; letter-spacing: 0; white-space: nowrap; }
  .fb { width: 100%; border: 0; border-radius: 6px; background: #fff; display: block; }
  .yt { position: relative; width: 100%; padding-top: 56.25%; border-radius: 6px; overflow: hidden; background: #000; }
  .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  footer { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Social <span>Hub</span></h1>
  <div class="bar" id="tabs" role="group" aria-label="Team"></div>
  <div class="bar"><select class="pill" id="club" aria-label="Club"></select></div>
  <div class="grid" id="grid"></div>
  <footer>Powerplay Windsor · Posts load from each team's official Facebook page and YouTube channel.</footer>
</div>
<script>
(function () {
  // facebook: the team's official page · youtube: channel ID (starts with UC), if they have one
  var TEAMS = {
    powerplay: [{ name: 'Powerplay Windsor', facebook: 'https://www.facebook.com/powerplaysportsvideo', youtube: 'UC0ZFyMf1Zo_vR5h2oWSwDlw' }],
    spitfires: [{ name: 'Windsor Spitfires', facebook: 'https://www.facebook.com/WindsorSpitfiresHockey', youtube: 'UCnEwkQtTCI_AaIgTyobHm-A' }],
    lancers:   [{ name: 'Windsor Lancers', facebook: 'https://www.facebook.com/windsorlancers' }],
    saints:    [{ name: 'St. Clair Saints', facebook: 'https://www.facebook.com/stclaircollegesaints' }],
    junior: [
      { name: 'Amherstburg Admirals', facebook: 'https://www.facebook.com/amherstburgjrc' },
      { name: 'Chatham Maroons', facebook: 'https://www.facebook.com/FANSOFCHATHAMMAROONSHOCKEY' },
      { name: "Essex 73's", facebook: 'https://www.facebook.com/Essex73s' },
      { name: 'Lakeshore Canadiens', facebook: 'https://www.facebook.com/LakeshoreCanadiens' },
      { name: 'LaSalle Vipers', facebook: 'https://www.facebook.com/lasallevipers' },
      { name: 'Leamington Flyers', facebook: 'https://www.facebook.com/LeamingtonFlyersHockey' },
      { name: 'Wheatley Sharks', facebook: 'https://www.facebook.com/WheatleySharksJrCHockey' }
    ]
  };
  var TABS = [['powerplay', 'Powerplay'], ['spitfires', 'Spitfires'], ['lancers', 'Lancers'], ['saints', 'Saints'], ['junior', 'Junior Hockey']];
  var FB_HEIGHT = 720;

  var qs = new URLSearchParams(location.search);
  var state = { tab: TEAMS[qs.get('tab')] ? qs.get('tab') : 'powerplay', club: 0 };

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

  function tabs() {
    var box = document.getElementById('tabs'); box.innerHTML = '';
    TABS.forEach(function (t) {
      var b = el('button', 'pill', t[1]);
      b.setAttribute('aria-pressed', String(state.tab === t[0]));
      b.onclick = function () { if (state.tab !== t[0]) { state.tab = t[0]; state.club = 0; render(); } };
      box.appendChild(b);
    });
  }

  function clubSelect() {
    var sel = document.getElementById('club'), list = TEAMS[state.tab];
    sel.innerHTML = '';
    list.forEach(function (c, i) { sel.appendChild(new Option(c.name, String(i))); });
    sel.value = String(state.club);
    sel.style.display = list.length > 1 ? '' : 'none';
    sel.onchange = function () { state.club = Number(sel.value); render(); };
  }

  function heading(text, href, label) {
    var h = el('h2', null, text);
    if (href) { var a = el('a', null, label); a.href = href; a.target = '_blank'; a.rel = 'noopener'; h.appendChild(a); }
    return h;
  }

  function render() {
    tabs(); clubSelect();
    var team = TEAMS[state.tab][state.club];
    var grid = document.getElementById('grid'); grid.innerHTML = '';

    if (team.youtube) {
      var yt = el('div', 'box');
      yt.appendChild(heading('Latest videos', 'https://www.youtube.com/channel/' + team.youtube + '/videos', 'YouTube ↗'));
      var frame = el('div', 'yt'), f = document.createElement('iframe');
      // "UU…" is the channel's uploads playlist, newest first
      f.src = 'https://www.youtube-nocookie.com/embed/videoseries?list=UU' + team.youtube.slice(2);
      f.title = team.name + ' videos'; f.loading = 'lazy';
      f.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      frame.appendChild(f); yt.appendChild(frame);
      grid.appendChild(yt);
    }

    var fb = el('div', 'box');
    fb.appendChild(heading(team.name + ' on Facebook', team.facebook, 'Open ↗'));
    grid.appendChild(fb);
    // Facebook's Page Plugin takes a fixed width (180–500px), so size it to the box
    var w = Math.max(180, Math.min(500, Math.floor(fb.clientWidth - 20)));
    var f2 = document.createElement('iframe');
    f2.className = 'fb'; f2.height = FB_HEIGHT; f2.title = team.name + ' Facebook posts'; f2.loading = 'lazy';
    f2.allow = 'encrypted-media; clipboard-write; web-share';
    f2.src = 'https://www.facebook.com/plugins/page.php?href=' + encodeURIComponent(team.facebook) +
      '&tabs=timeline&width=' + w + '&height=' + FB_HEIGHT +
      '&small_header=true&adapt_container_width=true&hide_cover=false&show_facepile=false';
    fb.appendChild(f2);
    fb.appendChild(el('div', 'note', "Posts not showing? Some browsers' privacy settings block Facebook feeds. Use Open ↗ to see them on Facebook."));
  }

  render();
  var t, lastW = window.innerWidth;   // phones fire resize while scrolling; only redraw when the width changes
  window.addEventListener('resize', function () { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(t); t = setTimeout(render, 400); });
})();
</script>
</body>
</html>
