<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Scoreboard | Powerplay Windsor</title>
<!--
  Local schedules & results widget: a 7-day span (3 days before today, today,
  3 days after; the All tab shows yesterday to 2 days ahead). Data comes from data/local-games.json, refreshed every
  morning by .github/workflows/local-games.yml.

  Embed in Wix (Embed Code > Embed a site):
    https://bbellacicco.github.io/powerplay-feed/local-games.html
  Optional URL settings (combine with &):
    ?team=spitfires | lancers | saints    start on one team (hides the team tabs)
    ?view=standings | stats               open on Standings or Stats (the Stats tab only shows once data/stats.json exists)
-->
<style>
  :root {
    --bg: #0b1a33;
    --panel: #10244a;
    --row: #132b57;
    --line: #1e3a6e;
    --text: #f2f5fb;
    --muted: #9fb0cf;
    --accent: #e8b021;
    --win: #2fbf71;
    --loss: #e5484d;
    --tie: #9fb0cf;
    --spitfires: #d4202c;
    --lancers: #0f6bd6;
    --saints: #1f9d55;
    --highschool: #8b5cf6;
    --junior: #0ea5a4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .sponsor { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sponsor b { color: var(--text); font-weight: 600; }
  .updated { color: var(--muted); font-size: 12px; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .views { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .views button { border: 0; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--accent); color: #111; font-weight: 600; }
  .stand { margin-top: 12px; }
  .stand h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 6px; }
  .stand table { width: 100%; border-collapse: collapse; background: var(--row); border-radius: 8px; overflow: hidden; font-variant-numeric: tabular-nums; }
  .stand th, .stand td { padding: 6px 8px; text-align: right; white-space: nowrap; }
  .stand th { font-size: 11px; color: var(--muted); font-weight: 600; background: var(--panel); }
  .stand th:first-child, .stand td:first-child { text-align: left; width: 100%; white-space: normal; }
  .stand tr + tr td { border-top: 1px solid var(--line); }
  .stand td .rk { color: var(--muted); display: inline-block; width: 20px; }
  .stand tr.ours td { background: rgba(232, 176, 33, .12); }
  .stand tr.ours td:first-child { color: var(--accent); font-weight: 700; }
  .snote { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .snote a { color: var(--accent); }
  .stand th.key, .stand td.key { color: var(--accent); font-weight: 700; }
  @media (max-width: 480px) { .stand .wide { display: none; } .right { align-items: flex-start; } }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .more { color: var(--muted); font-size: 12px; text-align: center; padding: 6px 0 2px; }
  .pill[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  select.pill { padding-right: 8px; }
  .day { margin-top: 14px; }
  .day.today h2 { color: #fff; }
  .day.today h2::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: middle; }
  .day h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 6px; }
  .game { display: grid; grid-template-columns: 4px 64px 1fr auto; gap: 10px; align-items: center;
    background: var(--row); border-radius: 8px; padding: 8px 10px 8px 0; margin-bottom: 5px; overflow: hidden; }
  .stripe { align-self: stretch; }
  .t-spitfires .stripe { background: var(--spitfires); }
  .t-lancers .stripe { background: var(--lancers); }
  .t-saints .stripe { background: var(--saints); }
  .t-highschool .stripe { background: var(--highschool); }
  .t-junior .stripe { background: var(--junior); }
  .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .main { min-width: 0; }
  .who { font-weight: 600; }
  .who .vs { color: var(--muted); font-weight: 400; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta a { color: var(--muted); }
  .score { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score b { font-size: 16px; }
  .badge { display: inline-block; min-width: 26px; text-align: center; font-size: 11px; font-weight: 700;
    padding: 2px 5px; border-radius: 4px; margin-left: 6px; color: #fff; background: var(--tie); }
  .badge.W { background: var(--win); } .badge.L, .badge.OTL, .badge.SOL { background: var(--loss); }
  .badge.off { background: #6b7280; }
  .badge.live { background: var(--loss); }
  .tix { font-size: 12px; color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  footer { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; }
  footer a { color: var(--muted); }
  @media (max-width: 480px) {
    .game { grid-template-columns: 4px 52px 1fr auto; gap: 8px; }
    .time { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Local <span>Scoreboard</span></h1>
      <div class="sponsor">Brought to you by <b>Unifor Local 444</b></div>
    </div>
    <div class="right">
      <div class="views" role="group" aria-label="View"><button id="v-games">Games</button><button id="v-standings">Standings</button><button id="v-stats" style="display:none">Stats</button></div>
      <div class="updated" id="updated"></div>
    </div>
  </header>
  <div class="bar" id="teams" role="group" aria-label="Team"></div>
  <div class="bar">
    <select class="pill" id="sport" aria-label="Sport"></select>
    <select class="pill" id="school" aria-label="School"></select>
  </div>
  <div id="list"></div>
  <footer>Powerplay Windsor · Schedules from chl.ca, golancers.ca, ojhl.ca, gohl.ca, thepjhl.ca, cjfl.org and wecssaa.com</footer>
</div>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var state = {
    team: qs.get('team') || 'latest',   // opens on Latest Scores
    sport: 'all',
    school: 'all'
  };
  var lockTeam = !!qs.get('team');
  var view = qs.get('view') === 'standings' ? 'standings' : qs.get('view') === 'stats' ? 'stats' : 'games';
  var standLeague = 'ohl';
  var statsData = null, statTeam = '', statClub = '';   // team leaders (data/stats.json); the Stats tab appears once it exists
  var data = null;
  var todayKey = '';
  var TZ = 'America/Toronto';

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(d, opts) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: TZ }, opts)).format(d); }
  var ALL_DAYS_BACK = 1, ALL_DAYS_AHEAD = 2;   // the All tab: yesterday to 2 days ahead; team tabs show the full week
  function dayKey(d) { return fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' }); }

  var BASE = 'https://bbellacicco.github.io/powerplay-feed/data/';

  }
  function load() {

      // high school comes from Buddy's PC (wecssaa.com blocks GitHub); optional

      // St. Clair (all sports but football) also comes from Buddy's PC; optional
      getJSON('saints.json').catch(function () { return null; }),

      getJSON('pjhl-standings.json').catch(function () { return null; }),
      // Lancers (OUA) and St. Clair soccer (OCAA) standings also come from Buddy's PC; optional
      getJSON('college-standings.json').catch(function () { return null; }),
      // Powerplay's own stories: a game you've written up links to your story
      getJSON('local-news.json').catch(function () { return null; }),
      // team leaders (player stats), collected hourly by scrape_stats.py; optional
      getJSON('stats.json').catch(function () { return null; })
    ]).then(function (res) {
      var j = res[0], hs = res[1], sc = res[2], pj = res[3], cs = res[4], news = res[5], st = res[6];
      statsData = st && st.teams && st.teams.length ? st : null;
      j.standings = j.standings || {};
      if (pj && pj.groups && pj.groups.length) j.standings.pjhl = pj.groups;
      if (cs && cs.leagues) {

        if (grp('oua').length) j.standings.oua = grp('oua');
        if (grp('ocaa_m').length || grp('ocaa_w').length) j.standings.ocaa = grp('ocaa_m').concat(grp('ocaa_w'));
      }
      if (sc && sc.games) {
        var lo2 = (j.range || [])[0] || '', hi2 = (j.range || [])[1] || '9999';
        j.games = j.games.filter(function (g) { return !(g.team === 'saints' && g.sport !== 'Football'); })
          .concat(sc.games.filter(function (g) { var d = g.start.slice(0, 10); return g.sport !== 'Football' && d >= lo2 && d <= hi2; }))
          .sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
      }
      if (hs && hs.games && hs.games.length) {
        var lo = (j.range || [])[0] || '', hi = (j.range || [])[1] || '9999';
        var extra = hs.games.filter
