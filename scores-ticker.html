<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scores Ticker | Powerplay Windsor</title>
<!--
  Scrolling scores bar, styled like ticker.html (44px, black, gold).
  Shows live games first, then today's upcoming games and the latest finals:
    - local teams from data/local-games.json + data/highschool.json
    - your pro teams (Red Wings, Pistons, Lions, Leafs, Canadiens, Raptors, Bills) live from ESPN
  Embed in Wix at full width, 44px tall:
    https://bbellacicco.github.io/powerplay-feed/scores-ticker.html
  Options: ?mix=local  or  ?mix=pro   (default shows both)
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:44px;background:#000;overflow:hidden}
#ticker-viewport{width:100%;height:44px;overflow:hidden;position:relative;background:#000}
#ticker-stage{position:absolute;top:0;left:0;height:44px;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.ticker-item{display:inline-flex;align-items:center;gap:7px;padding:0 26px;font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#fff;height:44px}
/* one accent colour (Powerplay gold) + red only for LIVE; everything else white/grey */
.badge{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:3px;flex-shrink:0;margin-right:2px}
.badge-final{background:#FFB800;color:#000}
.badge-live{background:#e8323a;color:#fff}
.badge-upcoming{background:transparent;color:#FFB800;box-shadow:inset 0 0 0 1px #FFB800}
.team{color:#fff;font-weight:700}
.score{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
.lose{color:#8b929c}
.at{color:#6b7280;font-weight:400}
.meta{color:#9aa3ad;font-weight:400;font-size:12px;margin-left:4px}
.sep{color:rgba(255,184,0,0.35);font-size:14px;font-family:Arial;padding:0 2px;display:inline-block;height:44px;line-height:44px}
</style>
</head>
<body>
<div id="ticker-viewport"><div id="ticker-stage"></div></div>
<script>
var SPEED = 50;                 // pixels per second
var MAX_FINALS = 16;            // how many recent final scores to include
var MAX_HS_FINALS = 6;          // of those, at most this many high school games
var MAX_UPCOMING = 12;          // upcoming games to show once the finals are old
var FRESH_HOURS = 24;           // a final score counts as "current" for this many hours after the game
var TZ = 'America/Toronto';
var BASE = 'https://bbellacicco.github.io/powerplay-feed/data/';
var PRO = {                     // league: [ESPN path, our team abbreviations, label]
  nfl: ['football/nfl', ['DET','BUF'], 'NFL'],
  nhl: ['hockey/nhl', ['DET','TOR','MTL'], 'NHL'],
  nba: ['basketball/nba', ['DET','TOR'], 'NBA']
};
var mix = new URLSearchParams(location.search).get('mix') || 'local';   // local teams only unless ?mix=all or ?mix=pro

var stage = document.getElementById('ticker-stage');
var x = 0, loopWidth = 0, lastT = null, raf = null, lastKey = '';

function fmt(d, o){ return new Intl.DateTimeFormat('en-CA', Object.assign({timeZone: TZ}, o)).format(d); }
function dayKey(d){ return fmt(d, {year:'numeric', month:'2-digit', day:'2-digit'}); }
function clock(d){ return fmt(d, {hour:'numeric', minute:'2-digit'}).replace(/\s?([ap])\.?m\.?/i, function(_, a){ return ' ' + a.toUpperCase() + 'M'; }); }
function getJSON(u){ return fetch(u + (u.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }

// ---------- local
function localItems(){
  return Promise.all([getJSON(BASE + 'local-games.json'), getJSON(BASE + 'highschool.json').catch(function(){ return null; })])
    .then(function(r){
      var j = r[0], hs = r[1], teams = j.teams || {};
      var games = j.games.filter(function(g){ return g.team !== 'highschool'; })
        .concat(hs && hs.games ? hs.games : j.games.filter(function(g){ return g.team === 'highschool'; }));
      var today = dayKey(new Date());
      var out = [];
      games.forEach(function(g){
        var d = new Date(g.start), isToday = dayKey(d) === today;
        var kind = g.status === 'live' ? 'live' : g.status === 'final' ? 'final' : (g.status === 'upcoming' ? 'upcoming' : null);
        if (!kind || (kind !== 'upcoming' && g.our_score == null)) return;
        var left, right;
        if (g.home && g.away) { left = g.away; right = g.home; }                  // high school: away @ home
        else {
          var us = g.club || (teams[g.team] || {}).short || g.team;
          if (g.home_away === 'H') { left = g.opponent; right = us; } else { left = us; right = g.opponent; }
        }
        var ls, rs;
        if (g.home && g.away) { ls = g.our_score; rs = g.opp_score; }
        else if (g.home_away === 'H') { ls = g.opp_score; rs = g.our_score; } else { ls = g.our_score; rs = g.opp_score; }
        var label = g.team === 'spitfires' ? 'OHL' : g.team === 'saints' && g.sport === 'Football' ? 'CJFL' : g.sport;
        if (kind === 'upcoming' && d < new Date(Date.now() - 3 * 3600e3)) return;   // started a while ago, no score yet
        out.push({kind: kind, start: g.start, hs: g.team === 'highschool', vs: g.home_away === 'N' && !(g.home && g.away), left: left, right: right, ls: ls, rs: rs,
                  today: isToday,
                  meta: [label, kind === 'upcoming' ? (isToday ? '' : fmt(d, {weekday: 'short'}) + ' ') + (g.time_tbd ? '' : clock(d)) : '', g.note && kind === 'final' ? g.note : ''].map(function(x){ return String(x).trim(); }).filter(Boolean).join(' · ')});
      });
      return out;
    }).catch(function(){ return []; });
}

// ---------- pro (ESPN), yesterday + today
function proItems(){
  var now = new Date(), days = [new Date(now.getTime() - 864e5), now];
  var jobs = [];
  Object.keys(PRO).forEach(function(k){
    days.forEach(function(d){
      var url = 'https://site.api.espn.com/apis/site/v2/sports/' + PRO[k][0] + '/scoreboard?dates=' + dayKey(d).replace(/-/g, '');
      jobs.push(fetch(url).then(function(r){ return r.json(); }).then(function(j){
        return (j.events || []).filter(function(e){
          return e.competitions[0].competitors.some(function(c){ return PRO[k][1].indexOf(c.team.abbreviation) >= 0; });
        }).map(function(e){
          var st = e.status.type, c = e.competitions[0].competitors;
          var a = c.filter(function(t){ return t.homeAway === 'away'; })[0], h = c.filter(function(t){ return t.homeAway === 'home'; })[0];
          var kind = st.state === 'in' ? 'live' : st.state === 'post' ? 'final' : (dayKey(new Date(e.date)) === dayKey(now) ? 'upcoming' : null);
          if (!kind) return null;
          return {kind: kind, start: e.date, left: a.team.shortDisplayName, right: h.team.shortDisplayName,
                  ls: kind === 'upcoming' ? null : Number(a.score), rs: kind === 'upcoming' ? null : Number(h.score),
                  meta: [PRO[k][2], kind === 'live' ? st.shortDetail : kind === 'upcoming' ? clock(new Date(e.date)) : (st.shortDetail !== 'Final' ? st.shortDetail.replace('Final/', '') : '')].filter(Boolean).join(' · ')};
        }).filter(Boolean);
      }).catch(function(){ return []; }));
    });
  });
  return Promise.all(jobs).then(function(r){ return [].concat.apply([], r); });
}

// Order: current finals first, then games in progress. Once the finals are
// old (none in the last FRESH_HOURS), show upcoming games instead.
function order(items){
  var live = items.filter(function(i){ return i.kind === 'live'; });
  var since = Date.now() - FRESH_HOURS * 3600e3;
  var hsCount = 0;
  var fin = items.filter(function(i){ return i.kind === 'final' && new Date(i.start).getTime() >= since; })
    .sort(function(a, b){ return a.start < b.start ? 1 : -1; })
    .filter(function(i){ return !i.hs || ++hsCount <= MAX_HS_FINALS; })
    .slice(0, MAX_FINALS);
  if (fin.length) return fin.concat(live);
  var up = items.filter(function(i){ return i.kind === 'upcoming'; })
    .sort(function(a, b){ return a.start < b.start ? -1 : 1; }).slice(0, MAX_UPCOMING);
  return live.concat(up);
}

// ---------- drawing (same seamless loop as ticker.html)
function node(it){
  var w = document.createElement('div'); w.className = 'ticker-item';
  var b = document.createElement('span');
  b.className = 'badge badge-' + it.kind;
  b.textContent = it.kind === 'live' ? 'Live' : it.kind === 'final' ? 'Final' : (it.today ? 'Today' : 'Next');
  w.appendChild(b);
  function side(name, score, lost){
    var t = document.createElement('span'); t.className = 'team' + (lost ? ' lose' : ''); t.textContent = name; w.appendChild(t);
    if (score != null) { var s = document.createElement('span'); s.className = 'score' + (lost ? ' lose' : ''); s.textContent = score; w.appendChild(s); }
  }
  var done = it.kind === 'final';   // in a final, the losing side is dimmed
  side(it.left, it.ls, done && it.ls < it.rs);
  var at = document.createElement('span'); at.className = 'at'; at.textContent = it.vs ? 'vs' : '@'; w.appendChild(at);
  side(it.right, it.rs, done && it.rs < it.ls);
  if (it.meta) { var m = document.createElement('span'); m.className = 'meta'; m.textContent = it.meta; w.appendChild(m); }
  return w;
}
function sep(){ var s = document.createElement('span'); s.className = 'sep'; s.innerHTML = '&#9670;'; return s; }

function build(items){
  var key = JSON.stringify(items);
  if (key === lastKey) return;          // nothing changed: keep scrolling smoothly
  lastKey = key;
  if (raf) cancelAnimationFrame(raf);
  stage.innerHTML = ''; x = 0; lastT = null; stage.style.transform = 'translateX(0)';
  var nodes = [];
  if (!items.length) {
    var d = document.createElement('div'); d.className = 'ticker-item'; d.style.color = '#9aa3ad';
    d.textContent = 'Powerplay Windsor — scores will appear here on game days';
    nodes.push(d, sep());
  } else items.forEach(function(it){ nodes.push(node(it), sep()); });
  // repeat until one set is wider than the screen, then duplicate for the loop
  var set = nodes.slice();
  nodes.forEach(function(n){ stage.appendChild(n); });
  var w = 0; for (var i = 0; i < stage.children.length; i++) w += stage.children[i].offsetWidth;
  while (w > 0 && w < window.innerWidth) { set.forEach(function(n){ var c = n.cloneNode(true); stage.appendChild(c); w += c.offsetWidth; }); }
  loopWidth = w;
  var count = stage.children.length;
  for (var k = 0; k < count; k++) stage.appendChild(stage.children[k].cloneNode(true));
  raf = requestAnimationFrame(tick);
}
function tick(t){
  if (lastT !== null) {
    var dt = Math.min((t - lastT) / 1000, 0.1);
    x += SPEED * dt;
    if (loopWidth > 0 && x >= loopWidth) x -= loopWidth;
    stage.style.transform = 'translateX(-' + x.toFixed(1) + 'px)';
  }
  lastT = t; raf = requestAnimationFrame(tick);
}

function refresh(){
  Promise.all([mix === 'pro' ? [] : localItems(), mix === 'local' ? [] : proItems()])
    .then(function(r){ build(order(r[0].concat(r[1]))); });
}
refresh();
setInterval(refresh, 60000);            // check for new scores every minute
</script>
</body>
</html>
