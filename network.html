<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
<title>Powerplay Network | Powerplay Windsor</title>
<!--
  The Powerplay Network page.
    Local Network: every Powerplay video on YouTube and Vimeo, with team/sport filters and a search box.
    Pro Network:   the newest videos from Sportsnet, TSN, CBC Sports, ESPN, the leagues and the Pro Hub's teams.
  Data: data/network.json (Buddy's PC, every 15 minutes; pro channels hourly).
  Videos play right on the page. 12 per page with Next/Back, so the page keeps the same height.
  Embed on its own Wix page, full width: about 1,250px tall on desktop, 1,700px on mobile.
  ?tab=pro   open on the Pro Network
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; --yt: #ff3d3d; --vimeo: #1ab7ea; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 14px 22px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 22px; -webkit-text-stroke: .8px currentColor; paint-order: stroke fill;
    letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .tab { border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 800; font-size: 13px; padding: 8px 16px; border-radius: 999px; cursor: pointer; letter-spacing: .02em; }
  .tab.on { background: var(--accent); color: #0b1a33; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .find { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--row); border: 1px solid #2a4a85; border-radius: 999px; padding: 0 12px; height: 38px; min-width: 0; }
  .find:focus-within { border-color: var(--accent); }
  .find svg { width: 16px; height: 16px; stroke: var(--muted); flex: none; }
  .find input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 16px; }
  .find input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: #fff; color: #0b1a33; border-color: #fff; }
  .count { color: var(--muted); font-size: 12.5px; margin: 0 2px 8px; }
  .gridwrap { position: relative; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card { background: var(--row); border-radius: 8px; overflow: hidden; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer;
    display: flex; flex-direction: column; border-top: 3px solid var(--accent); }
  .card.pro { border-top-color: #64748b; }
  .card:hover .hl, .card:focus-visible .hl { text-decoration: underline; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--panel); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid #fff; transition: transform .15s; }
  .card:hover .play { transform: scale(1.08); background: rgba(232,176,33,.92); }
  .play::after { content: ""; position: absolute; left: 16px; top: 12px; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  .new { position: absolute; left: 6px; top: 6px; background: var(--accent); color: #0b1a33; font-size: 10px; font-weight: 900; letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; }
  .body { padding: 8px 10px 10px; }
  .meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
  .meta b { font-weight: 800; color: var(--accent); } .meta b.YouTube { color: var(--yt); } .meta b.Vimeo { color: var(--vimeo); }
  .hl { font-weight: 700; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .pager button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); background: var(--panel); border-radius: 8px; padding: 16px; }
  /* the player sits over the grid, level with the video you tapped */
  .player { position: absolute; left: 0; right: 0; z-index: 4; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); display: none; }
  .player.on { display: block; }
  .player .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 80vh; margin: 0 auto; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .cap { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel); }
  .player .cap .t { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .cap a, .player .cap button { flex: none; background: var(--row); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; cursor: pointer; text-decoration: none; }
  .player .cap a:hover, .player .cap button:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .body { padding: 6px 7px 8px; } .hl { font-size: 12.5px; } .meta { font-size: 10.5px; }
    .play { width: 34px; height: 34px; margin: -17px 0 0 -17px; } .play::after { left: 12px; top: 8px; border-left-width: 11px; border-top-width: 7px; border-bottom-width: 7px; }
    h1 { font-size: 19px; } .tab { padding: 7px 12px; font-size: 12px; }
    .player .cap .t { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Powerplay <span>Network</span></h1>
      <div class="tagline" id="tagline">Every Powerplay highlight and interview, in one place</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" type="button" role="tab" data-tab="local">Local Network</button>
      <button class="tab" type="button" role="tab" data-tab="pro">Pro Network</button>
    </div>
  </header>
  <div class="bar">
    <label class="find">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="Search videos…" autocomplete="off" enterkeyhint="search" aria-label="Search videos">
    </label>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="gridwrap" id="gridwrap">
    <div class="grid" id="grid"><div class="empty">Loading videos…</div></div>
    <div class="player" id="player" role="dialog" aria-label="Video player">
      <div class="frame" id="frame"></div>
      <div class="cap"><div class="t" id="ptitle"></div><a id="ext" target="_blank" rel="noopener" href="#">Watch on YouTube &#8599;</a><button type="button" id="close">&#10005; Close</button></div>
    </div>
  </div>
  <div class="pager" id="pager"></div>
</div>
<script>
(function () {
  var BASE = 'https://bbellacicco.github.io/powerplay-feed/data/';
  var PER = 12;
  var qs = new URLSearchParams(location.search);
  var state = { tab: qs.get('tab') === 'pro' ? 'pro' : 'local', chip: 'all', q: '', page: 0 };
  var data = { local: [], pro: [] };

  // Local Network filters: matched against the video's title and description
  var LOCAL_CHIPS = [
    ['all', 'All', null],
    ['spitfires', 'Spitfires', /spitfire|spits\b|\bohl\b/],
    ['lancers', 'Lancers', /lancer|uwindsor/],
    ['saints', 'Saints', /saints|st\.? clair/],
    ['junior', 'Junior hockey', /\b(ojhl|gohl|pjhl)\b|spitfires? jr|junior [abc]\b|jr\.? [abc]\b|lakeshore canadiens|leamington flyers|lasalle vipers|essex 73|amherstburg admirals|wheatley sharks|blenheim|mooretown/],
    ['highschool', 'High school', /high school|wecssaa|secondary|catholic central|holy names|villanova|st\.? joseph|assumption|brennan|kennedy|massey|walkerville|vincent massey|riverside|herman|forster|tecumseh vista|belle river|essex dist|kingsville|leamington dist|cardinal carter|st\.? anne|l'essor|sandwich|harrow|general amherst|north star|erie migration|ste\.? cecile|e\.?j\.? lajeunesse/],
    ['football', 'Football', /football|touchdown|\btd\b|quarterback|\bqb\b|ofc|cjfl|yates|hec crighton/],
    ['hockey', 'Hockey', /hockey|\bgoal\b|goalie|power ?play goal|shutout|\bohl\b|ojhl|gohl|pjhl/],
    ['basketball', 'Basketball', /basketball|three[- ]pointer|buzzer|dunk|\bhoops?\b/],
    ['more', 'More sports', /volleyball|soccer|baseball|softball|golf|curling|wrestling|track|rugby|lacrosse|tennis|swim|boxing|cross[- ]country|fastball/]
  ];
  var PRO_CHIPS = [['all', 'All'], ['team', 'Our teams'], ['Sportsnet', 'Sportsnet'], ['TSN', 'TSN'], ['CBC Sports', 'CBC'], ['ESPN', 'ESPN'],
    ['NHL', 'NHL'], ['NFL', 'NFL'], ['MLB', 'MLB'], ['NBA', 'NBA'], ['CFL', 'CFL'], ['PWHL', 'PWHL'], ['OHL', 'OHL']];
  var TAGLINE = { local: 'Every Powerplay highlight and interview, in one place', pro: 'The latest from Sportsnet, TSN, CBC, ESPN, the leagues and our pro teams' };

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[‘’]/g, "'"); }
  var MON = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  function when(iso) {      // CP style: 3 hours ago / 2 days ago / Oct. 4 / Oct. 4, 2023
    var t = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso).getTime(); if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 60) return Math.max(m, 1) + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.round(h / 24); if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: 'numeric', day: 'numeric' })
      .formatToParts(new Date(t)).forEach(function (x) { p[x.type] = x.value; });
    var thisYear = new Date().getFullYear() === +p.year;
    return MON[+p.month - 1] + ' ' + (+p.day) + (thisYear ? '' : ', ' + p.year);
  }
  function embed(u) {
    var m = u.match(/[?&]v=([\w-]{11})/) || u.match(/youtu\.be\/([\w-]{11})/) || u.match(/\/shorts\/([\w-]{11})/);
    if (m) return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?autoplay=1&rel=0&playsinline=1&modestbranding=1';
    m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (m) return 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1&title=0&byline=0&portrait=0';
    return '';
  }
  function source(v) { return v.s || (/vimeo\.com/.test(v.u) ? 'Vimeo' : 'YouTube'); }

  // ---------- filtering ----------
  function list() {
    var all = data[state.tab], q = norm(state.q).trim(), words = q ? q.split(/\s+/) : [];
    return all.filter(function (v) {
      var hay = v._hay || (v._hay = ' ' + norm(v.t + ' ' + (v.d || '') + ' ' + (v.ch || '')) + ' ');
      if (state.tab === 'local' && state.chip !== 'all') {
        var rx = LOCAL_CHIPS.filter(function (c) { return c[0] === state.chip; })[0][2];
        if (!rx.test(hay)) return false;
      }
      if (state.tab === 'pro' && state.chip !== 'all') {
        if (state.chip === 'team' ? v.g !== 'team' : v.ch !== state.chip) return false;
      }
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return false;
      return true;
    });
  }

  // ---------- drawing ----------
  function chips() {
    var box = document.getElementById('chips'); box.innerHTML = '';
    (state.tab === 'local' ? LOCAL_CHIPS : PRO_CHIPS).forEach(function (c) {
      var b = el('button', 'chip' + (state.chip === c[0] ? ' on' : ''), c[1]); b.type = 'button';
      b.onclick = function () { state.chip = c[0]; state.page = 0; stop(); chips(); grid(); };
      box.appendChild(b);
    });
  }
  function card(v) {
    var c = el('button', 'card' + (state.tab === 'pro' ? ' pro' : '')); c.type = 'button'; c.setAttribute('aria-label', 'Play: ' + v.t);
    var th = el('div', 'thumb');
    if (v.i) { var img = new Image(); img.src = v.i; img.alt = ''; img.loading = 'lazy'; img.onerror = function () { img.remove(); }; th.appendChild(img); }
    th.appendChild(el('div', 'play'));
    var age = Date.now() - new Date(v.p.length === 10 ? v.p + 'T12:00:00' : v.p).getTime();
    if (age < 36 * 3600e3) th.appendChild(el('div', 'new', 'NEW'));
    c.appendChild(th);
    var b = el('div', 'body'), m = el('div', 'meta');
    if (state.tab === 'pro') m.appendChild(el('b', null, v.ch)); else m.appendChild(el('b', source(v), source(v)));
    m.appendChild(document.createTextNode(' · ' + when(v.p)));
    b.appendChild(m); b.appendChild(el('div', 'hl', v.t)); c.appendChild(b);
    c.onclick = function () { play(v, c); };
    return c;
  }
  function grid() {
    var vids = list(), pages = Math.max(1, Math.ceil(vids.length / PER));
    if (state.page >= pages) state.page = pages - 1;
    var box = document.getElementById('grid'); box.innerHTML = '';
    var cnt = document.getElementById('count');
    if (!data[state.tab].length) {
      cnt.textContent = '';
      box.appendChild(el('div', 'empty', state.tab === 'pro' ? 'Pro videos are on the way. They refresh every hour.' : 'Videos are on the way.'));
      document.getElementById('pager').innerHTML = ''; return;
    }
    if (!vids.length) {
      cnt.textContent = '';
      box.appendChild(el('div', 'empty', 'No videos match. Try another word or tap All.'));
      document.getElementById('pager').innerHTML = ''; return;
    }
    cnt.textContent = vids.length.toLocaleString('en-CA') + (vids.length === 1 ? ' video' : ' videos');
    vids.slice(state.page * PER, state.page * PER + PER).forEach(function (v) { box.appendChild(card(v)); });
    var pg = document.getElementById('pager'); pg.innerHTML = '';
    if (pages > 1) {
      var back = el('button', null, '← Newer'); back.type = 'button'; back.disabled = state.page === 0;
      var next = el('button', null, 'Older →'); next.type = 'button'; next.disabled = state.page >= pages - 1;
      back.onclick = function () { state.page--; stop(); grid(); top(); };
      next.onclick = function () { state.page++; stop(); grid(); top(); };
      pg.appendChild(back); pg.appendChild(el('span', null, 'Page ' + (state.page + 1) + ' of ' + pages)); pg.appendChild(next);
    }
  }
  function top() { try { document.getElementById('gridwrap').scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) {} }

  // ---------- player ----------
  var player = document.getElementById('player'), frame = document.getElementById('frame');
  function play(v, cardEl) {
    var src = embed(v.u);
    if (!src) { window.open(v.u, '_blank', 'noopener'); return; }
    frame.innerHTML = '';
    var f = document.createElement('iframe'); f.src = src; f.title = v.t;
    f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media'; f.allowFullscreen = true;
    frame.appendChild(f);
    document.getElementById('ptitle').textContent = v.t;
    var ext = document.getElementById('ext'); ext.href = v.u; ext.textContent = 'Watch on ' + source(v) + ' ↗';
    player.classList.add('on');
    // line the player up with the row that was tapped, without running past the bottom of the grid
    var wrap = document.getElementById('gridwrap');
    var y = cardEl.offsetTop, maxY = Math.max(0, wrap.offsetHeight - player.offsetHeight);
    player.style.top = Math.min(y, maxY) + 'px';
    document.getElementById('close').focus({ preventScroll: true });
  }
  function stop() { player.classList.remove('on'); frame.innerHTML = ''; }
  document.getElementById('close').onclick = stop;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') stop(); });

  // ---------- tabs and search ----------
  function setTab(t) {
    state.tab = t; state.chip = 'all'; state.page = 0; stop();
    [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); b.setAttribute('aria-selected', b.getAttribute('data-tab') === t); });
    document.getElementById('tagline').textContent = TAGLINE[t];
    document.getElementById('q').placeholder = t === 'pro' ? 'Search pro videos…' : 'Search Powerplay videos…';
    chips(); grid();
  }
  [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.onclick = function () { setTab(b.getAttribute('data-tab')); }; });
  var tmr;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(tmr); tmr = setTimeout(function () { state.q = e.target.value; state.page = 0; stop(); grid(); }, 200);
  });

  // ---------- data ----------
  function getJSON(name) { return fetch(BASE + name + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function load() {
    Promise.all([getJSON('network.json'), getJSON('local-news.json')]).then(function (r) {
      var net = r[0] || {}, news = r[1] || {};
      var local = (net.local || []).slice(), seen = {};
      local.forEach(function (v) { seen[v.u] = 1; });
      // the newest uploads also arrive in the Local Hub data; add any the network file doesn't have yet
      (news.stories || []).forEach(function (s) {
        if ((s.source === 'YouTube' || s.source === 'Vimeo') && !seen[s.url]) { seen[s.url] = 1; local.push({ s: s.source, t: s.headline, d: s.summary || '', u: s.url, i: s.image, p: s.published }); }
      });
      var ts = function (v) { return new Date(v.p.length === 10 ? v.p + 'T12:00:00' : v.p).getTime() || 0; };
      local.sort(function (a, b) { return ts(b) - ts(a); });
      // a video posted to both YouTube and Vimeo shows once
      var titles = {};
      data.local = local.filter(function (v) { var k = norm(v.t).replace(/[^a-z0-9]+/g, ' ').trim(); if (titles[k]) return false; titles[k] = 1; return true; });
      data.pro = (net.pro || []).slice().sort(function (a, b) { return ts(b) - ts(a); });
      if (!player.classList.contains('on')) grid();
    });
  }
  setTab(state.tab);
  load();
  setInterval(function () { if (!player.classList.contains('on')) load(); }, 10 * 60000);
})();
</script>
</body>
</html>
