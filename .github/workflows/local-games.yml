name: Local games (Spitfires, Lancers, Saints)

on:
  schedule:
    # Mondays at 10:07 UTC = 6:07 AM Windsor time (5:07 AM in winter).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: local-games
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape schedules and results
        env:
          MANUAL_SHEET_CSV: ${{ vars.MANUAL_SHEET_CSV }}
        run: python scripts/scrape_local.py

      - name: Commit if anything changed
        run: |
          git config user.name "powerplay-bot"
          git config user.email "powerplay-bot@users.noreply.github.com"
          git add data/local-games.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update local games"
            git push
          fi
