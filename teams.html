      var sc = el('div', 'tscroll'), tb = el('table'), th = el('tr'); th.appendChild(el('th', null, 'Player')); g.cols.forEach(function (c, i) { var x = el('th', i === g.key ? 'k' : null, c); th.appendChild(x); }); tb.appendChild(th);
      g.rows.forEach(function (r) { var tr = el('tr', us && r.team && us.test(r.team) ? 'us' : null); tr.appendChild(el('td', null, r.name)); r.vals.forEach(function (v, i) { tr.appendChild(el('td', i === g.key ? 'k' : null, String(v))); }); tb.appendChild(tr); });
      sc.appendChild(tb); w.appendChild(sc); gr.appendChild(w);
    });
    return gr;
  }
  function moreLink(box, href, txt) { var a = el('a', 'more', txt || 'Full stats \u203a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); }
  // the league-wide leaders (data/stats.json "leagues"): OHL, OJHL, GOHL
  function leagueKey(t) { var l = t.league || ''; return /^OHL/i.test(l) ? 'ohl' : /OJHL/i.test(l) ? 'ojhl' : /GOHL/i.test(l) ? 'gohl' : ''; }
  function leagueBox(key, us) {
    var L = statLeagues.filter(function (x) { return x.key === key; })[0];
    if (!L || !L.groups || !L.groups.length) return null;
    var b = el('div', 'box lgstats'); b.appendChild(el('h2', 'lgh', L.league + ' leaders'));
    b.appendChild(statTables(L.groups, us));
    if (L.link) moreLink(b, L.link, 'All ' + L.league.replace(/\s*\(.*\)/, '') + ' stats \u203a');
    return b;
  }
  function teamStats(t) {
    var nm = (t.full || t.name || '').toLowerCase();
    var st = statTeams.filter(function (x) { var c = (x.club || '').toLowerCase(); return c && (c === nm || c === (t.name || '').toLowerCase() || (t.sport && nm.indexOf(c) === 0 && new RegExp((x.league || '').split(' ').pop(), 'i').test(t.sport))); })[0];
    var wrap = el('div');
    if (st && st.groups && st.groups.length) {
      var b = el('div', 'box'); b.appendChild(el('h2', 'lgh', 'Team leaders')); b.appendChild(statTables(st.groups));
      if (st.link) moreLink(b, st.link);
      wrap.appendChild(b);
    }
    var lk = leagueKey(t), word = (t.name || '').split(' ').pop();
    var lb = lk && leagueBox(lk, word ? new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i') : null);
    if (lb) wrap.appendChild(lb);
    return wrap.children.length ? wrap : null;
  }
  // the team's standings: its own group, with its row highlighted
  function standings(t) {
    var f = findStd(t); if (!f) return null;
    var g = f.g, re = f.re, title = f.title;
    var head = t.hs ? title + (g.group && title.toLowerCase().indexOf(g.group.toLowerCase()) < 0 ? ' \u00b7 ' + g.group : '') : (g.group && g.group !== title ? g.group : title);
    return stdTable(g, re, head);
  }
  // where the team sits: "3rd in OUA Men's Basketball · West · 6-2"
  function standLine(t) {
    var f = findStd(t); if (!f) return '';
    var i = -1; f.g.teams.forEach(function (r, n) { if (i < 0 && f.re.test(r.name)) i = n; });
    if (i < 0) return '';
    var r = f.g.teams[i], cols = f.g.cols || ['GP', 'W', 'L', 'OTL', 'PTS'], vals = r.stats || [r.gp, r.w, r.l, r.otl, r.pts];
    var pick = function (k) { var j = cols.indexOf(k); return j >= 0 && vals[j] != null && vals[j] !== '' ? String(vals[j]) : null; };
    var one = pick('OVERALL') || pick('Record') || pick('W-L');
    var rec = one ? [one] : [pick('W'), pick('L'), pick('T') || pick('OTL') || pick('OTL/SOL')].filter(function (x, n) { return x != null && !(n === 2 && x === '0'); });
    if (!one && rec.length < 2) rec = [];
    var n = i + 1, ord = n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
    var where = (f.g.group || f.title || '').replace(/\s*\u00b7\s*/g, ' ');
    return ord + ' in ' + where + (rec.length ? ' \u00b7 ' + rec.join('-') : '');
  }
  function findStd(t) {
    var groups = null, re = null, title = 'Standings';
    var has = function (gs, rx) { return (gs || []).some(function (x) { return (x.teams || []).some(function (r) { return rx.test(r.name); }); }); };
    if (t.std && std[t.std[0]]) { groups = std[t.std[0]]; re = t.std[1]; }
    // university / college: the league whose sport (and men's / women's) matches AND has our team in it
    if (!groups && t.college) {
      var sp = t.college[1].toLowerCase(), base = sp.replace(/^(men's|women's)\s+/, '').replace('fastball', 'softball'), gender = /^(men's|women's)/.exec(sp);
      Object.keys(college).some(function (k) { var L = college[k], lab = ' ' + (L.label || '').toLowerCase();
        var gOk = !gender ? true : gender[1] === "women's" ? /women's/.test(lab) || !/men's/.test(lab) : /[^o]men's/.test(lab) || !/men's/.test(lab);
        if (lab.indexOf(base) >= 0 && gOk && has(L.groups, t.college[0])) { groups = L.groups; re = t.college[0]; title = L.label || title; return true; } return false; });
    }
    // high school: "Senior Girls Basketball" = sport "Girls Basketball", a "... Senior" tier with the school in it
    if (!groups && t.hs) {
      re = new RegExp('^' + t.hs[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
      var hsp = t.hs[1].toLowerCase(), level = /senior/.test(hsp) ? 'senior' : /junior/.test(hsp) ? 'junior' : '';
      Object.keys(hsStd).forEach(function (k) { var S = hsStd[k], sw = (S.sport || '').toLowerCase();
        if (groups || sw.split(' ').some(function (w) { return hsp.indexOf(w) < 0; })) return;
        (S.leagues || []).forEach(function (L) { var ln = (L.league || '').toLowerCase();
          if (!groups && (!level || ln.indexOf(level) >= 0) && has(L.groups, re)) { groups = L.groups; title = L.league + ' ' + S.sport; } }); });
    }
    if (!groups) return null;
    var g = groups.filter(function (x) { return (x.teams || []).some(function (r) { return re.test(r.name); }); })[0];
    if (!g) return null;
    return { g: g, re: re, title: title };
  }
  function stdTable(g, re, head) {
    var b = el('div', 'box'); b.appendChild(el('h3', null, head));
    var wrap = el('div', 'tscroll'), tb = el('table'), hr = el('tr');
    var cols = g.cols || ['GP', 'W', 'L', 'OTL', 'PTS'];
    hr.appendChild(el('th', null, 'Team')); cols.forEach(function (c) { hr.appendChild(el('th', null, c)); }); tb.appendChild(hr);
    g.teams.forEach(function (r) {
      var tr = el('tr', re.test(r.name) ? 'us' : null); tr.appendChild(el('td', null, r.name));
      var vals = r.stats || [r.gp, r.w, r.l, r.otl, r.pts]; vals.forEach(function (v) { tr.appendChild(el('td', null, v == null ? '' : String(v))); });
      tb.appendChild(tr);
    });
    wrap.appendChild(tb); b.appendChild(wrap); return b;
  }

  load(); setInterval(function () { var open = !document.getElementById('team').hidden ? document.getElementById('team').dataset.id : ''; load().then(function () { if (open && BYID[open]) openTeam(BYID[open], true); }); }, 5 * 60000);

  // the homepage asks to close (someone tapped the blurred page behind the box)
  window.addEventListener('message', function (e) { if (e.data && e.data.pp === 'closeteams' && BAR) { closeTeam(); barPick = ''; drawDrop(); markBar(); } });
  // the pro league box reports its height; its frame matches it
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.pp !== 'height' || !(e.data.h > 30)) return;
    [].forEach.call(document.querySelectorAll('#drop .profr'), function (pf) { if (e.source === pf.contentWindow) pf.style.height = Math.min(e.data.h, 6000) + 'px'; });
  });
  // inside the Local Hub: tell it how tall this is, so it never scrolls on its own
  (function () {
    if (window.parent === window) return; var last = 0;
    var lastB = 0;
    function send() { var h = Math.ceil(document.getElementById('page').getBoundingClientRect().height), bh = BAR ? Math.ceil(document.getElementById('bar').getBoundingClientRect().height) : 0;
      if (h && (Math.abs(h - last) > 2 || bh !== lastB)) { last = h; lastB = bh; try { parent.postMessage({ pp: 'height', h: h, bar: bh, open: BAR && (!document.getElementById('drop').hidden || !document.getElementById('team').hidden) }, '*'); } catch (e) {} } }
    window.addEventListener('load', send); window.addEventListener('resize', send);
    if (window.ResizeObserver) new ResizeObserver(send).observe(document.getElementById('page')); setInterval(send, 1500); send();
  })();
})();
