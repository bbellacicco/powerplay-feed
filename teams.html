<title>Find a Team | Powerplay Windsor</title>
<!--
  Find a Team: the first tab of the Local Hub (powerplaywindsor.com/scores-standings).
  Search any local team, school or league, or pick one from the list; each team shows its live game,
  next game, recent scores, what's coming up, its standings and its latest news.
  Every team has its own link to give out:  powerplaywindsor.com/scores-standings?team=<id>
  Reads the same data as the rest of the site (local-games, highschool, saints, standings, local-news).
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1a33; --card: #10244a; --card2: #132b57; --line: rgba(255,255,255,.1); --text: #f2f5fb; --muted: #a9b6d0; --accent: #e8b021; --live: #ff4d4d; --win: #3ccf7a; }

  /* ?view=bar: a slim bar of leagues at the top of the Local Hub; a team opens right under it */

  .bar .lb { flex: none; font: inherit; font-size: 13.5px; font-weight: 800; color: var(--text); background: var(--card2); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 8px 13px; cursor: pointer; white-space: nowrap; min-height: 38px; }

  .drop input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: #fff1; border: 2px solid rgba(255,255,255,.2); border-radius: 10px; padding: 10px 12px; outline: none; margin-bottom: 8px; }
  .drop input:focus { border-color: var(--accent); }
  html.barmode .team { padding: 10px 16px 14px; border-bottom: 1px solid var(--line); }
  html.barmode .team h1 { font-size: 28px; }
  html.barmode .thead { margin: 2px 0 10px; }
  html.barmode .box { padding: 10px 12px; } html.barmode .box h3 { font-size: 18px; margin-bottom: 4px; }

  @media (max-width: 760px) {
    .page { padding: 14px 12px 20px; } h1 { font-size: 32px; }

    .bar { padding: 8px 12px; flex-wrap: wrap; overflow: visible; gap: 6px; }
    .bar .lbl { width: 100%; font-size: 18px; margin: 0; }
    .bar .lb { font-size: 13px; padding: 7px 11px; min-height: 36px; }
    .g { grid-template-columns: 76px minmax(0, 1fr) auto !important; }
    .mgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .drop { padding: 8px 12px 10px; } html.barmode .team { padding: 10px 12px 12px; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .leagues { grid-template-columns: minmax(0, 1fr); }
    .g { grid-template-columns: 64px minmax(0, 1fr) auto; }
  }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="bar" id="bar" hidden></div>
  <div class="drop" id="drop" hidden></div>
  <div class="dir" id="dir">
    <h1>Find a <em>Team</em></h1>
    <div class="sub">Every local team&rsquo;s next game, scores, schedule and standings.</div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="Team, school or league&hellip; try &lsquo;Essex&rsquo; or &lsquo;Lancers hockey&rsquo;" autocomplete="off" enterkeyhint="search" aria-label="Find a team">
    </label>
    <div class="results" id="results"></div>
    <div class="leagues" id="leagues"><div class="none">Loading teams&hellip;</div></div>
  </div>
  <div class="team" id="team" hidden></div>
</div>
<script src="share.js"></script>
<script>
(function () {

  function get(n) { return fetch(DATA + n + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function slug(s) { return String(s).toLowerCase().replace(/&/g, 'and').replace(/'/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function fmt(d, o) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: TZ }, o)).format(d); }
  function dayKey(d) { return fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  var MON = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  function cpTime(d) { var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p.hour + (p.minute === '00' ? '' : ':' + p.minute) + ' ' + (/p/i.test(p.dayPeriod) ? 'p.m.' : 'a.m.'); }

    if (k === today) return 'Today'; if (k === dayKey(new Date(Date.now() + 864e5))) return 'Tomorrow'; if (k === dayKey(new Date(Date.now() - 864e5))) return 'Yesterday';
    var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, weekday: 'short', month: 'numeric', day: 'numeric' }).formatToParts(d).forEach(function (x) { p[x.type] = x.value; });

  // ---------- the teams ----------

  var SAINTS_SPORTS = ['Football', "Men's Basketball", "Women's Basketball", "Men's Volleyball", "Women's Volleyball", "Men's Soccer", "Women's Soccer", 'Fastball'];
  var JUNIOR = [['Leamington Flyers', 'OJHL (Jr. A)', 'ojhl', 'flyers leamington jr a'], ['LaSalle Vipers', 'GOHL (Jr. B)', 'gohl', 'vipers lasalle jr b'],

    ['Amherstburg Admirals', 'PJHL (Jr. C)', 'pjhl', 'admirals amherstburg jr c'], ['Lakeshore Canadiens', 'PJHL (Jr. C)', 'pjhl', 'canadiens lakeshore jr c'],
    ['Wheatley Sharks', 'PJHL (Jr. C)', 'pjhl', 'sharks wheatley omstead jr c']];
  var T = [], BYID = {};
  function addTeam(t) { if (BYID[t.id]) return BYID[t.id]; T.push(t); BYID[t.id] = t; return t; }

  var games = [], news = [], std = {}, college = {}, hsStd = {}, vids = [], snaps = [];
  function load() {
    return Promise.all([get('local-games.json'), get('highschool.json'), get('saints.json'), get('local-news.json'), get('college-standings.json'), get('hs-standings.json'), get('network.json'), get('slideshows.json')]).then(function (r) {
      var lg = r[0] || {}, hs = r[1], sc = r[2];

        .concat(sc && sc.games ? sc.games.filter(function (g) { return g.sport !== 'Football'; }) : []);
      var seen = {}; games = games.filter(function (g) { var k = g.id || (g.team + g.start + g.opponent); if (seen[k]) return false; seen[k] = 1; return true; });
      var net = r[6] || {};
      vids = ((net.local || []).map(function (v) { return { t: v.t, u: v.u, i: v.i, p: v.p, d: v.d || '', src: v.s || 'Powerplay' }; }))
        .concat((net.pro || []).filter(function (v) { return v.sp; }).map(function (v) { return { t: v.t.replace(/^OHL Highlights:\s*/i, 'Highlights: ').replace(/\s+@\s+/, ' at ').replace(/\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+\d{4}\s*$/i, ''), u: v.u, i: v.i, p: v.p, src: 'OHL', sp: 1 }; }))
        .sort(function (a, b) { return new Date(b.p) - new Date(a.p); });
      snaps = (r[7] && r[7].slideshows) || [];
      news = (r[3] && r[3].stories) || []; std = lg.standings || {}; college = (r[4] && r[4].leagues) || {}; hsStd = (r[5] && r[5].sports) || {};
      build();
    });
  }
  function build() {
    T = []; BYID = {};
    var SPORTW = /football|hockey|basketball|volleyball|soccer|fastball|softball|baseball|curling|wrestling|swim|track|cross country|rugby|golf|tennis/i;
    function sportRx(sp) { var base = sp.replace(/^(men's|women's)\s+/i, '').toLowerCase(); return base === 'football' ? /football|touchdown|\btd'?s?\b|quarterback|yards/i : new RegExp(base, 'i'); }
    addTeam({ id: 'spitfires', name: 'Windsor Spitfires', league: 'OHL', sec: 'ohl', words: 'spitfires spits ohl windsor hockey', about: function (x) { return /spitfires|\bspits\b/i.test(x); },
      match: function (g) { return g.team === 'spitfires'; }, std: ['ohl', /spitfires/i], news: function (s) { return s.team === 'spitfires'; } });
    var lanS = LANCERS_SPORTS.slice(); games.forEach(function (g) { if (g.team === 'lancers' && lanS.indexOf(g.sport) < 0) lanS.push(g.sport); });
    lanS.forEach(function (sp) {
      var lrx = sportRx(sp), women = /women/i.test(sp);
      addTeam({ about: function (x) { return /lancer|uwindsor/i.test(x) && lrx.test(x) && (/women/i.test(x) === women || !/(men|women)/i.test(x)); }, id: 'lancers-' + slug(sp), name: 'Lancers ' + sp, full: 'Windsor Lancers ' + sp, league: 'U Sports · OUA', sec: 'lancers', sport: sp, words: 'lancers uwindsor university of windsor oua ' + sp,
        match: function (g) { return g.team === 'lancers' && g.sport === sp; }, college: [/windsor/i, sp], news: function (s) { return s.team === 'lancers' && (!s.sport || s.sport === sp); } });
    });
    var saiS = SAINTS_SPORTS.slice(); games.forEach(function (g) { if (g.team === 'saints' && saiS.indexOf(g.sport) < 0) saiS.push(g.sport); });
    saiS.forEach(function (sp) {
      var srx = sportRx(sp), swomen = /women/i.test(sp);
      addTeam({ about: function (x) { return /\bsaints\b|st\.? clair/i.test(x) && srx.test(x) && (/women/i.test(x) === swomen || !/(men|women)/i.test(x)); }, id: 'saints-' + slug(sp), name: 'Saints ' + sp, full: 'St. Clair Saints ' + sp, league: sp === 'Football' ? 'CJFL' : 'OCAA', sec: 'saints', sport: sp, words: 'saints st clair college ocaa ' + sp,
        match: function (g) { return g.team === 'saints' && g.sport === sp; }, std: sp === 'Football' ? ['cjfl', /st\.? clair/i] : null, college: [/st\.? clair/i, sp],
        news: function (s) { return s.team === 'saints'; } });
    });
    var clubs = JUNIOR.slice(); games.forEach(function (g) { if (g.team === 'junior' && g.club && !clubs.some(function (c) { return c[0] === g.club; })) clubs.push([g.club, g.sport || 'Junior hockey', '', '']); });
    clubs.forEach(function (c) {
      var key = c[0].split(' ')[0];   // the town: Essex, LaSalle, Lakeshore...
      var nick = c[0].split(' ').slice(1).join(' ').replace(/'s$/, '').replace(/[.*+?^${}()|[\]\\']/g, '.?');
      var town = c[0].split(' ')[0];
      // Vipers, 73's / 73s, Admirals... (nicknames NHL teams share need the town too: Lakeshore Canadiens, Leamington Flyers, Wheatley Sharks)
