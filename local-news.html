<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Feed | Powerplay Windsor</title>
<!--
  Local story feed: headlines, a short summary and a photo from Powerplay Windsor and the teams' own
  websites (Spitfires, Lancers, St. Clair Saints and the junior clubs), each
  linking to the original story. Data: data/local-news.json, collected by the
  Powerplay PC every 30 minutes.

  Embed in Wix (Embed Code > Embed a site):
    https://bbellacicco.github.io/powerplay-feed/local-news.html
  Optional: ?view=social   open on the Social view
  Optional: ?tab=powerplay | spitfires | lancers | saints | junior   start on one team
-->
<style>
  :root {
    --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021;
    --powerplay: #e8b021; --spitfires: #d4202a; --lancers: #0b5cad; --saints: #1f9d55; --junior: #0891b2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
  header { margin-bottom: 10px; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  select.pill { padding-right: 8px; }
  .story { display: grid; grid-template-columns: 4px 128px 1fr; gap: 12px; align-items: start;
    background: var(--row); border-radius: 8px; margin-bottom: 8px; overflow: hidden;
    color: inherit; text-decoration: none; padding-right: 12px; }
  .story:hover { background: #17336a; }
  .stripe { align-self: stretch; }
  .t-powerplay .stripe { background: var(--powerplay); } .t-spitfires .stripe { background: var(--spitfires); } .t-lancers .stripe { background: var(--lancers); }
  .t-saints .stripe { background: var(--saints); } .t-junior .stripe { background: var(--junior); }
  .thumb { width: 128px; height: 80px; margin: 10px 0; border-radius: 6px; object-fit: cover; background: var(--panel); display: block; }
  .body { padding: 10px 0; min-width: 0; }
  .headline { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .summary { color: #d4dcee; font-size: 13px; margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .views { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .views button { border: 0; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--accent); color: #111; font-weight: 600; }
  .grid { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .box { background: var(--row); border-radius: 8px; padding: 10px; flex: 1 1 340px; min-width: 0; max-width: 520px; }
  .box h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .box h2 a { color: var(--accent); text-decoration: none; font-size: 12px; text-transform: none; letter-spacing: 0; white-space: nowrap; }
  .fb { width: 100%; border: 0; border-radius: 6px; background: #fff; display: block; }
  .yt { position: relative; width: 100%; padding-top: 56.25%; border-radius: 6px; overflow: hidden; background: #000; }
  .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .wall .box { flex: 1 1 260px; max-width: 100%; }
  @media (min-width: 700px) { .wall .box { flex: 0 1 calc(33.333% - 8px); } }
  .note { color: var(--muted); font-size: 12px; margin-top: 6px; }
  footer { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; }
  @media (max-width: 520px) {
    .story { grid-template-columns: 4px 96px 1fr; gap: 10px; }
    .thumb { width: 96px; height: 64px; }
    .headline { font-size: 14px; }
    .summary { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Local <span>Feed</span></h1>
    <div class="views" role="group" aria-label="View"><button id="v-stories">Stories</button><button id="v-social">Social</button></div></header>
  <div class="bar" id="tabs" role="group" aria-label="Team"></div>
  <div class="bar"><select class="pill" id="sub" aria-label="Filter"></select></div>
  <div id="list"><div class="empty">Loading stories…</div></div>
  <footer id="foot">Powerplay Windsor · Stories from Powerplay Windsor and the teams' own websites. Tap a story to read it there.</footer>
</div>
<script>
(function () {
  var TZ = 'America/Toronto';
  var URL = 'https://bbellacicco.github.io/powerplay-feed/data/local-news.json';
  var MAX_STORIES = 40;
  var TABS = [['all', 'All'], ['powerplay', 'Powerplay'], ['spitfires', 'Spitfires'], ['lancers', 'Lancers'], ['saints', 'Saints'], ['junior', 'Junior Hockey']];
  var LABEL = { powerplay: 'Powerplay', spitfires: 'Spitfires', lancers: 'Lancers', saints: 'Saints', junior: 'Junior Hockey' };

  var qs = new URLSearchParams(location.search);
  var state = { tab: LABEL[qs.get('tab')] ? qs.get('tab') : 'all', sub: 'all',
                view: qs.get('view') === 'social' ? 'social' : 'stories', club: 0 };

  // ---- Social view: each team's official Facebook page (Facebook's Page Plugin) and,
  // where they have one, their YouTube channel's latest uploads.
  var SOCIAL = {
    powerplay: [{ name: 'Powerplay Windsor', facebook: 'https://www.facebook.com/powerplaysportsvideo', youtube: 'UC0ZFyMf1Zo_vR5h2oWSwDlw' }],
    spitfires: [{ name: 'Windsor Spitfires', facebook: 'https://www.facebook.com/WindsorSpitfiresHockey', youtube: 'UCnEwkQtTCI_AaIgTyobHm-A' }],
    lancers:   [{ name: 'Windsor Lancers', facebook: 'https://www.facebook.com/windsorlancers' }],
    saints:    [{ name: 'St. Clair Saints', facebook: 'https://www.facebook.com/stclaircollegesaints' }],
    junior: [
      { name: 'Amherstburg Admirals', facebook: 'https://www.facebook.com/amherstburgjrc' },
      { name: 'Chatham Maroons', facebook: 'https://www.facebook.com/FANSOFCHATHAMMAROONSHOCKEY' },
      { name: "Essex 73's", facebook: 'https://www.facebook.com/Essex73s' },
      { name: 'Lakeshore Canadiens', facebook: 'https://www.facebook.com/LakeshoreCanadiens' },
      { name: 'LaSalle Vipers', facebook: 'https://www.facebook.com/lasallevipers' },
      { name: 'Leamington Flyers', facebook: 'https://www.facebook.com/LeamingtonFlyersHockey' },
      { name: 'Wheatley Sharks', facebook: 'https://www.facebook.com/WheatleySharksJrCHockey' }
    ]
  };
  var FB_HEIGHT = 720;

  function views() {
    [['stories', 'v-stories'], ['social', 'v-social']].forEach(function (v) {
      var b = document.getElementById(v[1]);
      b.setAttribute('aria-pressed', String(state.view === v[0]));
      b.onclick = function () { if (state.view !== v[0]) { state.view = v[0]; state.club = 0; render(); } };
    });
    document.getElementById('foot').textContent = state.view === 'social'
      ? "Powerplay Windsor · Posts load from each team's official Facebook page and YouTube channel."
      : "Powerplay Windsor · Stories from Powerplay Windsor and the teams' own websites. Tap a story to read it there.";
  }

  function heading(text, href, label) {
    var h = el('h2', null, text);
    if (href) { var a = el('a', null, label); a.href = href; a.target = '_blank'; a.rel = 'noopener'; h.appendChild(a); }
    return h;
  }

  // "All": one small box per team showing its newest Facebook post, Powerplay first
  var WALL_HEIGHT = 560;
  function fbFrame(team, w, h) {
    var f = document.createElement('iframe');
    f.className = 'fb'; f.height = h; f.title = team.name + ' Facebook posts'; f.loading = 'lazy';
    f.allow = 'encrypted-media; clipboard-write; web-share';
    f.src = 'https://www.facebook.com/plugins/page.php?href=' + encodeURIComponent(team.facebook) +
      '&tabs=timeline&width=' + w + '&height=' + h +
      '&small_header=true&adapt_container_width=true&hide_cover=true&show_facepile=false';
    return f;
  }
  function socialWall() {
    document.getElementById('sub').style.display = 'none';
    var box = document.getElementById('list'); box.innerHTML = '';
    var grid = el('div', 'grid wall'); box.appendChild(grid);
    var all = [].concat(SOCIAL.powerplay, SOCIAL.spitfires, SOCIAL.lancers, SOCIAL.saints, SOCIAL.junior);
    var boxes = all.map(function (team) {
      var b = el('div', 'box');
      b.appendChild(heading(team.name, team.facebook, 'Open ↗'));
      grid.appendChild(b);
      return b;
    });
    var w = Math.max(180, Math.min(500, Math.floor(boxes[0].clientWidth - 20)));
    boxes.forEach(function (b, i) { b.appendChild(fbFrame(all[i], w, WALL_HEIGHT)); });
    box.appendChild(el('div', 'note', "Newest post from each team. Pick a team above for its full feed. Posts not showing? Some browsers' privacy settings block Facebook feeds."));
  }

  function renderSocial() {
    tabs();
    if (state.tab === 'all') return socialWall();
    var list = SOCIAL[state.tab], sel = document.getElementById('sub');
    sel.innerHTML = '';
    list.forEach(function (c, i) { sel.appendChild(new Option(c.name, String(i))); });
    sel.value = String(state.club);
    sel.style.display = list.length > 1 ? '' : 'none';
    sel.onchange = function () { state.club = Number(sel.value); render(); };

    var team = list[state.club] || list[0];
    var box = document.getElementById('list'); box.innerHTML = '';
    var grid = el('div', 'grid'); box.appendChild(grid);
    if (team.youtube) {
      var yt = el('div', 'box');
      yt.appendChild(heading('Latest videos', 'https://www.youtube.com/channel/' + team.youtube + '/videos', 'YouTube ↗'));
      var frame = el('div', 'yt'), f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/videoseries?list=UU' + team.youtube.slice(2);   // channel uploads, newest first
      f.title = team.name + ' videos'; f.loading = 'lazy'; f.allowFullscreen = true;
      f.allow = 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      frame.appendChild(f); yt.appendChild(frame); grid.appendChild(yt);
    }
    var fb = el('div', 'box');
    fb.appendChild(heading(team.name + ' on Facebook', team.facebook, 'Open ↗'));
    grid.appendChild(fb);
    var w = Math.max(180, Math.min(500, Math.floor(fb.clientWidth - 20)));   // Page Plugin wants 180–500px
    fb.appendChild(fbFrame(team, w, FB_HEIGHT));
    fb.appendChild(el('div', 'note', "Posts not showing? Some browsers' privacy settings block Facebook feeds. Use Open ↗ to see them on Facebook."));
  }
  var stories = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ago(iso) {
    var t = new Date(iso).getTime(); if (!t) return '';
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 60) return Math.max(m, 1) + ' min ago';
    var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.round(h / 24); if (d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, month: 'short', day: 'numeric' }).format(new Date(t));
  }

  function load() {
    fetch(URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (j) { stories = j.stories || []; if (state.view === 'stories') render(); })
      .catch(function () { if (!stories) { document.getElementById('list').innerHTML = '<div class="empty">Stories unavailable right now.</div>'; } });
  }

  function tabs() {
    var box = document.getElementById('tabs'); box.innerHTML = '';
    TABS.forEach(function (t) {
      var b = el('button', 'pill', t[1]);
      b.setAttribute('aria-pressed', String(state.tab === t[0]));
      b.onclick = function () { state.tab = t[0]; state.sub = 'all'; state.club = 0; render(); };
      box.appendChild(b);
    });
  }

  // second filter: clubs on the Junior Hockey tab, sports on the Lancers / Saints tabs
  function subKey(s) { return state.tab === 'junior' ? s.club : s.sport; }
  function subSelect(list) {
    var sel = document.getElementById('sub');
    var names = {};
    if (state.tab === 'junior' || state.tab === 'lancers' || state.tab === 'saints')
      list.forEach(function (s) { var k = subKey(s); if (k) names[k] = 1; });
    var keys = Object.keys(names).sort();
    sel.innerHTML = '';
    sel.appendChild(new Option(state.tab === 'junior' ? 'All clubs' : 'All sports', 'all'));
    keys.forEach(function (n) { sel.appendChild(new Option(n, n)); });
    if (keys.indexOf(state.sub) < 0) state.sub = 'all';
    sel.value = state.sub;
    sel.style.display = keys.length > 1 ? '' : 'none';
    sel.onchange = function () { state.sub = sel.value; render(); };
  }

  // Powerplay's own stories go to the top of "All" for up to 3 days after they're posted,
  // newest first; after that they take their normal place by date.
  var TOP_DAYS = 3;
  function isTop(s) { return s.team === 'powerplay' && Date.now() - new Date(s.published).getTime() < TOP_DAYS * 864e5; }
  function featured(list) {
    return list.filter(isTop).concat(list.filter(function (s) { return !isTop(s); }));
  }

  function render() {
    views();
    if (state.view === 'social') return renderSocial();
    tabs();
    if (!stories) return;
    var list = state.tab === 'all' ? featured(stories) : stories.filter(function (s) { return s.team === state.tab; });
    subSelect(list);
    if (state.sub !== 'all') list = list.filter(function (s) { return subKey(s) === state.sub; });
    list = list.slice(0, MAX_STORIES);
    var box = document.getElementById('list'); box.innerHTML = '';
    if (!list.length) { box.appendChild(el('div', 'empty', 'No recent stories.')); return; }
    list.forEach(function (s) { box.appendChild(card(s)); });
  }

  function card(s) {
    var a = el('a', 'story t-' + s.team);
    a.href = s.url; a.rel = 'noopener';
    a.target = s.team === 'powerplay' ? '_top' : '_blank';   // your own stories open right on your site
    a.appendChild(el('div', 'stripe'));
    var img = el('img', 'thumb'); img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
    img.onerror = function () { img.style.visibility = 'hidden'; };
    if (s.image) img.src = s.image; else img.style.visibility = 'hidden';
    a.appendChild(img);
    var body = el('div', 'body');
    body.appendChild(el('div', 'headline', s.headline));
    if (s.summary && s.summary !== s.headline) body.appendChild(el('div', 'summary', s.summary));
    var who = s.team === 'junior' || s.team === 'powerplay' ? s.club : LABEL[s.team] + (s.sport ? ' · ' + s.sport : '');
    body.appendChild(el('div', 'meta', [who, ago(s.published)].filter(Boolean).join(' · ')));
    a.appendChild(body);
    return a;
  }

  var rt, lastW = window.innerWidth;   // redraw the Facebook box when the width changes (not on phone scroll)
  window.addEventListener('resize', function () { if (window.innerWidth === lastW) return; lastW = window.innerWidth;
    clearTimeout(rt); rt = setTimeout(function () { if (state.view === 'social') render(); }, 400); });
  render();
  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
