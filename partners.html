<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
<title>Partners | Powerplay Windsor</title>
<!--
  The Partners page: the businesses supporting local sports, and the teams and organizations partnered
  with Powerplay. Logos sit on matching white tiles; a partner with a website in partners.txt is a link.
  The list is data/partners.json, made by publish.bat from partners.txt.
  Embed on its own Wix page, full width: about 1,350px tall on desktop, 1,550px on mobile.
  ?contact=<link>   adds a "Want to support local sports? Get in touch" box pointing there
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 14px 24px; }
  header { text-align: center; margin-bottom: 8px; }
  h1 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 24px; -webkit-text-stroke: .8px currentColor; paint-order: stroke fill;
    letter-spacing: .03em; text-transform: uppercase; margin: 0; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 13px; margin-top: 6px; }
  section { margin-top: 22px; }
  h2 { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; font-weight: 800; }
  h2::before, h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .p { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; }
  .tile { aspect-ratio: 1 / 1; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 14px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .15s, box-shadow .15s; }
  .tile img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  a.p:hover .tile, a.p:focus-visible .tile { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  a.p:focus-visible { outline: none; } a.p:focus-visible .tile { outline: 3px solid var(--accent); outline-offset: 2px; }
  .name { font-size: 12px; font-weight: 600; text-align: center; color: var(--muted); line-height: 1.25; min-height: 1.25em; }
  a.p .name { color: var(--text); }
  a.p:hover .name { color: var(--accent); }
  .cta[hidden] { display: none; }
  .cta { margin: 28px auto 0; max-width: 620px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .cta b { display: block; font-size: 15px; margin-bottom: 4px; }
  .cta span { color: var(--muted); font-size: 13px; }
  .cta a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } .tile { padding: 10px; } h1 { font-size: 20px; } }
  @media (max-width: 380px) { .name { font-size: 11px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Our <span>Partners</span></h1>
    <div class="tag">The businesses, teams and organizations that help Powerplay cover Windsor-Essex sports</div>
  </header>
  <div id="groups"><div class="empty">Loading…</div></div>
  <div class="cta" id="cta" hidden>
    <b>Want to support local sports?</b>
    <span>Partner with Powerplay Windsor and reach Windsor-Essex sports fans. <a id="contact" target="_top" href="#">Get in touch &rarr;</a></span>
  </div>
</div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var qs = new URLSearchParams(location.search);
  // the "Want to support local sports?" box shows when ?contact= gives a link (a contact page, or mailto:you@...)
  if (qs.get('contact')) { document.getElementById('contact').href = qs.get('contact'); document.getElementById('cta').hidden = false; }
  var TITLES = { businesses: 'Businesses supporting local sports', teams: 'Teams and organizations' };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function src(logo) {
    if (/static\.wixstatic\.com\/media\/[^/]+$/.test(logo)) return logo + '/v1/fit/w_400,h_400,q_90/logo.png';   // a small, sharp copy
    return /^https?:/.test(logo) ? logo : REPO + logo;
  }
  fetch(REPO + 'data/partners.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    .then(function (j) {
      var box = document.getElementById('groups'); box.innerHTML = '';
      var groups = (j && j.groups) || [];
      if (!groups.length) { box.appendChild(el('div', 'empty', 'Partners coming soon.')); return; }
      groups.forEach(function (g) {
        if (!g.partners || !g.partners.length) return;
        var sec = el('section');
        sec.appendChild(el('h2', null, TITLES[(g.group || '').toLowerCase()] || g.group));
        var grid = el('div', 'grid');
        g.partners.forEach(function (p) {
          var a = el(p.url ? 'a' : 'div', 'p');
          if (p.url) { a.href = p.url; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', (p.name || 'Partner') + ' (opens their website)'); }
          var t = el('div', 'tile'), img = new Image();
          img.src = src(p.logo); img.alt = p.name || 'Partner logo'; img.loading = 'lazy';
          img.onerror = function () { var raw = /^https?:/.test(p.logo) ? p.logo : REPO + p.logo; if (img.src !== raw) img.src = raw; };
          t.appendChild(img); a.appendChild(t);
          a.appendChild(el('div', 'name', p.name || ''));
          grid.appendChild(a);
        });
        sec.appendChild(grid); box.appendChild(sec);
      });
    });
})();
</script>
</body>
</html>
