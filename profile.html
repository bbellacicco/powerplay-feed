<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athlete Profile | Powerplay Windsor</title>
<!--
  Full-screen athlete profile viewer. iPhones can't make part of a web page full screen, so on iPhone a tapped
  profile (athletes.html / athletes-strip.html) opens here instead. Swipe or use the arrows; Back returns.
  ?i=<number>   which profile (0 = newest), from data/profiles.json
  ?back=<url>   where Back goes if there's no page to go back to (default the Spotlights page)
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .bar { position: fixed; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px; background: linear-gradient(rgba(0,0,0,.75), transparent); }
  .bar button { background: rgba(11,26,51,.9); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; font: inherit; font-weight: 700; padding: 8px 14px; cursor: pointer; }
  .pos { color: #cfd8ea; font-size: 13px; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; touch-action: pan-y pinch-zoom; }
  .stage img { max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
  .nav { position: fixed; top: 50%; margin-top: -24px; z-index: 3; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(11,26,51,.75); color: #fff; font-size: 24px; cursor: pointer; }
  .prev { left: 8px; } .next { right: 8px; }
  .msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb0cf; }
</style>
</head>
<body>
  <div class="bar"><button type="button" id="back">&larr; Back</button><span class="pos" id="pos"></span></div>
  <div class="stage" id="stage"><img id="big" alt="Athlete profile"></div>
  <button class="nav prev" type="button" id="prev" aria-label="Previous profile">&#8249;</button>
  <button class="nav next" type="button" id="next" aria-label="Next profile">&#8250;</button>
  <div class="msg" id="msg">Loading…</div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var qs = new URLSearchParams(location.search);
  var BACK = qs.get('back') || 'https://www.powerplaywindsor.com/local-sports';
  var list = [], cur = Math.max(0, parseInt(qs.get('i'), 10) || 0);
  var big = document.getElementById('big');
  function full(src) { return /^https?:/.test(src) ? src : REPO + src; }
  function large(src) { return /static\.wixstatic\.com\/media\/[^/]+$/.test(src) ? src + '/v1/fit/w_1400,h_2000,q_88/profile.png' : full(src); }
  function show(n) {
    if (!list.length) return;
    cur = (n + list.length) % list.length;
    big.src = large(list[cur].img);
    big.onerror = function () { if (big.src !== full(list[cur].img)) big.src = full(list[cur].img); };
    document.getElementById('pos').textContent = (cur + 1) + ' of ' + list.length;
    try { history.replaceState(null, '', '?i=' + cur + (qs.get('back') ? '&back=' + encodeURIComponent(BACK) : '')); } catch (e) {}
    // load the neighbours early so swiping is instant
    [cur + 1, cur - 1].forEach(function (k) { var p = list[(k + list.length) % list.length]; if (p) { var im = new Image(); im.src = large(p.img); } });
  }
  document.getElementById('prev').onclick = function () { show(cur - 1); };
  document.getElementById('next').onclick = function () { show(cur + 1); };
  document.getElementById('back').onclick = function () { if (history.length > 1) history.back(); else location.href = BACK; };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1); else if (e.key === 'Escape') document.getElementById('back').click();
  });
  var sx = null, sy = null;
  document.getElementById('stage').addEventListener('touchstart', function (e) { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  document.getElementById('stage').addEventListener('touchend', function (e) {
    if (sx == null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1));
  });
  fetch(REPO + 'data/profiles.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    .then(function (j) {
      list = (j && j.profiles || []).filter(function (p) { return p && p.img; });
      var m = document.getElementById('msg');
      if (!list.length) { m.textContent = 'Profile unavailable right now.'; return; }
      m.remove(); show(Math.min(cur, list.length - 1));
    });
})();
</script>
</body>
</html>
