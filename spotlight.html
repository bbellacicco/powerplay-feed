<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
<title>Local Sports Spotlight | Powerplay Windsor</title>
<!--
  The Local Sports Spotlight, powered by the Windsor Essex County Sports Hall of Fame.
  Four features, each a playlist on the Powerplay YouTube channel:
    Sports Flashback, I Remember When, Meet Our Community, The Sports Timeout.
  Data: data/spotlight.json (Buddy's PC, every 6 hours). Each feature is one scrolling row, newest first;
  videos play right on the page.
  Embed on its own Wix page, full width: about 1,300px tall on desktop, 1,250px on mobile.
  ?hof=<url>   makes the Hall of Fame logo a link
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; --hof: #f2b81c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 0 20px; position: relative; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 0 14px 14px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  h1 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 22px; -webkit-text-stroke: .8px currentColor; paint-order: stroke fill;
    letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1.15; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .powered { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; text-decoration: none; }
  .powered .tile { background: #fff; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; border-bottom: 3px solid var(--hof); }
  .powered img { height: 62px; width: auto; display: block; }
  section { padding: 12px 0 4px; }
  .shead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 14px 8px; }
  h2 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 16px; -webkit-text-stroke: .5px currentColor; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
  h2 b { color: var(--accent); font-weight: 400; }
  .sdesc { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .all { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 12px; white-space: nowrap; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 0 14px 10px; scroll-snap-type: x mandatory; scroll-padding-left: 14px; scrollbar-width: thin; }
  .card { flex: 0 0 auto; width: 240px; background: var(--row); border-radius: 8px; overflow: hidden; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer;
    scroll-snap-align: start; display: flex; flex-direction: column; border-top: 3px solid var(--hof); }
  .card:hover .hl, .card:focus-visible .hl { text-decoration: underline; }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--panel); overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: rgba(0,0,0,.6); border: 2px solid #fff; transition: transform .15s; }
  .card:hover .play { transform: scale(1.08); background: rgba(232,176,33,.92); }
  .play::after { content: ""; position: absolute; left: 15px; top: 11px; border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent; }
  .new { position: absolute; left: 6px; top: 6px; background: var(--accent); color: #0b1a33; font-size: 10px; font-weight: 900; letter-spacing: .08em; padding: 2px 6px; border-radius: 3px; }
  .body { padding: 7px 9px 9px; }
  .meta { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
  .hl { font-weight: 700; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); padding: 8px 14px 14px; }
  .player { position: absolute; left: 14px; right: 14px; z-index: 5; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); display: none; }
  .player.on { display: block; }
  .player .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .cap { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel); }
  .player .cap .t { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .cap a, .player .cap button { flex: none; background: var(--row); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; cursor: pointer; text-decoration: none; }
  .player .cap a:hover, .player .cap button:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 560px) {
    h1 { font-size: 18px; } .powered img { height: 50px; } .card { width: 200px; }
    .sdesc { display: none; } .player { left: 8px; right: 8px; } .player .cap .t { display: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div>
      <h1>The Local Sports <span>Spotlight</span></h1>
      <div class="tag">Stories of the people who make Windsor-Essex sports</div>
    </div>
    <a class="powered" id="powered">
      <span>Powered by</span>
      <span class="tile"><img src="logos/wecshof.png" alt="Windsor / Essex County Sports Hall of Fame"></span>
    </a>
  </header>
  <div id="features"><div class="empty">Loading…</div></div>
  <div class="player" id="player" role="dialog" aria-label="Video player">
    <div class="frame" id="frame"></div>
    <div class="cap"><div class="t" id="ptitle"></div><a id="ext" target="_blank" rel="noopener" href="#">Watch on YouTube &#8599;</a><button type="button" id="close">&#10005; Close</button></div>
  </div>
</div>
<script>
(function () {
  var BASE = 'https://bbellacicco.github.io/powerplay-feed/data/';
  var qs = new URLSearchParams(location.search);
  if (qs.get('hof')) { var pw = document.getElementById('powered'); pw.href = qs.get('hof'); pw.target = '_blank'; pw.rel = 'noopener'; }
  var DESC = {
    flashback: 'Local greats look back at the moments that defined their careers.',
    remember: 'Windsor-Essex sports figures share the memories that stay with them.',
    community: 'Get to know the athletes, coaches and builders in our community.',
    timeout: 'Quick tips from local pros and experts to help your game.'
  };
  // the playlists, in case the data file hasn't been made yet (the row then says "on the way")
  var FALLBACK = [
    { key: 'flashback', name: 'Sports Flashback', playlist: 'https://www.youtube.com/playlist?list=PLe7kSxNwK3ZK2OvsldVK1Z6dCYFep-qA-', videos: [] },
    { key: 'remember', name: 'I Remember When', playlist: 'https://www.youtube.com/playlist?list=PLe7kSxNwK3ZKnujKsE9FS8cC2eCXtSOht', videos: [] },
    { key: 'community', name: 'Meet Our Community', playlist: 'https://www.youtube.com/playlist?list=PLe7kSxNwK3ZK8OXkuDHgBuaE1mC6mCPT8', videos: [] },
    { key: 'timeout', name: 'The Sports Timeout', playlist: 'https://www.youtube.com/playlist?list=PLe7kSxNwK3ZIHkgQ3JP3SiRGh9dqVnzIC', videos: [] }
  ];

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  var MON = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  function date(iso) {    // CP style: Oct. 26, 2023
    if (!iso) return '';
    var t = new Date(iso.length === 10 ? iso + 'T12:00:00' : iso); if (isNaN(t)) return '';
    var p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(t).forEach(function (x) { p[x.type] = x.value; });
    return MON[+p.month - 1] + ' ' + (+p.day) + ', ' + p.year;
  }
  // "Flashback, Jeannine Garside" / "Paul Boots, Meet Our Community" -> just the name; the row already says the feature
  function clean(t, name) {
    var f = name.replace(/^The /, '').replace(/\.+$/, '');
    var words = f.split(' ').concat(['Flashback', 'Sports Flashback', 'Meet Our Community', 'MEET OUR COMMUNITY', 'I Remember When']);
    var out = t.replace(/&amp;/g, '&');
    words.sort(function (a, b) { return b.length - a.length; }).forEach(function (w) {
      if (w.length < 6) return;
      var esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      out = out.replace(new RegExp('^\\s*' + esc + '\\.*\\s*[:,\\-–]?\\s+', 'i'), '').replace(new RegExp('[\\s,:\\-–]+' + esc + '\\.*\\s*$', 'i'), '');
    });
    out = out.replace(/\s{2,}/g, ' ').trim();
    return out.length >= 3 ? out : t;
  }
  function vid(u) { var m = u.match(/[?&]v=([\w-]{11})/) || u.match(/youtu\.be\/([\w-]{11})/); return m ? m[1] : ''; }

  var player = document.getElementById('player'), frame = document.getElementById('frame');
  function play(v, sec) {
    var id = vid(v.u); if (!id) { window.open(v.u, '_blank', 'noopener'); return; }
    frame.innerHTML = '';
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1&modestbranding=1'; f.title = v.t;
    f.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media'; f.allowFullscreen = true;
    frame.appendChild(f);
    document.getElementById('ptitle').textContent = v.t;
    document.getElementById('ext').href = v.u;
    player.classList.add('on');
    // over the row that was tapped, without running past the bottom of the page
    var wrap = document.getElementById('wrap');
    var y = sec.offsetTop, maxY = Math.max(0, wrap.offsetHeight - player.offsetHeight - 6);
    player.style.top = Math.min(y, maxY) + 'px';
    document.getElementById('close').focus({ preventScroll: true });
  }
  function stop() { player.classList.remove('on'); frame.innerHTML = ''; }
  document.getElementById('close').onclick = stop;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') stop(); });

  function render(features) {
    var box = document.getElementById('features'); box.innerHTML = '';
    features.forEach(function (f) {
      var sec = el('section'), head = el('div', 'shead'), left = el('div');
      var words = f.name.split(' '), last = words.pop();
      var h = el('h2'); h.appendChild(document.createTextNode(words.join(' ') + ' ')); h.appendChild(el('b', null, last));
      left.appendChild(h); left.appendChild(el('div', 'sdesc', DESC[f.key] || ''));
      head.appendChild(left);
      var all = el('a', 'all', (f.videos.length ? f.videos.length + ' videos' : 'Playlist') + ' ↗'); all.href = f.playlist; all.target = '_blank'; all.rel = 'noopener';
      head.appendChild(all); sec.appendChild(head);
      if (!f.videos.length) { sec.appendChild(el('div', 'empty', 'Videos are on the way.')); box.appendChild(sec); return; }
      var strip = el('div', 'strip');
      f.videos.forEach(function (v) {
        var c = el('button', 'card'); c.type = 'button'; c.setAttribute('aria-label', 'Play: ' + v.t);
        var th = el('div', 'thumb');
        var src = v.i || (vid(v.u) ? 'https://i.ytimg.com/vi/' + vid(v.u) + '/hqdefault.jpg' : '');
        if (src) { var img = new Image(); img.src = src; img.alt = ''; img.loading = 'lazy'; img.onerror = function () { img.remove(); }; th.appendChild(img); }
        th.appendChild(el('div', 'play'));
        if (v.p && Date.now() - new Date(v.p.length === 10 ? v.p + 'T12:00:00' : v.p).getTime() < 14 * 864e5) th.appendChild(el('div', 'new', 'NEW'));
        c.appendChild(th);
        var b = el('div', 'body'); b.appendChild(el('div', 'meta', date(v.p))); b.appendChild(el('div', 'hl', clean(v.t, f.name))); c.appendChild(b);
        c.onclick = function () { play(v, sec); };
        strip.appendChild(c);
      });
      sec.appendChild(strip);
      box.appendChild(sec);
    });
  }

  fetch(BASE + 'spotlight.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    .then(function (j) {
      var got = j && j.features && j.features.length ? j.features : [];
      var byKey = {}; got.forEach(function (f) { byKey[f.key] = f; });
      render(FALLBACK.map(function (f) { return byKey[f.key] || f; }));
    });
})();
</script>
</body>
</html>
