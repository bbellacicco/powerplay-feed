<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">

<title>Pro Scoreboard | Powerplay Windsor</title>
<script src="arrows.js"></script>
<!--
  Pro sports widget. Scores (default): one line of current scores (live games, and finals from yesterday and today),
  each linked to the game's coverage (recap / gamecast). ?view=upcoming: Coming Up, the next games by day.
  NFL, NHL, NBA and MLB load live from ESPN each time the page opens, so scores are
  always current. CFL comes from data/local-games.json ("pro_games"), which the
  daily GitHub Action fills from cfl.ca (ESPN's CFL data is out of date).

  Embed in Wix (Embed Code > Embed a site):
    https://bbellacicco.github.io/powerplay-feed/pro-games.html
  Optional: ?tab=nfl | nhl | pwhl | nba | mlb | cfl  start on a league instead of All
-->
<style>
  :root {
    --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e;
    --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021;
    --win: #2fbf71; --loss: #e5484d; --tie: #9fb0cf;
    --nfl: #1d4ed8; --nhl: #94a3b8; --nba: #ea580c; --mlb: #0891b2; --cfl: #dc2626; --pwhl: #7c3aed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 17px; -webkit-text-stroke: .7px currentColor; paint-order: stroke fill; line-height: 1.1; margin: 0; letter-spacing: .03em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .sponsor { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .sponsor { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sponsor .slogo { height: 36px; width: auto; max-width: 110px; object-fit: contain; border-radius: 3px; }
  .sponsor b { color: var(--text); font-weight: 600; }
  .updated { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  .pill { border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  select.pill { padding-right: 8px; }
  .day { margin-top: 14px; }
  .day.today h2 { color: #fff; }
  .day.today h2::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 7px; vertical-align: middle; }
  .day h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 6px; }
  .game { display: grid; grid-template-columns: 4px 64px 1fr auto; gap: 10px; align-items: center;
    background: var(--row); border-radius: 8px; padding: 8px 10px 8px 0; margin-bottom: 5px; overflow: hidden; }
  .stripe { align-self: stretch; }
  .l-nfl .stripe { background: var(--nfl); } .l-mlb .stripe { background: var(--mlb); } .l-nhl .stripe { background: var(--nhl); }
  .l-nba .stripe { background: var(--nba); } .l-cfl .stripe { background: var(--cfl); } .l-pwhl .stripe { background: var(--pwhl); }
  .next { margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--accent); }
  .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .main { min-width: 0; }
  .who { font-weight: 600; }
  .who .vs { color: var(--muted); font-weight: 400; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec { color: var(--muted); font-weight: 500; font-size: 12px; }
  .series { color: var(--accent); font-size: 12px; font-weight: 700; margin-top: 1px; }
  /* standings: one division at a time (keeps the page short enough to show in full) */
  .gpick { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .gpick button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 4px; font: inherit; font-size: 12px; font-weight: 700;
    padding: 6px 10px; cursor: pointer; }
  .gpick button[aria-pressed="true"] { background: #fff; color: #0b1a33; border-color: #fff; }

  /* each day's games: one sideways row of cards (swipe on phones, arrows on computers) */
  .dstrip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .dstrip .game { position: relative; flex: 0 0 236px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: stretch; gap: 4px;
    min-height: 118px; margin: 0; padding: 10px 12px 10px 16px; }
  .dstrip .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
  .dstrip .time { font-size: 12px; font-weight: 700; color: var(--accent); }
  .dstrip .who { white-space: normal; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .dstrip .score { text-align: left; margin-top: auto; }
  .day h2 .n { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  @media (max-width: 480px) { .dstrip .game { flex-basis: 78%; } }

  .score { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score b { font-size: 16px; }
  /* stacked games (Scores and Coming Up), like the Local Hub's Coming Up */
  .stack .game { grid-template-columns: 5px 78px 1fr auto; padding: 0 14px 0 0; margin-bottom: 6px; cursor: pointer; min-height: 54px; }
  .stack .game > .time, .stack .game > .main, .stack .game > .score { padding: 9px 0; }
  .stack .game:hover { background: #17336a; }
  .stack .time { font-size: 13px; font-weight: 700; color: var(--accent); }
  .stack .time.live { color: var(--loss); text-transform: uppercase; }
  .stack .time.fin { color: var(--muted); }
  .stack .score { text-align: right; }
  .stack .score .cov { margin-top: 3px; }
  /* stats: league leaders, one card per category */
  .sgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .scard2 { background: var(--row); border-radius: 8px; padding: 10px 12px; }
  .scard2 h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .lrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .lrow:first-of-type { border-top: 0; }
  .lrow:hover .nm { text-decoration: underline; }
  .lrow .rk { width: 14px; color: var(--muted); font-size: 12px; }
  .lrow img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--panel); flex: none; }
  .lrow .nm { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .nm small { color: var(--muted); font-weight: 600; }
  .lrow b { font-variant-numeric: tabular-nums; }
  .lrow.ours .nm { color: var(--accent); }
  @media (max-width: 900px) { .sgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .sgrid { grid-template-columns: minmax(0, 1fr); } }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }
  @media (max-width: 480px) { .stack .game { grid-template-columns: 4px 58px 1fr auto; gap: 8px; padding-right: 10px; } .stack .score .cov { font-size: 11px; } }
  .score .cov { display: block; margin-top: 6px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .02em; }
  .dstrip .game:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  .badge { display: inline-block; min-width: 26px; text-align: center; font-size: 11px; font-weight: 700;
    padding: 2px 5px; border-radius: 4px; margin-left: 6px; color: #fff; background: var(--tie); }
  .badge.W { background: var(--win); } .badge.L, .badge.OTL { background: var(--loss); }
  .badge.off { background: #6b7280; } .badge.live { background: var(--loss); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .views { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .views button { border: 0; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 6px 14px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--accent); color: #111; font-weight: 600; }
  .stand { margin-top: 12px; }
  .stand h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 6px; }
  .stand table { width: 100%; border-collapse: collapse; background: var(--row); border-radius: 8px; overflow: hidden; font-variant-numeric: tabular-nums; }
  .stand th, .stand td { padding: 6px 8px; text-align: right; white-space: nowrap; }
  .stand th { font-size: 11px; color: var(--muted); font-weight: 600; background: var(--panel); }
  .stand th:first-child, .stand td:first-child { text-align: left; width: 100%; }
  .stand td:first-child { white-space: normal; }
  .stand tr + tr td { border-top: 1px solid var(--line); }
  .stand td .rk { color: var(--muted); display: inline-block; width: 18px; }
  .stand td img { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 6px; }
  .stand tr.ours td { background: rgba(232, 176, 33, .12); }
  .stand tr.ours td:first-child { color: var(--accent); font-weight: 700; }
  .stand .flag { color: var(--muted); font-size: 11px; margin-left: 4px; }
  @media (max-width: 480px) { .stand .wide { display: none; } .right { align-items: flex-start; } }
  footer { margin-top: 14px; color: var(--muted); font-size: 11px; text-align: center; }
  @media (max-width: 480px) {
    .game { grid-template-columns: 4px 52px 1fr auto; gap: 8px; }
    .time { font-size: 12px; }
  }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .brand .btext { min-width: 0; }
  .blogo { height: 38px; width: auto; max-width: 76px; object-fit: contain; flex: none; border-radius: 4px; }

  /* filter tabs: square tiles (set apart from the Games/Standings switch above) */
  #tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 6px; margin: 2px 0 10px; align-items: stretch; }
  #tabs .pill { position: relative; border: 1px solid var(--line); background: #0e2044; color: var(--muted); border-radius: 4px; padding: 9px 6px 8px;
    font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tabs .pill::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tc, var(--accent)); opacity: .55; }
  #tabs .pill:hover { color: var(--text); border-color: var(--tc, var(--accent)); }
  #tabs .pill[aria-pressed="true"] { background: #fff; color: #0b1a33; border-color: #fff; font-weight: 800; }
  #tabs .pill[aria-pressed="true"]::before { opacity: 1; height: 4px; }
  select.pill { border-radius: 4px; }
  @media (max-width: 560px) { #tabs { grid-template-columns: repeat(4, 1fr); gap: 5px; } #tabs .pill { font-size: 10px; letter-spacing: .02em; padding: 8px 2px 7px; white-space: normal; line-height: 1.15; } }

  /* ---- Home-page look: wide margins, plain bold titles, roomy spacing ---- */
  .wrap { max-width: 1240px; padding: 26px 40px 30px; }
  h1 { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-weight: 800; font-size: 24px; -webkit-text-stroke: 0; letter-spacing: .005em; text-transform: none; }
  h1 span { color: inherit; }
  header { margin-bottom: 18px; }
  .brand { gap: 12px; }
  .blogo { height: 34px; }
  .sponsor { margin-top: 3px; }
  footer { margin-top: 26px; opacity: .8; }
  @media (max-width: 700px) { .wrap { padding: 20px 16px 24px; } h1 { font-size: 21px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><img class="blogo" src="logos/unifor-2458.png" alt="" onerror="this.remove()"><div class="btext"><h1>Pro <span>Scoreboard</span></h1>
      <div class="sponsor"><span>Presented by <b>Unifor Local 2458</b></span></div></div></div>
    </div>
    <div class="right">
      <div class="views" role="group" aria-label="View"><button id="v-games">Scores</button><button id="v-standings">Standings</button><button id="v-stats">Stats</button></div>
      <div class="updated" id="updated"></div>
    </div>
  </header>
  <div class="bar" id="tabs" role="group" aria-label="League"></div>
  <div class="bar">
    <select class="pill" id="team" aria-label="Team"></select>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
  <footer>Powerplay Windsor · Scores and standings from ESPN (NFL, NHL, NBA, MLB), cfl.ca and thepwhl.com</footer>
</div>
<script>
(function () {
  var TZ = 'America/Toronto';
  var DAYS_BACK = 1, DAYS_AHEAD = 3;   // yesterday (current scores) through three days from now (Coming Up)
  var LEAGUES = {
    nfl: { label: 'NFL', path: 'football/nfl' },
    nhl: { label: 'NHL', path: 'hockey/nhl' },
    nba: { label: 'NBA', path: 'basketball/nba' },
    mlb: { label: 'MLB', path: 'baseball/mlb' },
    cfl: { label: 'CFL' },
    pwhl: { label: 'PWHL' }     // women's pro hockey: games and standings come from the collector (not on ESPN)
  };
  // "Our Teams": league + ESPN abbreviation
  var OUR_TEAMS = [
    { league: 'nhl', abbr: 'DET', name: 'Detroit Red Wings' },
    { league: 'nba', abbr: 'DET', name: 'Detroit Pistons' },
    { league: 'nfl', abbr: 'DET', name: 'Detroit Lions' },
    { league: 'nhl', abbr: 'TOR', name: 'Toronto Maple Leafs' },
    { league: 'nhl', abbr: 'MTL', name: 'Montreal Canadiens' },
    { league: 'nba', abbr: 'TOR', name: 'Toronto Raptors' },
    { league: 'nfl', abbr: 'BUF', name: 'Buffalo Bills' },
    { league: 'mlb', abbr: 'DET', name: 'Detroit Tigers' },
    { league: 'mlb', abbr: 'TOR', name: 'Toronto Blue Jays' }
  ];
  var TABS = [['all', 'All'], ['nfl', 'NFL'], ['nhl', 'NHL'], ['pwhl', 'PWHL'], ['nba', 'NBA'], ['mlb', 'MLB'], ['cfl', 'CFL']];

  var qs = new URLSearchParams(location.search);
  var UPCOMING = qs.get('view') === 'upcoming';     // the Pro Hub's Coming Up tab
  var view = qs.get('view') === 'standings' ? 'standings' : qs.get('view') === 'stats' ? 'stats' : 'games';
  var state = { tab: LEAGUES[qs.get('tab')] ? qs.get('tab') : 'all', team: 'all' };   // opens on All (no Our Teams tab)
  var games = [];

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmt(d, o) { return new Intl.DateTimeFormat('en-CA', Object.assign({ timeZone: TZ }, o)).format(d); }
  function dayKey(d) { return fmt(d, { year: 'numeric', month: '2-digit', day: '2-digit' }); }
  function ymd(d) { return dayKey(d).replace(/-/g, ''); }

  var now = new Date();
  var todayKey = dayKey(now);
  var dates = [];
  for (var i = -DAYS_BACK; i <= DAYS_AHEAD; i++) dates.push(new Date(now.getTime() + i * 864e5));
  var loKey = dayKey(dates[0]), hiKey = dayKey(dates[dates.length - 1]);

  function isOurs(g) {
    return OUR_TEAMS.some(function (t) { return t.league === g.league && (g.home.abbr === t.abbr || g.away.abbr === t.abbr); });
  }
  function ourTeam(g) {
    return OUR_TEAMS.filter(function (t) { return t.league === g.league && (g.home.abbr === t.abbr || g.away.abbr === t.abbr); })[0];
  }

  // ---- ESPN (NFL / NHL / NBA / MLB), one request per league per day

  // playoff series: "MIL leads series 2-0" -> "Brewers lead series 2-0"; "ALCS - Game 3" -> "ALCS · Game 3"
  function seriesInfo(c) {
    var s = c.series, note = (c.notes || []).map(function (n) { return n.headline || ''; }).filter(Boolean)[0] || '';
    var round = note.replace(/\s+-\s+/g, ' · ');
    if (!s || s.type !== 'playoff' || !s.summary) return { round: round, series: '' };
    var txt = s.summary;
    (c.competitors || []).forEach(function (x) {
      var ab = x.team && x.team.abbreviation, nm = x.team && (x.team.shortDisplayName || x.team.name);
      if (ab && nm) txt = txt.replace(new RegExp('^' + ab + ' (lead|win)s ', ''), nm + ' $1 ');
    });
    return { round: round, series: txt };
  }

  function espnDay(key, d) {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/' + LEAGUES[key].path + '/scoreboard?dates=' + ymd(d);
    return fetch(url).then(function (r) { return r.ok ? r.json() : { events: [] }; }).then(function (j) {
      return (j.events || []).map(function (e) { return parseEvent(key, e); });
    }).catch(function () { return []; });
  }
  // the game's coverage on ESPN: the recap after a final, the gamecast while it's on, the preview before
  function coverage(e, status) {
    var ls = e.links || [];
    function by(rel) { var x = ls.filter(function (l) { return (l.rel || []).indexOf(rel) >= 0; })[0]; return x && x.href; }
    return (status === 'final' ? by('recap') || by('boxscore') : status === 'live' ? by('summary') || by('live') : by('preview') || by('summary')) || (ls[0] && ls[0].href) || '';
  }
  // one ESPN event (scoreboard or team schedule) -> a game
  function parseEvent(key, e) {
        e.status = e.status || (e.competitions[0] && e.competitions[0].status) || { type: {} };
        var c = e.competitions[0], st = e.status.type;
        var side = function (h) {
          var x = c.competitors.filter(function (t) { return t.homeAway === h; })[0];
          return { abbr: x.team.abbreviation, name: x.team.displayName, short: x.team.shortDisplayName || x.team.name,
                   score: x.score == null || x.score === '' ? null : typeof x.score === 'object' ? (x.score.value != null ? Number(x.score.value) : null) : Number(x.score), winner: x.winner,
                   rec: ((x.records || []).filter(function (r) { return r.type === 'total' || r.type === 'ytd'; })[0] || {}).summary || '' };
        };
        var status = st.state === 'post' ? (st.name === 'STATUS_POSTPONED' ? 'postponed' : st.name === 'STATUS_CANCELED' ? 'cancelled' : 'final')
                   : st.state === 'in' ? 'live' : (st.name === 'STATUS_POSTPONED' ? 'postponed' : 'upcoming');
        var season = e.season && e.season.type;
        return {
          league: key, start: e.date, status: status, detail: st.shortDetail || '',
          home: side('home'), away: side('away'),
          venue: c.venue ? c.venue.fullName : '',
          note: season === 1 ? 'Preseason' : season === 3 ? (seriesInfo(c).round || 'Playoffs') : '',
          series: season === 3 ? seriesInfo(c).series : '',
          tbd: e.timeValid === false,
          link: coverage(e, status)
        };
  }
  // a team's last result and next game, when it has nothing in the two-days-back-to-tomorrow window
  var schedCache = {};
  function teamSchedule(t) {
    var k = t.league + ':' + t.abbr;
    if (!schedCache[k]) schedCache[k] = fetch('https://site.api.espn.com/apis/site/v2/sports/' + LEAGUES[t.league].path + '/teams/' + t.abbr.toLowerCase() + '/schedule')
      .then(function (r) { return r.ok ? r.json() : { events: [] }; })
      .then(function (j) {
        var all = (j.events || []).map(function (e) { try { return parseEvent(t.league, e); } catch (er) { return null; } }).filter(Boolean)
          .sort(function (a, b) { return new Date(a.start) - new Date(b.start); });
        var past = all.filter(function (g) { return g.status === 'final'; }), next = all.filter(function (g) { return g.status === 'upcoming' || g.status === 'live'; });
        return past.slice(-1).concat(next.slice(0, 1));
      }).catch(function () { return []; });
    return schedCache[k];
  }

  // ---- CFL from the daily collector
  function cflGames() {
    return fetch('https://bbellacicco.github.io/powerplay-feed/data/local-games.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) {
        return (j.pro_games || []).map(function (g) {
          return {
            league: g.league || 'cfl', start: g.start, status: g.status, detail: '',
            home: { abbr: g.home_abbr, name: g.home, short: g.home.split(' ').slice(-1)[0], score: g.opp_score },
            away: { abbr: g.away_abbr, name: g.away, short: g.away.split(' ').slice(-1)[0], score: g.our_score },
            venue: g.location, note: g.note, tbd: g.time_tbd, link: g.link || 'https://www.cfl.ca/schedule/'
          };
        });
      }).catch(function () { return []; });
  }

  function load() {
    now = new Date();
    todayKey = dayKey(now);
    var jobs = [cflGames()];
    ['nfl', 'nhl', 'nba', 'mlb'].forEach(function (k) { dates.forEach(function (d) { jobs.push(espnDay(k, d)); }); });
    Promise.all(jobs).then(function (res) {
      var seen = {};
      games = [].concat.apply([], res).filter(function (g) {
        var k = g.league + g.start + g.home.abbr + g.away.abbr;
        if (seen[k]) return false; seen[k] = 1;
        var d = dayKey(new Date(g.start));
        return d >= loKey && d <= hiKey;
      }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
      render();
      schedule();
    });
  }

  function tabs() {
    var box = document.getElementById('tabs'); box.innerHTML = '';
    TABS.forEach(function (t) {
      if (view === 'standings' && (t[0] === 'ours' || t[0] === 'all' || NO_STANDINGS.indexOf(t[0]) >= 0)) return;   // standings are one league at a time
      if (view === 'stats' && t[0] === 'all') return;                                                                  // stats too
      var b = el('button', 'pill', t[1]);
      b.setAttribute('aria-pressed', String(state.tab === t[0]));
      b.onclick = function () { state.tab = t[0]; state.team = 'all'; render(); };
      box.appendChild(b);
    });
  }

  function teamSelect(list) {
    var sel = document.getElementById('team');
    var names = {};
    if (state.tab === 'ours') OUR_TEAMS.forEach(function (t) { names[t.name] = 1; });
    else if (state.tab !== 'all') {   // All: every league, too many teams for a list
      list.forEach(function (g) { names[g.home.name] = 1; names[g.away.name] = 1; });
      OUR_TEAMS.forEach(function (t) { if (t.league === state.tab) names[t.name] = 1; });   // our teams are always on the list
    }
    var keys = Object.keys(names).sort();
    sel.innerHTML = '';
    sel.appendChild(new Option('All teams', 'all'));
    keys.forEach(function (n) { sel.appendChild(new Option(n, n)); });
    if (keys.indexOf(state.team) < 0) state.team = 'all';
    sel.value = state.team;
    sel.style.display = keys.length > 1 ? '' : 'none';
    sel.onchange = function () { state.team = sel.value; render(); };
  }

  function views() {
    [['games', 'v-games'], ['standings', 'v-standings'], ['stats', 'v-stats']].forEach(function (v) {
      var b = document.getElementById(v[1]);
      b.setAttribute('aria-pressed', String(view === v[0]));
      b.onclick = function () { if (view !== v[0]) { view = v[0]; render(); } };
    });
  }

  // ---- Standings: ESPN for NHL / NBA / NFL / MLB, the league's own stats site for CFL (via the collector)
  var standCache = {};
  var NO_STANDINGS = ['mlb'];   // regular season over (playoff games still show under Games); remove 'mlb' next spring
  var COLS = {
    nhl: [['GP', 'GP'], ['W', 'W'], ['L', 'L'], ['OTL', 'OTL'], ['PTS', 'PTS'], ['DIFF', 'DIFF', 1], ['STRK', 'STRK', 1]],
    nba: [['W', 'W'], ['L', 'L'], ['PCT', 'PCT'], ['GB', 'GB'], ['STRK', 'STRK', 1]],
    nfl: [['W', 'W'], ['L', 'L'], ['T', 'T'], ['PCT', 'PCT'], ['DIFF', 'DIFF', 1], ['STRK', 'STRK', 1]],
    mlb: [['W', 'W'], ['L', 'L'], ['PCT', 'PCT'], ['GB', 'GB'], ['STRK', 'STRK', 1]],
    cfl: [['GP', 'gp'], ['W', 'w'], ['L', 'l'], ['PTS', 'pts'], ['PF', 'pf', 1], ['PA', 'pa', 1]],
    pwhl: [['GP', 'gp'], ['W', 'w'], ['L', 'l'], ['OTL', 'otl'], ['PTS', 'pts'], ['GF', 'gf', 1], ['GA', 'ga', 1], ['STRK', 'strk', 1]]
  };
  function espnStandings(k) {
    return fetch('https://site.api.espn.com/apis/v2/sports/' + LEAGUES[k].path + '/standings?level=3')
      .then(function (r) { return r.json(); }).then(function (j) {
        var groups = [];
        (function walk(n, parent) {
          if (n.standings && n.standings.entries && n.standings.entries.length) {
            groups.push({ group: n.name, teams: n.standings.entries.map(function (e) {
              var st = {}; e.stats.forEach(function (x) { if (!(x.abbreviation in st)) st[x.abbreviation] = x; });
              var v = function (a) { return st[a] ? st[a].displayValue : ''; };
              var num = function (a) { return st[a] ? Number(st[a].value) : 0; };
              var row = { abbr: e.team.abbreviation, name: e.team.displayName, logo: (e.team.logos && e.team.logos[0] && e.team.logos[0].href) || '' };
              COLS[k].forEach(function (c) { row[c[1]] = v(c[0]); });
              row._sort = k === 'nhl' ? num('PTS') * 1000 - num('GP') : num('PCT') * 1000 + num('W');
              return row;
            }).sort(function (a, b) { return b._sort - a._sort; }) });
          }
          (n.children || []).forEach(function (c) { walk(c, n); });
        })(j);
        return groups;
      });
  }
  function collectorStandings(k) {     // CFL and PWHL, gathered by the collector every 15 minutes
    return fetch('https://bbellacicco.github.io/powerplay-feed/data/local-games.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) { return k === 'cfl' ? (j.cfl_standings || []) : ((j.standings || {})[k] || []); });
  }

  // standings with several divisions: show one at a time, starting with the one our team is in
  var GROUP = {};
  function pickGroup(key, groups, isOurs, box, redraw) {
    if (!groups || groups.length < 2) return groups;
    if (GROUP[key] == null || GROUP[key] >= groups.length) {
      var i = -1;
      groups.some(function (g, n) { if (g.teams.some(isOurs)) { i = n; return true; } return false; });
      GROUP[key] = i < 0 ? 0 : i;
    }
    var bar = document.createElement('div'); bar.className = 'gpick';
    groups.forEach(function (g, n) {
      var b = document.createElement('button'); b.type = 'button';
      b.textContent = String(g.group || ('Group ' + (n + 1))).replace(/^.*\u00b7\s*/, '');
      b.setAttribute('aria-pressed', String(n === GROUP[key]));
      b.onclick = function () { GROUP[key] = n; redraw(); };
      bar.appendChild(b);
    });
    box.appendChild(bar);
    return [groups[GROUP[key]]];
  }
  // ---- Stats: the league leaders (ESPN) for NHL, NBA and NFL; CFL, PWHL and MLB link to the league's own stats
  var STAT_CATS = {
    nhl: [['points', 'Points'], ['goals', 'Goals'], ['assists', 'Assists'], ['wins', 'Goalie wins'], ['avgGoalsAgainst', 'Goals-against average'], ['savePct', 'Save percentage']],
    nba: [['pointsPerGame', 'Points per game'], ['reboundsPerGame', 'Rebounds per game'], ['assistsPerGame', 'Assists per game'], ['stealsPerGame', 'Steals per game'], ['blocksPerGame', 'Blocks per game'], ['3PointsMadePerGame', 'Threes per game']],
    nfl: [['passingYards', 'Passing yards'], ['passingTouchdowns', 'Passing touchdowns'], ['rushingYards', 'Rushing yards'], ['receivingYards', 'Receiving yards'], ['sacks', 'Sacks'], ['interceptions', 'Interceptions']]
  };
  var STAT_LINKS = { cfl: ['CFL', 'https://www.cfl.ca/stats/'], pwhl: ['PWHL', 'https://www.thepwhl.com/en/stats'], mlb: ['MLB', 'https://www.mlb.com/stats/'] };
  var statCache = {};
  function renderStats() {
    if (!LEAGUES[state.tab]) state.tab = 'nhl';
    tabs();
    document.getElementById('team').style.display = 'none';
    var k = state.tab, box = document.getElementById('list');
    document.getElementById('updated').textContent = '';
    box.innerHTML = '';
    if (!STAT_CATS[k]) {
      var ln = STAT_LINKS[k], m = el('div', 'empty');
      m.appendChild(document.createTextNode((k === 'mlb' ? 'The MLB season is over. ' : '') + 'Full ' + ln[0] + ' stats: '));
      var a = el('a', null, ln[1].replace(/^https:\/\/(www\.)?/, '').replace(/\/$/, '')); a.href = ln[1]; a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'var(--accent)'; m.appendChild(a);
      box.appendChild(m); return;
    }
    box.appendChild(el('div', 'empty', 'Loading stats\u2026'));
    if (!statCache[k]) statCache[k] = fetch('https://site.api.espn.com/apis/site/v3/sports/' + LEAGUES[k].path + '/leaders').then(function (r) { return r.json(); }).catch(function () { statCache[k] = null; return null; });
    statCache[k].then(function (j) {
      if (view !== 'stats' || state.tab !== k) return;
      box.innerHTML = '';
      var cats = (j && j.leaders && j.leaders.categories) || [], by = {};
      cats.forEach(function (c) { by[c.name] = c; });
      var season = j && j.requestedSeason && j.requestedSeason.displayName;
      document.getElementById('updated').textContent = season ? season + ' season' : '';
      var ours = OUR_TEAMS.filter(function (t) { return t.league === k; }).map(function (t) { return t.abbr; });
      var grid = el('div', 'sgrid');
      STAT_CATS[k].forEach(function (sc) {
        var c = by[sc[0]]; if (!c || !(c.leaders || []).length) return;
        var card = el('section', 'scard2'); card.appendChild(el('h3', null, sc[1]));
        c.leaders.slice(0, 5).forEach(function (l, i) {
          var ab = (l.team && l.team.abbreviation) || '', a2 = el('a', 'lrow' + (ours.indexOf(ab) >= 0 ? ' ours' : ''));
          var link = ((l.athlete && l.athlete.links) || []).filter(function (x) { return (x.rel || []).indexOf('playercard') >= 0; })[0];
          if (link) { a2.href = link.href; a2.target = '_blank'; a2.rel = 'noopener'; }
          a2.appendChild(el('span', 'rk', String(i + 1)));
          if (l.athlete && l.athlete.headshot && l.athlete.headshot.href) { var im = el('img'); im.src = l.athlete.headshot.href; im.alt = ''; im.loading = 'lazy'; im.onerror = function () { im.remove(); }; a2.appendChild(im); }
          var nm = el('span', 'nm', (l.athlete && l.athlete.displayName) || ''); nm.appendChild(el('small', null, ' ' + ab)); a2.appendChild(nm);
          a2.appendChild(el('b', null, l.displayValue));
          card.appendChild(a2);
        });
        grid.appendChild(card);
      });
      if (!grid.children.length) { box.appendChild(el('div', 'empty', 'Stats unavailable right now.')); return; }
      box.appendChild(grid);
      box.appendChild(el('div', 'hint', 'League leaders from ESPN. Tap a player for their full stats.'));
    });
  }

  function renderStandings() {
    if (!LEAGUES[state.tab] || NO_STANDINGS.indexOf(state.tab) >= 0) state.tab = 'nhl';
    tabs();
    document.getElementById('team').style.display = 'none';
    document.getElementById('updated').textContent = '';
    var k = state.tab, box = document.getElementById('list');
    if (!standCache[k]) {
      box.innerHTML = '<div class="empty">Loading standings…</div>';
      standCache[k] = (k === 'cfl' || k === 'pwhl' ? collectorStandings(k) : espnStandings(k)).catch(function () { standCache[k] = null; return null; });
    }
    standCache[k].then(function (groups) {
      if (view !== 'standings' || state.tab !== k) return;
      box.innerHTML = '';
      if (!groups || !groups.length) { box.appendChild(el('div', 'empty', 'Standings unavailable right now.')); return; }
      var ours = OUR_TEAMS.filter(function (t) { return t.league === k; }).map(function (t) { return t.abbr; });
      groups = pickGroup(k, groups, function (t) { return ours.indexOf(t.abbr) >= 0; }, box, renderStandings);
      groups.forEach(function (g) {
        var sec = el('section', 'stand');
        sec.appendChild(el('h2', null, g.group));
        var tbl = el('table'), head = el('tr');
        head.appendChild(el('th', null, 'Team'));
        COLS[k].forEach(function (c) { head.appendChild(el('th', c[2] ? 'wide' : null, c[0])); });
        tbl.appendChild(head);
        g.teams.forEach(function (t, i) {
          var tr = el('tr', ours.indexOf(t.abbr) >= 0 ? 'ours' : null), td = el('td');
          td.appendChild(el('span', 'rk', String(i + 1)));
          if (t.logo) { var img = el('img'); img.src = t.logo; img.alt = ''; img.onerror = function () { img.remove(); }; td.appendChild(img); }
          td.appendChild(document.createTextNode(t.name));
          if (t.flags) td.appendChild(el('span', 'flag', t.flags));
          tr.appendChild(td);
          COLS[k].forEach(function (c) { tr.appendChild(el('td', c[2] ? 'wide' : null, t[c[1]] == null ? '' : String(t[c[1]]))); });
          tbl.appendChild(tr);
        });
        sec.appendChild(tbl);
        box.appendChild(sec);
      });
      if (k === 'cfl') box.appendChild(el('div', 'empty', 'x – clinched playoff spot · y – clinched division'));
      if (k === 'pwhl') box.appendChild(el('div', 'empty', 'PWHL: 3 points for a regulation win, 2 for an overtime or shootout win, 1 for an overtime or shootout loss (OTL).'));
    });
  }

  function render() {
    views();
    if (view === 'standings') return renderStandings();
    if (view === 'stats') return renderStats();
    document.getElementById('updated').textContent = UPCOMING
      ? fmt(new Date(), { month: 'short', day: 'numeric' }) + ' – ' + fmt(dates[dates.length - 1], { month: 'short', day: 'numeric' })
      : 'Updated ' + fmt(new Date(), { hour: 'numeric', minute: '2-digit' });
    tabs();
    var list = games.filter(function (g) { return state.tab === 'ours' ? isOurs(g) : state.tab === 'all' ? true : g.league === state.tab; });
    teamSelect(list);
    if (state.team !== 'all') list = list.filter(function (g) {
      if (state.tab === 'ours') { var t = ourTeam(g); return t && t.name === state.team; }
      return g.home.name === state.team || g.away.name === state.team;
    });

    var box = document.getElementById('list'); box.innerHTML = '';
    if (!list.length && state.team !== 'all') {
      var our = OUR_TEAMS.filter(function (t) { return t.name === state.team && (state.tab === 'ours' || t.league === state.tab); })[0];
      if (our && LEAGUES[our.league] && LEAGUES[our.league].path) {
        box.appendChild(el('div', 'empty', 'Loading ' + our.name + '\u2019s last and next games\u2026'));
        var want = state.team;
        teamSchedule(our).then(function (gs) {
          if (state.team !== want || view !== 'games') return;
          box.innerHTML = '';
          if (!gs.length) { box.appendChild(el('div', 'empty', 'No ' + our.name + ' games scheduled right now.')); return; }
          var sec = el('section', 'day'), h2 = el('h2', null, our.name);
          h2.appendChild(el('span', 'n', ' \u00b7 last result and next game'));
          sec.appendChild(h2);
          var strip = el('div', 'dstrip'); gs.forEach(function (g) { strip.appendChild(row(g)); }); sec.appendChild(strip);
          box.appendChild(sec);
        });
        return;
      }
    }
    // Scores: today's games (live, finals and later today) with yesterday's finals under them.
    // Coming Up: tomorrow on. Both stacked, one game per line, grouped by day; tap a game for its coverage.
    var yKey = dayKey(new Date(now.getTime() - 864e5));
    // the All tab (every league) sticks to today's games; the other tabs add yesterday's finals
    if (!UPCOMING) list = list.filter(function (g) { var k = dayKey(new Date(g.start)); return k === todayKey || (state.tab !== 'all' && k === yKey && g.status !== 'upcoming'); });
    else list = list.filter(function (g) { return dayKey(new Date(g.start)) > todayKey && g.status !== 'final'; });
    if (!list.length) { box.appendChild(el('div', 'empty', UPCOMING ? 'No games in the next few days.' : 'No games today. See Coming Up for the next games.')); return; }
    var groups = [], byKey = {};
    list.forEach(function (g) {
      var k = dayKey(new Date(g.start));
      if (!byKey[k]) { byKey[k] = { k: k, d: new Date(g.start), games: [] }; groups.push(byKey[k]); }
      byKey[k].games.push(g);
    });
    groups.sort(function (a, b) { return UPCOMING || (a.k !== todayKey && b.k !== todayKey) ? (a.k < b.k ? -1 : 1) : (a.k === todayKey ? -1 : 1); });
    groups.forEach(function (grp) {
      // live games first, then the rest by start time
      grp.games.sort(function (a, b) { return (a.status === 'live' ? 0 : 1) - (b.status === 'live' ? 0 : 1) || (a.start < b.start ? -1 : a.start > b.start ? 1 : 0); });
      var sec = el('section', 'day' + (grp.k === todayKey ? ' today' : ''));
      var h2 = el('h2', null, (grp.k === todayKey ? 'Today · ' : grp.k === yKey ? 'Yesterday · ' : '') + fmt(grp.d, { weekday: 'long', month: 'short', day: 'numeric' }));
      h2.appendChild(el('span', 'n', ' · ' + grp.games.length + (grp.games.length === 1 ? ' game' : ' games')));
      sec.appendChild(h2);
      var stack = el('div', 'stack');
      grp.games.forEach(function (g) { stack.appendChild(row(g, true)); });
      sec.appendChild(stack);
      box.appendChild(sec);
    });
    if (!UPCOMING) box.appendChild(el('div', 'hint', 'Tap a game for the recap, the live gamecast or a preview.'));
  }

  // games not on today's date carry their date, so "4:25 PM" is never mistaken for today
  var WDAY = ['Sun.', 'Mon.', 'Tue.', 'Wed.', 'Thu.', 'Fri.', 'Sat.'];
  var CPMON = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  function cpDay(d) {
    var y = +fmt(d, { year: 'numeric' }), m = +fmt(d, { month: 'numeric' }), day = +fmt(d, { day: 'numeric' });
    var wd = new Date(Date.UTC(y, m - 1, day)).getUTCDay();
    return WDAY[wd] + ', ' + CPMON[m - 1] + ' ' + day;
  }
  function timeText(g, short) {
    var d = new Date(g.start), other = !short && dayKey(d) !== todayKey, date = other ? cpDay(d) + ' \u00b7 ' : '';
    if (g.status === 'final') return other ? 'Final \u00b7 ' + cpDay(d) : 'Final';
    if (g.status === 'live') return 'Live now';
    if (g.tbd) return date + 'TBA';
    return date + fmt(d, { hour: 'numeric', minute: '2-digit' })
      .replace(/\s?([ap])\.?m\.?/i, function (_, x) { return ' ' + x.toUpperCase() + 'M'; });
  }

  function row(g, short) {
    var r = el('div', 'game l-' + g.league);
    r.appendChild(el('div', 'stripe'));
    r.appendChild(el('div', 'time' + (g.status === 'live' ? ' live' : g.status === 'final' ? ' fin' : ''), timeText(g, short)));
    var main = el('div', 'main'), who = el('div', 'who');
    // each team's record on games that haven't started yet: "Brewers (97-65)"
    function rec(t) { if (g.status === 'upcoming' && t.rec) who.appendChild(el('span', 'rec', ' (' + t.rec + ')')); }
    var mine = state.tab === 'ours' ? ourTeam(g) : null;
    var us = null, them = null;
    if (mine) {                        // from our team's side: "Lions vs Jets"
      var home = g.home.abbr === mine.abbr;
      us = home ? g.home : g.away; them = home ? g.away : g.home;
      who.appendChild(document.createTextNode(us.short)); rec(us);
      who.appendChild(el('span', 'vs', home ? ' vs ' : ' @ '));
      who.appendChild(document.createTextNode(them.name)); rec(them);
    } else {                           // neutral: "Chargers @ Bills"
      who.appendChild(document.createTextNode(g.away.name)); rec(g.away);
      who.appendChild(el('span', 'vs', ' @ '));
      who.appendChild(document.createTextNode(g.home.name)); rec(g.home);
    }
    main.appendChild(who);
    var bits = [LEAGUES[g.league].label];
    if (g.venue) bits.push(g.venue);
    if (g.note) bits.push(g.note);
    main.appendChild(el('div', 'meta', bits.join(' · ')));
    if (g.series) main.appendChild(el('div', 'series', g.series));
    // after one of our teams' games: when they play next
    var ot = g.status === 'final' ? ourTeam(g) : null;
    if (ot && LEAGUES[ot.league] && LEAGUES[ot.league].path) {
      var nx = el('div', 'next'); main.appendChild(nx);
      teamSchedule(ot).then(function (gs) {
        var n = gs.filter(function (x) { return (x.status === 'upcoming' || x.status === 'live') && new Date(x.start) > new Date(g.start); })[0];
        if (!n) return;
        var home = n.home.abbr === ot.abbr, opp = home ? n.away : n.home;
        var name = OUR_TEAMS.length && (g.home.abbr === ot.abbr ? g.home : g.away).short;
        nx.textContent = 'Next: ' + (name ? name + ' ' : '') + (home ? 'vs. ' : 'at ') + (opp.short || opp.name) + ' \u00b7 ' +
          (n.status === 'live' ? 'live now' : cpDay(new Date(n.start)) + (n.tbd ? '' : ' \u00b7 ' + fmt(new Date(n.start), { hour: 'numeric', minute: '2-digit' })
            .replace(/\s?([ap])\.?m\.?/i, function (_, x) { return ' ' + x.toUpperCase() + 'M'; })));
      });
    }
    r.appendChild(main);

    var sc = el('div', 'score');
    var hasScore = g.home.score != null && g.away.score != null;
    if ((g.status === 'final' || g.status === 'live') && hasScore) {
      var a = mine ? us.score : g.away.score, b = mine ? them.score : g.home.score;
      sc.appendChild(el('b', null, a + '–' + b));
      if (g.status === 'live') sc.appendChild(el('span', 'badge live', 'LIVE'));
      else if (mine) {
        var res = a > b ? 'W' : a < b ? ((/OT|SO/.test(g.detail) && g.league === 'nhl') ? 'OTL' : 'L') : 'T';
        sc.appendChild(el('span', 'badge ' + res, res));
      }
    } else if (g.status === 'postponed' || g.status === 'cancelled') {
      sc.appendChild(el('span', 'badge off', g.status === 'postponed' ? 'PPD' : 'CAN'));
    }
    if (g.status === 'live' && g.detail) { var m2 = main.lastChild; m2.textContent = g.detail + ' · ' + m2.textContent; }
    if (g.link) {
      r.style.cursor = 'pointer'; r.onclick = function () { window.open(g.link, '_blank', 'noopener'); };
      sc.appendChild(el('span', 'cov', g.status === 'live' ? 'Gamecast \u203a' : g.status === 'final' ? 'Recap \u203a' : 'Preview \u203a'));
    }
    r.appendChild(sc);
    return r;
  }

  // Refresh while the page is open: every 30 seconds when a game is live,
  // otherwise every 2 minutes.
  function schedule() {
    var live = games.some(function (g) { return g.status === 'live'; });
    setTimeout(function () { load(); }, live ? 30 * 1000 : 2 * 60 * 1000);
  }
  if (UPCOMING) {      // Coming Up: its own title, no Games/Standings switch
    document.querySelector('h1').innerHTML = 'Coming <span>Up</span>';
    document.querySelector('.views').style.display = 'none';
  }
  render();
  load();
})();
</script>
<script>
/* Inside the Local Sports page (sports.html): tell it how tall this widget is, so it never scrolls on its own
   (a widget that scrolls inside the page traps the finger on iPhones). */
(function () {
  if (window.parent === window || !/[?&]in=sports\b/.test(location.search)) return;
  var css = document.createElement('style'); css.textContent = 'html,body{overflow:hidden!important;height:auto!important}';
  document.head.appendChild(css);
  var last = 0;
  function send() {
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ pp: 'height', h: h }, '*'); } catch (e) {} }
  }
  window.addEventListener('load', send); window.addEventListener('resize', send);
  if (window.ResizeObserver) new ResizeObserver(send).observe(document.body);
  setInterval(send, 1500); send();
})();
</script>
