<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Graduate&display=swap" rel="stylesheet">
<title>Athlete Profiles | Powerplay Windsor</title>
<!--
  Athlete Profiles: a grid of Buddy's profile graphics (the top of each shows the athlete's name and team).
  Tap one and it fills the screen (full screen; on iPhone the full-screen viewer page profile.html), with arrows (or swipe) to the next. one swipeable row with every profile.
  The list is data/profiles.json, made by publish.bat from profiles.txt and the "profiles" folder.
  Embed in Wix full width: about 380px tall on desktop, 340px on mobile.
  ?title=<text>   heading (default "Athlete Profiles")
-->
<style>
  :root { --bg: #0b1a33; --panel: #10244a; --row: #132b57; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 14px 14px 20px; position: relative; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  h1 { font-family: 'Graduate', 'Rockwell', Georgia, serif; font-weight: 400; font-size: 22px; -webkit-text-stroke: .8px currentColor; paint-order: stroke fill;
    letter-spacing: .03em; text-transform: uppercase; margin: 0; line-height: 1.15; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .count { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
  .grid .card { flex: 0 0 200px; scroll-snap-align: start; }
  .swipe { color: var(--muted); font-size: 12px; text-align: center; padding: 2px 0; }
  .card { position: relative; border: 0; padding: 0; background: var(--row); border-radius: 8px; overflow: hidden; cursor: pointer; aspect-ratio: 3 / 4;
    border-top: 3px solid var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .card::after { content: "View profile"; position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; font-size: 12px; font-weight: 800; letter-spacing: .04em;
    color: #fff; background: linear-gradient(transparent, rgba(11,26,51,.92)); text-align: left; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .pager button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); background: var(--panel); border-radius: 8px; padding: 16px; }
  /* the full profile: over the grid, level with the card that was tapped */
  .view { position: absolute; left: 14px; right: 14px; z-index: 5; background: rgba(5,12,26,.97); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    display: none; padding: 10px; }
  .view.on { display: block; }
  .view .stage { position: relative; display: flex; align-items: center; justify-content: center; }
  .view.fs { position: fixed; inset: 0; left: 0; right: 0; top: 0 !important; border-radius: 0; padding: 0; background: #000; display: flex; flex-direction: column; box-shadow: none; }
  .view.fs .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 10px; margin: 0; background: linear-gradient(rgba(0,0,0,.7), transparent); }
  .view.fs .stage { flex: 1; height: 100%; }
  .view.fs #fullsize { display: none; }
  .view.fs img { max-width: 100vw; max-height: 100vh; border-radius: 0; }
  .view.fs .prev { left: 10px; } .view.fs .next { right: 10px; }
  .view img { display: block; max-width: 100%; max-height: 1000px; height: auto; border-radius: 6px; touch-action: pan-y; }
  .view .nav { position: absolute; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(11,26,51,.85); color: #fff; font-size: 22px; cursor: pointer; }
  .view .nav:hover { border-color: var(--accent); color: var(--accent); }
  .view .prev { left: 4px; } .view .next { right: 4px; }
  .view .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: var(--muted); font-size: 12.5px; }
  .view .bar button { background: var(--row); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; padding: 6px 12px; cursor: pointer; }
  .view .bar button:hover, .view .bar a:hover { border-color: var(--accent); color: var(--accent); }
  .view .bar .acts { display: flex; gap: 6px; }
  .view .bar a { background: var(--row); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 6px 12px; text-decoration: none; }
  @media (max-width: 560px) {
    .grid { gap: 8px; } .grid .card { flex-basis: 165px; } h1 { font-size: 19px; }
    .view { left: 6px; right: 6px; padding: 6px; } .view .nav { width: 40px; height: 40px; margin-top: -20px; font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div>
      <h1 id="title">Athlete <span>Profiles</span></h1>
      <div class="tag">Get to know the athletes of Windsor-Essex</div>
    </div>
    <div class="count" id="count"></div>
  </header>
  <div class="grid" id="grid"><div class="empty">Loading…</div></div>
  <div class="pager" id="pager"></div>
  <div class="view" id="view" role="dialog" aria-label="Athlete profile">
    <div class="bar"><span id="pos"></span><span class="acts"><a id="fullsize" target="_blank" rel="noopener" href="#">Open full size &#8599;</a><button type="button" id="close">&#10005; Close</button></span></div>
    <div class="stage">
      <img id="big" alt="Athlete profile">
      <button class="nav prev" type="button" id="prev" aria-label="Previous profile">&#8249;</button>
      <button class="nav next" type="button" id="next" aria-label="Next profile">&#8250;</button>
    </div>
  </div>
</div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/';
  var PER = 1000;   // one swipeable row with every profile (no pages)
  var qs = new URLSearchParams(location.search);
  if (qs.get('title')) document.getElementById('title').textContent = qs.get('title');
  var list = [], page = 0, cur = -1;

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function full(src) { return /^https?:/.test(src) ? src : REPO + src; }
  // Wix images can be resized on the fly: a small copy (top of the graphic) for the grid, a big one for viewing
  function wix(src, spec) { return /static\.wixstatic\.com\/media\/[^/]+$/.test(src) ? src + '/v1/' + spec + '/profile.png' : full(src); }
  function thumb(src) { return wix(src, 'fill/w_400,h_533,al_t,q_80'); }
  function large(src) { return wix(src, 'fit/w_1000,h_1450,q_85'); }

  function grid() {
    var pages = Math.max(1, Math.ceil(list.length / PER)), box = document.getElementById('grid');
    box.innerHTML = '';
    document.getElementById('count').textContent = list.length ? list.length + ' athletes' : '';
    if (!list.length) { box.appendChild(el('div', 'empty', 'Profiles are on the way.')); return; }
    list.slice(page * PER, page * PER + PER).forEach(function (p, i) {
      var n = page * PER + i;
      var c = el('button', 'card'); c.type = 'button'; c.setAttribute('aria-label', 'View profile ' + (n + 1));
      var img = new Image(); img.src = thumb(p.img); img.alt = ''; img.loading = 'lazy';
      img.onerror = function () { if (img.src !== full(p.img)) img.src = full(p.img); };
      c.appendChild(img);
      c.onclick = function () { enlarge(n, c); };
      box.appendChild(c);
    });
    var pg = document.getElementById('pager'); pg.innerHTML = '';
    if (list.length > 2) pg.appendChild(el('div', 'swipe', 'Swipe for more \u00b7 tap a profile to enlarge it'));
    if (pages > 1) {
      var back = el('button', null, '← Back'); back.type = 'button'; back.disabled = page === 0;
      var next = el('button', null, 'More →'); next.type = 'button'; next.disabled = page >= pages - 1;
      back.onclick = function () { page--; close(); grid(); };
      next.onclick = function () { page++; close(); grid(); };
      pg.appendChild(back); pg.appendChild(el('span', null, 'Page ' + (page + 1) + ' of ' + pages)); pg.appendChild(next);
    }
  }

  var view = document.getElementById('view'), big = document.getElementById('big');
  function show(n) {
    cur = (n + list.length) % list.length;
    big.src = large(list[cur].img);
    document.getElementById('fullsize').href = large(list[cur].img);
    big.onerror = function () { if (big.src !== full(list[cur].img)) big.src = full(list[cur].img); };
    document.getElementById('pos').textContent = 'Profile ' + (cur + 1) + ' of ' + list.length;
    // keep the grid page in step, so closing lands near this athlete
    var pg = Math.floor(cur / PER); if (pg !== page) { page = pg; grid(); }
  }
  function open(n, cardEl) {
    show(n);
    view.classList.add('on');
    var wrap = document.getElementById('wrap');
    // the profile fits inside the box (the Wix box is only as tall as two rows of cards)
    big.style.maxHeight = Math.max(320, wrap.offsetHeight - 80) + 'px';
    var place = function () {
      var y = cardEl.offsetTop, maxY = Math.max(0, wrap.offsetHeight - view.offsetHeight - 6);
      view.style.top = Math.min(y, maxY) + 'px';
    };
    place(); big.onload = place;
    document.getElementById('close').focus({ preventScroll: true });
  }
  // Tap = the profile fills the screen. Most phones and computers can make the viewer full screen right here;
  // iPhones can't (Apple only allows that for videos), so there the full-screen profile page opens instead.
  function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function enlarge(n, cardEl) {
    var req = view.requestFullscreen || view.webkitRequestFullscreen;
    if (req && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
      show(n); view.classList.add('on', 'fs'); big.style.maxHeight = '';
      try { var pr = req.call(view); if (pr && pr.catch) pr.catch(function () { view.classList.remove('on', 'fs'); toPage(n); }); }
      catch (e) { view.classList.remove('on', 'fs'); toPage(n); }
      return;
    }
    toPage(n);
  }
  function toPage(n) { var url = REPO + 'profile.html?i=' + n; try { window.top.location.href = url; } catch (e) { window.open(url, '_top'); } }
  function onFs() { if (!fsEl() && view.classList.contains('fs')) { view.classList.remove('fs'); close(); } }
  document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);
  function close() {
    if (fsEl() && view.classList.contains('fs')) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    view.classList.remove('on', 'fs'); cur = -1;
  }
  document.getElementById('close').onclick = close;
  document.getElementById('prev').onclick = function () { show(cur - 1); };
  document.getElementById('next').onclick = function () { show(cur + 1); };
  document.addEventListener('keydown', function (e) {
    if (cur < 0) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(cur - 1); else if (e.key === 'ArrowRight') show(cur + 1);
  });
  // swipe left/right on phones
  var sx = null;
  big.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  big.addEventListener('touchend', function (e) {
    if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });

  fetch(REPO + 'data/profiles.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    .then(function (j) {
      list = (j && j.profiles || []).filter(function (p) { return p && p.img; }); grid();
      // tapped on the homepage strip (athletes-strip.html): open that athlete's profile straight away
      var want = null;
      try { var h = JSON.parse(localStorage.getItem('pp-athlete') || 'null'); localStorage.removeItem('pp-athlete'); if (h && Date.now() - h.t < 120000) want = h.img; } catch (e) {}
      var n = want ? list.map(function (p) { return p.img; }).indexOf(want) : -1;
      if (n >= 0) {
        page = Math.floor(n / PER); grid();
        var cardEl = document.querySelectorAll('.card')[n % PER];
        if (cardEl) open(n, cardEl);
      }
    });
})();
</script>
</body>
</html>
