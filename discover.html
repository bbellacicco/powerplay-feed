<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, indexifembedded">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover | Powerplay Windsor</title>
<script src="share.js?v=5"></script>
<!--
  "Discover" strips for the bottom of every blog post (one Wix embed under the post).
  Two panels, Local and Pro. Each has a running scores ribbon, two featured boxes, the latest headlines,
  and buttons into the hubs. Local: the two newest Powerplay posts, story or video (videos play right in the box).
  discover.html            both panels
  discover.html?only=local one panel (only=pro for the other)
  Between the panels: the Powerplay Sports Minute player (hidden when there isn't one from the last week).
  Below the panels: the local guide (guide.js) with today's games, latest scores and the Community Calendar.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1a33; --bg2: #081428; --card: #132b57; --line: #1e3a6e; --text: #f2f5fb; --muted: #9fb0cf; --accent: #e8b021; --pro: #4f8dff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { padding: 14px 14px 16px; max-width: 1240px; margin: 0 auto; }

  /* opening band */
  .intro { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .intro img { height: 40px; width: auto; flex: none; }
  .intro .w { flex: 1; min-width: 0; }
  .intro .k { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .intro h1 { margin: 2px 0 0; font: 400 30px/1 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  .intro h1 em { font-style: normal; color: var(--accent); }
  .intro .home { flex: none; border: 1px solid rgba(232,176,33,.6); color: var(--accent); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 9px 12px; border-radius: 6px; white-space: nowrap; }
  .intro .home:hover { background: var(--accent); color: var(--bg); }

  /* a panel (Local / Pro) */
  .panel { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px;
    background: radial-gradient(120% 140% at 0% 0%, rgba(232,176,33,.10), transparent 55%), linear-gradient(180deg, #10244a, #0b1a33); --pc: var(--accent); }
  .panel.pro { background: radial-gradient(120% 140% at 0% 0%, rgba(79,141,255,.14), transparent 55%), linear-gradient(180deg, #10244a, #0b1a33); --pc: var(--pro); }
  .panel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pc); }
  .phead { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px 18px; }
  .phead h2 { margin: 0; font: 400 26px/1 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; letter-spacing: .03em; text-transform: uppercase; }
  .phead h2 em { font-style: normal; color: var(--pc); }
  /* the video pop-out (like the homepage): player, title, Share, and the video's own write-up */
  #panels { position: relative; }
  .vplayer { position: absolute; left: 14px; right: 14px; z-index: 20; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 14px 44px rgba(0,0,0,.7); display: none; }
  .vplayer.on { display: block; }
  .vplayer .fr { position: relative; aspect-ratio: 16 / 9; max-height: 62vh; margin: 0 auto; }
  .vplayer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .vplayer .cap { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #10244a; }
  .vplayer .cap .t { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vplayer .cap .x { flex: none; background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 12px; cursor: pointer; }
  .vplayer .cap #vshare:empty { display: none; }
  .vplayer .cap #vshare .pps-btn { background: var(--pc, #e8b021); color: #0b1a33; border-color: var(--pc, #e8b021); }
  .vplayer .desc { background: #10244a; border-top: 1px solid rgba(255,255,255,.08); padding: 10px 12px 12px; font-size: 13.5px; line-height: 1.45; color: #dbe3f2; }
  .vplayer .desc .txt { white-space: pre-line; overflow-wrap: anywhere; }
  .vplayer .desc.clip .txt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .vplayer .desc a { color: #e8b021; }
  .vplayer .desc .more { margin-top: 6px; background: none; border: 0; padding: 0; color: #e8b021; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer; }
  @media (max-width: 700px) { .vplayer { left: 6px; right: 6px; } .vplayer .cap .t { font-size: 13px; } }
  .ltabs { display: flex; gap: 6px; padding: 0 14px 10px 18px; overflow-x: auto; scrollbar-width: none; }
  .ltabs::-webkit-scrollbar { display: none; }
  .ltab { flex: none; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #cfd8ea; border-radius: 999px; padding: 6px 12px;
    font: 700 12px/1 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; cursor: pointer; white-space: nowrap; }
  .ltab:hover { border-color: var(--pc); color: #fff; }
  .ltab.on { background: #fff; color: #0b1a33; border-color: #fff; }
  .phead .sub { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phead .all { flex: none; color: var(--pc); font-weight: 800; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .phead .all:hover { text-decoration: underline; }

  /* running scores ribbon */
  .ribbon { position: relative; height: 34px; overflow: hidden; background: rgba(0,0,0,.28); border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent); }
  .ribbon .track { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; animation: run var(--dur, 60s) linear infinite; will-change: transform; }
  .ribbon:hover .track { animation-play-state: paused; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .sc { display: inline-flex; align-items: center; gap: 7px; padding: 0 16px; height: 100%; font-size: 12.5px; border-right: 1px solid rgba(255,255,255,.08); cursor: pointer; }
  .sc:hover { background: rgba(255,255,255,.06); }
  .sc .lg { font-size: 9.5px; font-weight: 900; letter-spacing: .08em; color: var(--pc); text-transform: uppercase; }
  .sc img { height: 18px; width: 18px; object-fit: contain; }
  .sc img.w { background: #fff; border-radius: 3px; }
  .sc b { font-weight: 800; font-variant-numeric: tabular-nums; }
  .sc .l { opacity: .55; }
  .sc .st { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--muted); }
  .sc .st.live { color: #ff4d4d; }
  .sc .st.live::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ff4d4d; margin-right: 4px; vertical-align: 1px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* the three boxes */
  .grid { display: grid; grid-template-columns: 1.55fr 1fr; grid-template-rows: auto auto; gap: 12px; padding: 12px 14px 4px 18px; }
  .story { grid-row: span 2; position: relative; border-radius: 10px; overflow: hidden; min-height: 300px; background: #0b1a33; display: block; }
  .story img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .story:hover img { transform: scale(1.05); }
  .story::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,20,40,0) 35%, rgba(8,20,40,.92) 88%); }
  .story .txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; z-index: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--pc); color: #0b1a33; font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; }
  .story h3 { margin: 8px 0 6px; font-size: 21px; line-height: 1.2; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .story .go { font-size: 12px; font-weight: 800; color: var(--pc); letter-spacing: .04em; text-transform: uppercase; }
  .story:hover .go { text-decoration: underline; }

  .vid { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; background: #000; cursor: pointer; border: 0; padding: 0; width: 100%; display: block; color: var(--text); font: inherit; text-align: left; }
  .vid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
  .vid:hover img { transform: scale(1.06); }
  .vid::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.85)); }
  .vid .pl { position: absolute; left: 50%; top: 42%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(0,0,0,.55); border: 2px solid #fff; z-index: 1; transition: transform .2s, background .2s; }
  .vid .pl::after { content: ''; position: absolute; left: 22px; top: 16px; border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
  .vid:hover .pl { transform: scale(1.12); background: var(--pc); border-color: var(--pc); }
  .vid .vt { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; z-index: 1; font-weight: 700; font-size: 13px; line-height: 1.25; }
  .vid .vt .chip { margin-bottom: 4px; }
  .vid .vt span.t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }

  /* the two newest posts: the newest is the big one on the left (story or video), the next one top right */
  .grid > .lead { grid-row: span 2; }
  .vid.lead { aspect-ratio: auto; min-height: 300px; height: 100%; }
  .vid.lead .vt { font-size: 18px; padding: 14px 16px; }
  .story.second { grid-row: auto; min-height: 0; aspect-ratio: 16 / 9; }
  .story.second h3 { font-size: 15px; margin: 6px 0 4px; }
  .story.second .txt { padding: 10px; }
  .heads { background: rgba(0,0,0,.22); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px 12px; }
  .heads .hh { font-size: 10.5px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--pc); margin: 2px 0 2px; }
  .heads a { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.1); }
  .heads a:first-of-type { border-top: 0; }
  .heads .lo { width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; }
  .heads .lo img { max-width: 30px; max-height: 30px; object-fit: contain; }
  .heads .lo b { font-size: 8.5px; font-weight: 900; letter-spacing: .03em; color: var(--pc); text-align: center; line-height: 1.05; }
  .heads .t { font-weight: 700; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .heads a:hover .t { color: var(--pc); }

  /* doors into the rest of the site */
  .doors { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 14px 18px; }
  .door { display: inline-flex; align-items: center; gap: 7px; padding: 9px 13px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); font-weight: 700; font-size: 12.5px; transition: background .2s, border-color .2s, transform .2s; }
  .door svg { width: 15px; height: 15px; fill: var(--pc); flex: none; }
  .door:hover { background: var(--pc); border-color: var(--pc); color: #0b1a33; transform: translateY(-1px); }
  .door:hover svg { fill: #0b1a33; }
  .door.new::after { content: 'NEW'; font-size: 9px; font-weight: 900; letter-spacing: .06em; background: #ff3b3b; color: #fff; padding: 2px 5px; border-radius: 3px; }

  .empty { color: var(--muted); padding: 30px 0; text-align: center; }

  /* phones: the story on top, then the video and headlines side by side as swipe cards */
  @media (max-width: 640px) {
    .wrap { padding: 10px 10px 12px; }
    .intro img { height: 32px; } .intro h1 { font-size: 24px; } .intro .home { display: none; }
    .phead { padding: 10px 12px 8px 14px; } .phead h2 { font-size: 22px; } .phead .sub { display: none; } .phead { justify-content: space-between; }
    .grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; padding: 10px 12px 4px 14px; scrollbar-width: none; }
    .grid::-webkit-scrollbar { display: none; }
    .grid > * { flex: 0 0 84%; scroll-snap-align: start; }
    .story { min-height: 0; height: 250px; } .story h3 { font-size: 18px; }
    .vid { aspect-ratio: auto; height: 250px; }
    .heads { height: 250px; overflow: hidden; }
    .doors { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 10px 12px 12px 14px; }
    .doors::-webkit-scrollbar { display: none; }
    .door { flex: none; }
  }
  @media (prefers-reduced-motion: reduce) { .ribbon .track { animation: none; } .story img, .vid img { transition: none; } }
  /* Powerplay Sports Minute: the one-minute audio update, between the headlines and Follow Powerplay */
  .minute { display: none; position: relative; overflow: hidden; align-items: center; gap: 18px; margin: 0; padding: 16px 22px 16px 16px; border-radius: 16px;
    background: radial-gradient(90px 90px at 58px 50%, rgba(232,176,33,.28), rgba(232,176,33,0)), linear-gradient(90deg, #1a3770, #0f2247); border: 2px solid var(--accent); box-shadow: 0 6px 24px rgba(232,176,33,.18); }
  .minute.on { display: flex; }
  .minute .mplay { position: relative; flex: none; width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--accent); background: #0b1a33; cursor: pointer; padding: 0; display: grid; place-items: center; animation: mglow 2.4s ease-in-out infinite; }
  .minute .mplay img { width: 62px; height: 62px; object-fit: contain; transition: transform .2s; }
  .minute .mplay:hover img { transform: scale(1.08); }
  .minute .mplay .mbadge { position: absolute; right: -4px; bottom: -4px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #0b1a33; display: grid; place-items: center; border: 3px solid #0f2247; }
  .minute .mplay .mbadge svg { width: 15px; height: 15px; }
  @keyframes mglow { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,176,33,.55); } 50% { box-shadow: 0 0 0 10px rgba(232,176,33,0); } }
  .minute.playing .mplay { animation: none; box-shadow: 0 0 0 4px rgba(232,176,33,.35); }
  .minute .mbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .minute .mtag { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; background: #d4202c; color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 4px; }
  .minute .meq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
  .minute .meq b { width: 3px; height: 4px; background: #fff; border-radius: 1px; }
  .minute.playing .meq b { animation: meq .8s ease-in-out infinite; } .minute.playing .meq b:nth-child(2) { animation-delay: .2s; } .minute.playing .meq b:nth-child(3) { animation-delay: .4s; }
  @keyframes meq { 0%, 100% { height: 3px; } 50% { height: 11px; } }
  .minute .mtop { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .minute h2 { margin: 0; font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-weight: 400; font-size: 36px; line-height: .95; letter-spacing: .03em; text-transform: uppercase; color: #fff; }
  .minute h2 em { font-style: normal; color: var(--accent); }
  .minute .msub { color: #c3cde2; font-size: 12.5px; display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; }
  .minute .mspon { display: inline-flex; align-items: center; gap: 6px; }
  .minute .mspon img { height: 22px; width: 22px; border-radius: 50%; background: #fff; object-fit: contain; }
  /* phones: everything centred, and the sponsor gets room for its full name */
  @media (max-width: 700px) {
    .minute .mbody { align-items: center; text-align: center; }
    .minute .mtag { align-self: center; }
    .minute .mtop { justify-content: center; }
    .minute .mbar { width: 100%; }
    .minute .msub { justify-content: center; flex-wrap: wrap; gap: 3px 8px; white-space: nowrap; }
    .minute .msub .dlong, .minute .msub .pby { display: none; }
    .minute .mspon { gap: 5px; }
    .minute .mspon img { height: 18px; width: 18px; flex: none; }
  }
  .minute .mbar { position: relative; height: 7px; border-radius: 4px; background: rgba(255,255,255,.16); cursor: pointer; }
  .minute .mbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: var(--accent); }
  .minute .mright { display: inline-flex; align-items: center; gap: 10px; }
  .minute .mtime { color: #c3cde2; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 700px) { .minute { margin: 0; padding: 12px 14px 12px 12px; gap: 13px; } .minute h2 { font-size: 26px; } .minute .mplay { width: 68px; height: 68px; } .minute .mplay img { width: 48px; height: 48px; }
    .minute .mplay .mbadge { width: 27px; height: 27px; } .minute .mplay .mbadge svg { width: 13px; height: 13px; } .minute .msub { font-size: 11.5px; } }
  /* here it's a slim bar between the two panels */
  #minute { margin: 0 0 14px; padding: 10px 16px 10px 10px; gap: 14px; }
  #minute .mplay { width: 62px; height: 62px; } #minute .mplay img { width: 44px; height: 44px; }
  #minute .mplay .mbadge { width: 25px; height: 25px; right: -3px; bottom: -3px; } #minute .mplay .mbadge svg { width: 12px; height: 12px; }
  #minute h2 { font-size: 28px; } #minute .mbody { gap: 6px; }
  @media (max-width: 700px) { #minute { padding: 10px 12px 10px 10px; gap: 11px; } #minute h2 { font-size: 22px; } #minute .mplay { width: 54px; height: 54px; } #minute .mplay img { width: 38px; height: 38px; } }
  /* while the Sports Minute plays, everything else blurs */
  html.mplaying #panels > *:not(#minute), html.mplaying .intro, html.mplaying #guide { filter: blur(6px) brightness(.6); pointer-events: none; }
  #panels > *, .intro, #guide { transition: filter .3s; }
</style>
<script>
// tall (portrait) photos in wide boxes: show the upper part, where faces are, instead of the middle
document.addEventListener('load', function (e) {
  var t = e.target;
  if (t && t.tagName === 'IMG' && !t.closest('.ath') && t.naturalWidth && t.naturalHeight > t.naturalWidth * 1.05) t.style.objectPosition = 'center 18%';
}, true);
</script>

<body>
<div class="wrap">
  <div class="intro">
    <img src="https://bbellacicco.github.io/powerplay-feed/logos/pp-icon.png" alt="Powerplay Windsor">
    <div class="w"><div class="k">Keep the game going</div><h1>More from <em>Powerplay Windsor</em></h1></div>
    <a class="home" id="home" target="_top">Visit the home page ›</a>
  </div>
  <div id="panels">
    <div class="vplayer" id="vplayer" role="dialog" aria-label="Video player">
      <div class="fr" id="vframe"></div>
      <div class="cap"><div class="t" id="vtitle"></div><span id="vshare"></span><button type="button" class="x" id="vclose">&#10005; Close</button></div>
      <div class="desc" id="vdesc" hidden><div class="txt" id="vdtxt"></div><button type="button" class="more" id="vdmore">Show more</button></div>
    </div>
  </div>
  <div id="minutehold" hidden>
  <section class="minute" id="minute" aria-label="Powerplay Sports Minute">
    <button class="mplay" id="mplay" type="button" aria-label="Play the Powerplay Sports Minute"><img src="https://bbellacicco.github.io/powerplay-feed/logos/pp-icon.png" alt=""><span class="mbadge" id="mbadge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></button>
    <div class="mbody">
      <span class="mtag"><span class="meq"><b></b><b></b><b></b></span>Listen now</span>
      <div class="mtop"><h2>Powerplay <em>Sports Minute</em></h2><span class="mright"><span class="mtime" id="mtime">1:00</span><span id="mshare"></span></span></div>
      <div class="mbar" id="mbar"><i id="mfill"></i></div>
      <div class="msub"><span id="mdate"></span><span class="mspon"><span class="pby">Presented by</span> <img src="https://bbellacicco.github.io/powerplay-feed/logos/st-clair-alumni.png" alt="" onerror="this.remove()"> St. Clair College Alumni</span></div>
    </div>
    <audio id="maudio" preload="none"></audio>
  </section>
  </div>
  <!-- the sports guide sits under Around Windsor-Essex (the panels lead as the first impression) -->
  <div id="guide" style="margin:14px 0 0"></div>
</div>
<script>
(function () {
  var REPO = 'https://bbellacicco.github.io/powerplay-feed/', DATA = REPO + 'data/';
  var SITE = 'https://www.powerplaywindsor.com/';
  var qs = new URLSearchParams(location.search);
  var PAGE = {
    home: SITE,
    localHub: qs.get('local') || SITE + 'scores-standings',
    proHub: qs.get('pro') || SITE + 'local-sports',
    snaps: SITE + 'game-day-snaps',
    search: SITE + 'search-1'
  };
  var TZ = 'America/Toronto';

        .sort(function (a, b) { return b.t - a.t; }).slice(0, 2);
      var usedT = {}; boxes.forEach(function (it) { usedT[it.s.url] = 1; });
      var hl = ts.filter(function (x) { return !usedT[x.url]; }).slice(0, 4).map(function (x) {
        var tg = LTAG[x.team] || ['Local', ''];
        return { url: x.url, headline: x.headline, logo: x.team === 'saints' ? saintsLogo() : tg[1], abbr: x.team === 'junior' ? (x.club || 'Junior').replace(/^(Windsor|St\. Clair)\s+/, '') : tg[0] };
      });
      fillGrid(P.grid, boxes.map(function (it, n) { var b = it.kind === 'story' ? storyBox(it.s, cat(it.s), 'Read the story \u203a') : videoBox(it.s, 'Powerplay video'); if (b) b.classList.add(n ? 'second' : 'lead'); return b; })
        .concat([hl.length && headsBox('Latest headlines', hl)]));
      return;
    }
    // the two boxes: your two newest posts, story or video, newest first
    var latest = ppStories.map(function (s) { return { kind: 'story', s: s, t: new Date(s.published).getTime() }; })
      .concat(vids.map(function (v) { return { kind: 'video', s: v, t: new Date(v.published).getTime() }; }))
      .sort(function (a, b) { return b.t - a.t; }).slice(0, 2);
    var used = {}; latest.forEach(function (it) { used[it.s.url] = 1; });
    // headlines: newest local stories, one per team, not the ones in the boxes
    var seen = {}, heads = [];
    stories.forEach(function (s) {
      if (heads.length >= 4 || isVid(s) || used[s.url]) return;
      var key = s.team === 'junior' ? s.club : s.team; if (seen[key]) return; seen[key] = 1;
      var tg = LTAG[s.team] || ['Local', ''];
      var logo = s.team === 'saints' ? saintsLogo() : tg[1];
      heads.push({ url: s.url, headline: s.headline, logo: logo, abbr: s.team === 'junior' ? (s.club || 'Junior').replace(/^(Windsor|St\. Clair)\s+/, '') : tg[0] });
    });
    fillGrid(P.grid, latest.map(function (it, n) { var b = it.kind === 'story' ? storyBox(it.s, cat(it.s), 'Read the story ›') : videoBox(it.s, 'Powerplay video'); if (b) b.classList.add(n ? 'second' : 'lead'); return b; })
      .concat([heads.length && headsBox('Latest headlines', heads)]));
    var games = (lg && lg.games || []).filter(function (g) { return g.team !== 'highschool'; }).concat(hs && hs.games || []);
    if (!P.ribbonDone) { P.ribbonDone = 1; ribbon(P.ribbon, localScores(games, lg && lg.teams || {})); }
  }

  // ---------- PRO ----------
  var FAN = [['Red Wings', /red wings/i, 'nhl', 'nhl/500/det'], ['Maple Leafs', /maple leafs|\bleafs\b/i, 'nhl', 'nhl/500/tor'], ['Lions', /detroit lions|^lions$/i, 'nfl', 'nfl/500/det'],
    ['Tigers', /\btigers\b/i, 'mlb', 'mlb/500/det'], ['Blue Jays', /blue jays|\bjays\b/i, 'mlb', 'mlb/500/tor'], ['Pistons', /pistons/i, 'nba', 'nba/500/det'],
    ['Raptors', /raptors/i, 'nba', 'nba/500/tor'], ['Canadiens', /canadiens|\bhabs\b/i, 'nhl', 'nhl/500/mtl']];
  function fanOf(x) {
    var hay = (x.headline || '') + ' | ' + (x.teams || []).join(' | ');
    for (var i = 0; i < FAN.length; i++) if ((!FAN[i][2] || FAN[i][2] === x.league) && (FAN[i][1].test(hay) || (x.teams || []).some(function (n) { return FAN[i][1].test(n); }))) return FAN[i];
    return null;
  }
  function fanChannel(ch) { for (var i = 0; i < FAN.length; i++) if (FAN[i][1].test(ch || '') || (ch || '').toLowerCase() === FAN[i][0].toLowerCase()) return FAN[i]; return null; }
  var PATHS = { nfl: 'football/nfl', nhl: 'hockey/nhl', nba: 'basketball/nba', mlb: 'baseball/mlb' };
  var OUR = { nfl: ['DET', 'BUF'], nhl: ['DET', 'TOR', 'MTL'], nba: ['DET', 'TOR'], mlb: ['DET', 'TOR'] };
  function ymd(d) { var p = parts(d); return p.year + ('0' + p.month).slice(-2) + ('0' + p.day).slice(-2); }
  function espnDay(d) {
    return Promise.all(Object.keys(PATHS).map(function (k) {
      return fetch('https://site.api.espn.com/apis/site/v2/sports/' + PATHS[k] + '/scoreboard?dates=' + ymd(d)).then(function (r) { return r.ok ? r.json() : { events: [] }; })
        .then(function (j) { return (j.events || []).filter(function (e) {
          return e.competitions[0].competitors.some(function (c) { return OUR[k].indexOf(c.team.abbreviation) >= 0; }) || (e.season && e.season.type === 3);
        }).map(function (e) { e._lg = k; return e; }); }).catch(function () { return []; });
    })).then(function (r) { return [].concat.apply([], r); });
  }
  function proScores() {
    var now = Date.now();
    return Promise.all([-1, 0, 1].map(function (o) { return espnDay(new Date(now + o * 864e5)); })).then(function (r) {
      var all = [].concat.apply([], r), seen = {};
      all = all.filter(function (e) { if (seen[e.id]) return false; seen[e.id] = 1; return true; })
        .filter(function (e) { return e.status.type.state !== 'post' || now - new Date(e.date).getTime() < 36 * 3600e3; });
      var rank = function (e) { var s = e.status.type.state; return s === 'in' ? 0 : s === 'post' ? 1 : 2; };
      all.sort(function (a, b) { return rank(a) - rank(b) || (rank(a) === 1 ? (a.date < b.date ? 1 : -1) : (a.date < b.date ? -1 : 1)); });
      var today = dayKey(new Date());
      return all.slice(0, 16).map(function (e) {
        var comp = e.competitions[0], st = e.status.type, d = new Date(e.date);
        var side = function (h) { var x = comp.competitors.filter(function (c) { return c.homeAway === h; })[0] || {}; return x; };
        var A = side('away'), H = side('home');
        var mk = function (x, o) { return { n: (x.team || {}).abbreviation || '', s: st.state === 'pre' ? null : x.score, logo: (x.team || {}).logo || '', lost: st.state === 'post' && x.winner === false && o.winner }; };
        return scoreChip({ lg: e._lg.toUpperCase(), a: mk(A, H), h: mk(H, A), final: st.state === 'post', live: st.state === 'in',
          status: st.state === 'in' ? (st.shortDetail || 'LIVE') : st.state === 'post' ? 'FINAL' + (dayKey(d) === today ? '' : ' · ' + wkday(d).toUpperCase()) : (dayKey(d) === today ? '' : wkday(d) + ' ') + cpTime(d),
          url: PAGE.proHub, tab: 'pro' });
      });
    }).catch(function () { return []; });
  }
  function buildPro(P, lg, net) {
    var recent = Date.now() - 4 * 864e5;
    var pro = (lg && (lg.pro_news || []).concat(lg.more_news || []) || []).filter(function (x) { return x.headline && x.url && new Date(x.published).getTime() > recent; })
      .sort(function (a, b) { return new Date(b.published) - new Date(a.published); });
    var seenU = {}; pro = pro.filter(function (x) { if (seenU[x.url]) return false; seenU[x.url] = 1; return true; });
    var ours = pro.filter(function (x) { return fanOf(x) && !x.video && x.image; });
    var big = pro.filter(function (x) { return /^(nhl|nfl|mlb|nba)$/.test(x.league) && !x.video && x.image; });
    var story = pickOne(ours.length ? ours : big, 3);
    // video: newest from our teams' own channels (Pro Network), else any pro video
    var pv = (net && net.pro || []).filter(function (v) { return v.u && v.t && v.i; }).sort(function (a, b) { return new Date(b.p) - new Date(a.p); });
    var mine = pv.filter(function (v) { return fanChannel(v.ch); });
    var vv = pickOne(mine.length ? mine : pv, 3), video = vv && { headline: vv.t, url: vv.u, image: vv.i, ch: vv.ch };
    var heads = [], usedU = {}; if (story) usedU[story.url] = 1;
    var add = function (x) {
      if (heads.length >= 4 || usedU[x.url]) return; usedU[x.url] = 1;
      var f = fanOf(x);
      heads.push({ url: x.url, headline: x.headline, logo: f ? 'https://a.espncdn.com/i/teamlogos/' + f[3] + '.png' : /^(nhl|nfl|mlb|nba|wnba|mls)$/.test(x.league) ? 'https://a.espncdn.com/i/teamlogos/leagues/500/' + x.league + '.png' : '', abbr: (f ? f[0] : (x.league || 'Pro')).toUpperCase() });
    };
    ours.concat(pro.filter(function (x) { return fanOf(x); })).slice(0, 2).forEach(add);
    pro.filter(function (x) { return /^(nhl|nfl|mlb|nba)$/.test(x.league); }).forEach(add);
    pro.forEach(add);
    var sf = story && fanOf(story);
    fillGrid(P.grid, [story && storyBox(story, sf ? sf[0] : (story.league || 'Pro').toUpperCase(), (story.source ? story.source + ' · ' : '') + 'Read it ›'),
      video && videoBox(video, video.ch || 'Pro video'), heads.length && headsBox('Pro headlines', heads)]);
    proScores().then(function (items) { ribbon(P.ribbon, items); });
  }

  // ---------- go ----------
  var only = qs.get('only');
  var L = only === 'pro' ? null : panel('local', 'Around', 'Windsor-Essex', 'Local stories, video and scores', PAGE.localHub, 'scores');
  if (only !== 'pro' && only !== 'local') document.getElementById('panels').appendChild(document.getElementById('minute'));   // the Sports Minute, between the two panels
  var R = only === 'local' ? null : panel('pro', 'Around the', 'Pros', 'Our teams: Wings, Leafs, Lions, Tigers, Jays, Pistons, Raptors', PAGE.proHub, 'pro');
  if (L) [['Local Scoreboard', PAGE.localHub, 'scores', 'score'], ['Standings', PAGE.localHub, 'scores', 'table'], ['Game Day Snaps', PAGE.snaps, null, 'camera', true],
          ['Athlete Profiles', PAGE.localHub, 'athletes', 'person'], ['Powerplay Network', PAGE.localHub, 'network', 'play'], ['Spotlight', PAGE.localHub, 'spotlight', 'star']]
    .forEach(function (d) { L.doors.appendChild(door(d[0], d[1], d[2], d[3], d[4])); });
  if (R) [['Pro Scoreboard', PAGE.proHub, 'pro', 'score'], ['Pro Updates', PAGE.proHub, 'pro-updates', 'news'], ['Pro Network', PAGE.proHub, 'pro-network', 'play'], ['Search the site', PAGE.search, null, 'search']]
    .forEach(function (d) { R.doors.appendChild(door(d[0], d[1], d[2], d[3])); });

  Promise.all([getJSON('local-news.json'), getJSON('local-games.json'), getJSON('highschool.json'), getJSON('network.json'), getJSON('team-logos.json')]).then(function (r) {
    if (r[4] && r[4].logos) TEAM_LOGOS = r[4].logos;
    if (L) buildLocal(L, r[0], r[1], r[2], r[3]);
    if (R) buildPro(R, r[1], r[3]);
  });
})();
</script>
<script>
// Powerplay Sports Minute: data/sports-minute.json {url, date, seconds, bed}; shows for a week after it's made.
// The music bed (bed) plays under the voice: up front for an intro, down while the voice talks, then up and out.
(function () {
  var box = document.getElementById('minute'), au = document.getElementById('maudio'), btn = document.getElementById('mplay'), badge = document.getElementById('mbadge');
  var fill = document.getElementById('mfill'), tm = document.getElementById('mtime'), bar = document.getElementById('mbar');
  var BASE = 'https://bbellacicco.github.io/powerplay-feed/';
  var PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
  var MON = ['Jan.', 'Feb.', 'March', 'April', 'May', 'June', 'July', 'Aug.', 'Sept.', 'Oct.', 'Nov.', 'Dec.'];
  var DAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var UP = 0.6, UNDER = 0.13, INTRO = 2000;
  var BED = null, bed = null, ctx = null, gain = null, playing = false, started = false, timers = [];
  function t(s) { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  fetch(BASE + 'data/sports-minute.json?t=' + Math.floor(Date.now() / 3e5)).then(function (r) { return r.json(); }).then(function (j) {
    var d = new Date(j.date);
    if (!j.url || isNaN(d) || Date.now() - d > 7 * 864e5) return;
    au.crossOrigin = 'anonymous'; au.src = BASE + j.url; BED = j.bed || null;
    document.getElementById('mdate').innerHTML = '<span class="dlong">' + DAY[d.getDay()] + ', </span>' + MON[d.getMonth()] + ' ' + d.getDate();
    if (j.seconds) tm.textContent = t(j.seconds);
    box.classList.add('on');
    if (window.PPShare && !document.querySelector('#mshare .pps-btn'))
      document.getElementById('mshare').appendChild(PPShare.button({ title: 'Powerplay Sports Minute', url: 'https://www.powerplaywindsor.com/scores-standings?strip=minute', image: 'https://bbellacicco.github.io/powerplay-feed/logos/strip-minute-share.jpg', text: 'Listen to the Powerplay Sports Minute on Powerplay Windsor' }));
  }).catch(function () {});
  function setupBed() {
    if (ctx !== null || !window.AudioContext && !window.webkitAudioContext) return;
    try {   // Web Audio: the bed's level (phones ignore a plain volume setting) and the voice on both speakers
      // iPhones mute Web Audio when the ring switch is on silent; 'playback' makes it play like the voice does
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      // the voice is a one-channel (mono) file: send it to the left and right speakers equally
      var vs = ctx.createMediaElementSource(au), both = ctx.createChannelMerger(2);
      vs.connect(both, 0, 0); vs.connect(both, 0, 1); both.connect(ctx.destination);
      if (BED) {
        bed = new Audio(); bed.crossOrigin = 'anonymous'; bed.loop = false; bed.preload = 'auto'; bed.src = BASE + BED;
        // a long read: the music picks up again after its quiet opening instead of stopping
        bed.onended = function () { if (!au.paused && !au.ended) { bed.currentTime = 2.2; bed.play().catch(function () {}); } };
        gain = ctx.createGain(); gain.gain.value = 0;
        ctx.createMediaElementSource(bed).connect(gain); gain.connect(ctx.destination);
      }
      window.PPMinuteMix = { ctx: ctx, gain: gain, bed: bed };
    } catch (e) { ctx = false; }
  }
  function level(v, sec) {
    if (!bed) return;
    if (ctx && gain) { var n = ctx.currentTime; gain.gain.cancelScheduledValues(n); gain.gain.setValueAtTime(gain.gain.value, n); gain.gain.linearRampToValueAtTime(v, n + (sec || 0.01)); }
    else bed.volume = Math.min(1, v);
  }
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function ui(on) { playing = on; box.classList.toggle('playing', on); document.documentElement.classList.toggle('mplaying', on); try { parent.postMessage({ ppMinute: on ? 'play' : 'stop' }, '*'); } catch (e) {} badge.innerHTML = on ? PAUSE : PLAY; btn.setAttribute('aria-label', on ? 'Pause' : 'Play the Powerplay Sports Minute'); }
  function start() {
    setupBed(); ui(true);
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (!bed) { au.play(); return; }
    bed.play().catch(function () {});
    if (!started && au.currentTime < 0.2) {          // from the top: music intro, then the voice
      started = true; level(UP, 0.05);
      later(function () { level(UNDER, 0.4); au.play(); }, INTRO);
    } else { level(UNDER, 0.3); au.play(); }
  }
  function stop() { clear(); au.pause(); if (bed) bed.pause(); ui(false); }
  btn.onclick = function () { if (playing) stop(); else start(); };
  au.onended = function () {
    started = false;
    if (!bed) { ui(false); return; }
    level(UP, 0.4);                                   // music swells, then fades out
    later(function () { level(0, 1.2); }, 1300);
    later(function () { bed.pause(); bed.currentTime = 0; ui(false); fill.style.width = '0%'; }, 2600);
  };
  au.ontimeupdate = function () { if (au.duration) { fill.style.width = (100 * au.currentTime / au.duration) + '%'; tm.textContent = t(au.currentTime) + ' / ' + t(au.duration); } };
  bar.onclick = function (e) { if (!au.duration) { if (!playing) start(); return; } var r = bar.getBoundingClientRect(); au.currentTime = au.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); started = true; };
})();
</script>
